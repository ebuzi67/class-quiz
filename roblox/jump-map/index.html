<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로블록스 스튜디오 점프맵(Obby) 마스터 퀴즈</title>
    <style>
        :root {
            --primary-color: #ff5722;
            --secondary-color: #4caf50;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 24px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .quiz-info {
            display: flex;
            justify-content: space-between;
            background: #fff3e0;
            padding: 10px 15px;
            border-radius: 10px;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 14px;
            color: #e65100;
        }
        .question-box {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .options-list {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
        }
        .option-item {
            background: #f9fbfd;
            border: 2px solid #e1e8ed;
            padding: 12px 18px;
            margin-bottom: 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 16px;
        }
        .option-item:hover {
            background: #ffe0b2;
            border-color: var(--primary-color);
        }
        .option-item.selected {
            background: #ffe0b2;
            border-color: var(--primary-color);
            font-weight: bold;
        }
        .option-item.correct {
            background: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724;
        }
        .option-item.wrong {
            background: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24;
        }
        .explanation {
            background: #fff8e1;
            border-left: 5px solid #ffc107;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            font-size: 14px;
            line-height: 1.4;
            display: none;
        }
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #e64a19;
        }
        .btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .result-container {
            text-align: center;
            display: none;
        }
        .result-score {
            font-size: 48px;
            font-weight: bold;
            color: var(--secondary-color);
            margin: 20px 0;
        }
    </style>
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#ff5722">
    <link rel="icon" href="../icons/icon-192.png">
    <link rel="apple-touch-icon" href="../icons/icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="로블록스 퀴즈">
    <style>
        .back { display: inline-block; margin-bottom: 6px; color: #666; font-size: 14px; text-decoration: none; }
        .back:hover { color: var(--primary-color); }
    </style>
</head>
<body>

<div class="container">
    <a class="back" href="../">← 퀴즈 고르기</a>
    <h1>roblox 점프맵(Obby) 스튜디오 퀴즈</h1>
    <div class="subtitle">유튜버 옐롯과 함께하는 점프맵 제작 핵심 개념 다지기</div>

    <!-- 퀴즈 화면 -->
    <div id="quiz-screen">
        <div class="quiz-info">
            <span id="question-progress">스테이지 1 / 10</span>
            <span id="score-board">점수: 0점</span>
        </div>
        <div class="question-box" id="question-text">문제 로딩 중...</div>
        <ul class="options-list" id="options-container">
            <!-- 보기 동적 생성 -->
        </ul>
        <div class="explanation" id="explanation-box"></div>
        <button class="btn" id="next-btn" onclick="nextQuestion()" disabled>정답 제출 및 다음</button>
    </div>

    <!-- 결과 화면 -->
    <div class="result-container" id="result-screen">
        <h2>🎉 점프맵 완주 성공! 수고하셨습니다!</h2>
        <p>나의 로블록스 점프맵(Obby) 스튜디오 실력은?</p>
        <div class="result-score" id="final-score">0점</div>
        <p id="result-message" style="margin-bottom: 25px; font-size: 16px;"></p>
        <button class="btn" onclick="restartQuiz()">처음부터 다시 도전</button>
    </div>
</div>

<script>
    // 정답 인덱스(answer)가 0, 1, 2, 3 골고루 섞이도록 설계된 문제 데이터
    const quizData = [
        {
            question: "1. 옐롯의 점프맵 책 1장에서 다루는, 캐릭터가 밟았을 때 캐릭터를 즉시 파괴(사망)시키고 시작점으로 돌려보내는 블록의 이름은?",
            options: [
                "슬라임 점프대",
                "킬브릭 (KillBrick / 데스브릭)",
                "홀로그램 발판",
                "힐링 포션 파트"
            ],
            answer: 1, // 두 번째 보기
            explanation: "정답은 '킬브릭 (KillBrick / 데스브릭)'입니다! 닿으면 캐릭터가 죽도록 설정하는 킬브릭은 점프맵의 필수 요소입니다."
        },
        {
            question: "2. 캐릭터가 킬브릭에 닿았을 때 체력을 0으로 만들거나 강제로 리스폰시키기 위해 파트에 추가하는 스크립트 이벤트는?",
            options: [
                "MouseClick 이벤트",
                "KeyPressed 이벤트",
                "Touched 이벤트",
                "Chatted 이벤트"
            ],
            answer: 2, // 세 번째 보기
            explanation: "정답은 'Touched 이벤트'입니다! 플레이어가 블록에 닿았는지를 감지하는 Touched 이벤트를 사용하여 데미지를 줍니다."
        },
        {
            question: "3. 점프맵 도중 죽었을 때 맨 처음이 아니라 가장 최근에 도달한 안전한 장소로 부활하게 해주는 시스템은?",
            options: [
                "체크포인트 (Checkpoint) 시스템",
                "텔레포트 게이트",
                "자동 아이템 상점",
                "서버 저장 리더보드"
            ],
            answer: 0, // 첫 번째 보기
            explanation: "정답은 '체크포인트 (Checkpoint) 시스템'입니다! 체크포인트에 닿으면 플레이어의 위치가 해당 지점으로 업데이트됩니다."
        },
        {
            question: "4. 점프맵에 재미를 더하기 위해 일정한 간격으로 좌우나 위아래로 움직이는 발판을 만들 때 주로 사용하는 로블록스 기능은?",
            options: [
                "컴퓨터 마우스 감도 조절기",
                "그래픽 셰이더 설정",
                "배경음악(BGM) 자동 재생기",
                "트윈서비스 (TweenService) 또는 반복 이동 스크립트"
            ],
            answer: 3, // 네 번째 보기
            explanation: "정답은 '트윈서비스 (TweenService) 또는 반복 이동 스크립트'입니다! 발판을 부드럽게 이동시키거나 회전시킬 때 활용합니다."
        },
        {
            question: "5. 점프맵 맵 전체의 분위기와 하늘 배경, 구름 등을 멋지게 꾸미기 위해 스튜디오에서 수정하는 속성은?",
            options: [
                "스카이박스 (Skybox) 및 조명(Lighting)",
                "플레이어 점프 힘 수치",
                "키보드 방향키 설정",
                "상점 아이템 가격표"
            ],
            answer: 0, // 첫 번째 보기
            explanation: "정답은 '스카이박스 (Skybox) 및 조명(Lighting)'입니다! 다양한 분위기의 점프맵을 연출할 수 있습니다."
        },
        {
            question: "6. 점프맵 마지막 관문을 통과했을 때 화면에 멋지게 나타나며 클리어를 축하해 주는 UI 요소는?",
            options: [
                "컴퓨터 전원 차단 버튼",
                "게임 클리어 ScreenGui 및 축하 메시지 창",
                "맵 전체 삭제 스크립트",
                "에러 로그 경고창"
            ],
            answer: 1, // 두 번째 보기
            explanation: "정답은 '게임 클리어 ScreenGui 및 축하 메시지 창'입니다! 마지막 파트에 도달했을 때 클리어 화면을 보여줍니다."
        },
        {
            question: "7. 플레이어가 점프맵을 더 멀리, 더 높이 뛰어넘을 수 있도록 캐릭터의 점프 파워(JumpPower)나 속도를 조절하는 곳은?",
            options: [
                "로블록스 공식 홈페이지 로그인 창",
                "모델링 파트의 투명도 조절바",
                "채팅창 명령어 입력 공간",
                "StarterPlayer 속성 내부의 설정"
            ],
            answer: 3, // 네 번째 보기
            explanation: "정답은 'StarterPlayer 속성 내부의 설정'입니다! 여기서 점프 높이나 이동 속도 기본값을 조절할 수 있습니다."
        },
        {
            question: "8. 점프맵 중간에 투명해서 보이지 않지만 밟으면 떨어지는 '페이크 발판(함정)'을 만들 때 조절하는 파트의 속성은?",
            options: [
                "Material (재질)과 BrickColor (색상)",
                "Transparency (투명도)와 CanCollide (충돌 여부)",
                "Size (크기)와 Orientation (방향)",
                "Anchored (고정 여부) 해제"
            ],
            answer: 1, // 두 번째 보기
            explanation: "정답은 'Transparency (투명도)와 CanCollide (충돌 여부)'입니다! 투명도를 조절하고 충돌을 꺼서 함정을 만듭니다."
        },
        {
            question: "9. 점프맵에서 발판들이 공중에 안정적으로 떠 있거나 바람에 흔들리지 않도록 반드시 체크해야 하는 파트의 기본 속성은?",
            options: [
                "Locked (잠금)",
                "CastShadow (그림자 생성)",
                "Anchored (고정됨)",
                "CanQuery (쿼리 가능)"
            ],
            answer: 2, // 세 번째 보기
            explanation: "정답은 'Anchored (고정됨)'입니다! 파트가 물리법칙 때문에 아래로 떨어지지 않도록 반드시 체크해야 합니다."
        },
        {
            question: "10. 내가 만든 점프맵 게임을 친구들과 함께 플레이하거나 공유하기 위해 로블록스 스튜디오에서 진행해야 하는 작업은?",
            options: [
                "게임 공개 발행 (Publish to Roblox)",
                "컴퓨터 포맷 및 재부팅",
                "스튜디오 프로그램 삭제",
                "소스 코드 메모장 백업"
            ],
            answer: 0, // 첫 번째 보기
            explanation: "정답은 '게임 공개 발행 (Publish to Roblox)'입니다! 이 기능을 통해 게임을 업로드하고 공개로 설정할 수 있습니다."
        }
    ];

    let currentIdx = 0;
    let score = 0;
    let selectedOption = null;
    let isAnswered = false;

    const questionProgress = document.getElementById('question-progress');
    const scoreBoard = document.getElementById('score-board');
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const explanationBox = document.getElementById('explanation-box');
    const nextBtn = document.getElementById('next-btn');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const finalScore = document.getElementById('final-score');
    const resultMessage = document.getElementById('result-message');

    function loadQuiz() {
        selectedOption = null;
        isAnswered = false;
        explanationBox.style.display = 'none';
        nextBtn.disabled = true;
        nextBtn.innerText = "정답 제출하기";

        const current = quizData[currentIdx];
        questionProgress.innerText = `스테이지 ${currentIdx + 1} / ${quizData.length}`;
        scoreBoard.innerText = `점수: ${score}점`;
        questionText.innerText = current.question;

        optionsContainer.innerHTML = '';
        current.options.forEach((opt, idx) => {
            const li = document.createElement('li');
            li.className = 'option-item';
            li.innerText = `${idx + 1}) ${opt}`;
            li.onclick = () => selectOption(idx, li);
            optionsContainer.appendChild(li);
        });
    }

    function selectOption(idx, element) {
        if (isAnswered) return;
        
        document.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');
        selectedOption = idx;
        nextBtn.disabled = false;
    }

    function nextQuestion() {
        if (!isAnswered) {
            isAnswered = true;
            const current = quizData[currentIdx];
            const optionItems = document.querySelectorAll('.option-item');

            if (selectedOption === current.answer) {
                optionItems[selectedOption].classList.add('correct');
                score += 10;
                scoreBoard.innerText = `점수: ${score}점`;
            } else {
                optionItems[selectedOption].classList.add('wrong');
                optionItems[current.answer].classList.add('correct');
            }

            explanationBox.innerText = current.explanation;
            explanationBox.style.display = 'block';

            if (currentIdx === quizData.length - 1) {
                nextBtn.innerText = "완주 결과 보기";
            } else {
                nextBtn.innerText = "다음 스테이지";
            }
        } else {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuiz();
            } else {
                showResult();
            }
        }
    }

    function showResult() {
        quizScreen.style.display = 'none';
        resultScreen.style.display = 'block';
        finalScore.innerText = `${score}점`;

        let msg = "";
        if (score === 100) {
            msg = "🏆 완벽한 점프맵 마스터! 옐롯의 점프맵 책 내용을 전부 통달하셨네요!";
        } else if (score >= 70) {
            msg = "👏 훌륭해요! 멋진 오비(Obby) 게임을 직접 만들 수 있는 탄탄한 실력입니다.";
        } else {
            msg = "💡 킬브릭과 체크포인트 개념을 다시 복습하고 도전하면 멋진 점프맵을 완성할 수 있어요!";
        }
        resultMessage.innerText = msg;
    }

    function restartQuiz() {
        currentIdx = 0;
        score = 0;
        resultScreen.style.display = 'none';
        quizScreen.style.display = 'block';
        loadQuiz();
    }

    // 초기 실행
    loadQuiz();
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("../sw.js").catch(() => {}));
    }
</script>

</body>
</html>
