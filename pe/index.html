<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>체육시간</title>
<meta name="theme-color" content="#F4FBF7">
<link rel="icon" href="jumprope/icons/icon-192.png">
<link rel="apple-touch-icon" href="jumprope/icons/icon-180.png">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #F4FBF7; color: #24304A;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 20px; line-height: 1.5; display: flex; justify-content: center; padding: 24px 16px;
  }
  .app { width: 100%; max-width: 560px; }
  h1 { text-align: center; font-size: 1.7em; margin: 8px 0 4px; }
  .sub { text-align: center; color: #6b7a8c; margin: 0 0 20px; font-size: .85em; }
  a.card {
    display: flex; gap: 16px; align-items: center; text-decoration: none; color: inherit;
    background: #fff; border: 2px solid #d7eee2; border-radius: 18px; padding: 18px; margin-bottom: 14px;
  }
  a.card:hover, a.card:focus { border-color: #5fbf92; }
  a.card .em { width: 64px; height: 64px; border-radius: 14px; flex: none; display: grid; place-items: center; font-size: 38px; }
  a.card b { display: block; font-size: 1.1em; }
  a.card small { color: #6b7a8c; }
  .note { text-align: center; color: #6b7a8c; font-size: .8em; margin-top: 20px; }
</style>
</head>
<body>
  <div class="app">
    <h1>🤸 체육시간</h1>
    <p class="sub">카메라가 몸 움직임을 알아봐요. 집에서 아이와 함께 해 보세요!</p>
    <a class="card" href="mugunghwa/">
      <span class="em" style="background:#FFE3EC">🌸</span>
      <span><b>무궁화 꽃이 피었습니다</b><small>노래하는 동안 달리고, "얼음!" 때는 꼼짝 마!</small></span>
    </a>
    <a class="card" href="jumprope/">
      <span class="em" style="background:#E6E9FF">🪢</span>
      <span><b>줄넘기 챌린지</b><small>화면 속 줄이 발밑을 지날 때 콩! 점프. 진짜 줄 30초 기록도 돼요</small></span>
    </a>
    <p class="note">게임마다 따로 앱으로 설치할 수 있어요. 게임을 연 다음 "📲 홈 화면에 설치"를 눌러요.</p>
    <p class="note">노트북·태블릿을 세워 두고 2~3걸음 뒤에서, 머리부터 발끝까지 보이게 서서 해요.<br>카메라 영상은 기기 안에서만 쓰고 어디에도 보내지 않아요.</p>
  </div>
</body>
</html>
