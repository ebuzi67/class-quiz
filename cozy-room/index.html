<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ff9a8f" />
    <meta name="description" content="3D 방에서 모모의 하루를 블록 코딩으로 정해 보는 방과후 코딩 수업 앱" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="모모의 하루" />
    <title>모모의 코딩 하루</title>
    <script type="module" crossorigin src="./assets/index-CYOXF8i5.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/three-D3GgKW9U.js">
    <link rel="stylesheet" crossorigin href="./assets/index-Dp9n-XEC.css">
  </head>
  <body>
    <a class="skip" href="#tools">도구 버튼으로 건너뛰기</a>
    <main id="app">
      <div id="stage" class="stage">
        <canvas id="scene" tabindex="0" aria-label="모모의 3D 방. 화살표 키로 돌리고 + - 키로 확대해요. 물건은 '물건 목록' 버튼으로도 고를 수 있어요."></canvas>
        <div id="bubble" class="bubble" aria-hidden="true" hidden></div>
        <div id="hover-tip" class="hover-tip" aria-hidden="true" hidden></div>
      </div>

      <header class="topbar">
        <h1 class="title"><span aria-hidden="true">🏠</span> <span id="title-text">모모의 코딩 하루</span></h1>
        <div id="gauges" class="gauges" role="group" aria-label="모모의 상태"></div>
      </header>

      <div class="status-wrap">
        <p id="status" class="status" role="status" aria-live="polite">준비 중…</p>
        <ol id="queue" class="queue" aria-label="다음에 할 일"></ol>
      </div>

      <nav id="tools" class="tools" aria-label="도구">
        <button type="button" data-act="auto" aria-pressed="true" title="자동 행동 멈추기/다시 하기"><span aria-hidden="true">⏸️</span><span class="lbl">자동 멈춤</span></button>
        <button type="button" data-act="things" title="물건 목록에서 고르기"><span aria-hidden="true">📋</span><span class="lbl">물건 목록</span></button>
        <button type="button" data-act="camera" title="카메라 처음 자리로"><span aria-hidden="true">🎥</span><span class="lbl">카메라</span></button>
        <button type="button" data-act="sound" aria-pressed="false" title="소리 켜기/끄기"><span aria-hidden="true">🔇</span><span class="lbl">소리 꺼짐</span></button>
        <button type="button" data-act="speed" aria-pressed="false" title="빠르게 (2배속)"><span aria-hidden="true">🐢</span><span class="lbl">보통 빠르기</span></button>
        <button type="button" data-act="big" aria-pressed="false" title="전자칠판용 큰 화면"><span aria-hidden="true">🔍</span><span class="lbl">큰 화면</span></button>
        <button type="button" data-act="help" title="사용 방법"><span aria-hidden="true">❓</span><span class="lbl">도움말</span></button>
        <button type="button" data-act="code" class="code-btn" aria-expanded="false" aria-controls="panel"><span aria-hidden="true">🧩</span><span class="lbl">코딩 모드</span></button>
      </nav>

      <div id="menu" class="menu" role="dialog" aria-modal="false" aria-labelledby="menu-title" hidden></div>

      <aside id="panel" class="panel" aria-label="코딩 모드" hidden>
        <div class="panel-head">
          <div class="tabs" role="tablist" aria-label="코딩 모드 탭">
            <button role="tab" id="tab-blocks" aria-controls="pane-blocks" aria-selected="true">🧩 블록</button>
            <button role="tab" id="tab-missions" aria-controls="pane-missions" aria-selected="false" tabindex="-1">🏅 미션 <span id="mission-count" class="pill">0/0</span></button>
            <button role="tab" id="tab-share" aria-controls="pane-share" aria-selected="false" tabindex="-1">🔗 공유</button>
          </div>
          <button type="button" class="icon-btn" data-act="close-panel" aria-label="코딩 모드 닫기">✕</button>
        </div>
        <section id="pane-blocks" class="pane" role="tabpanel" aria-labelledby="tab-blocks">
          <div class="runbar">
            <button type="button" id="run" class="btn run">▶ 실행</button>
            <button type="button" id="stop" class="btn stop" disabled>■ 멈춤</button>
            <label class="step-toggle"><input type="checkbox" id="step-mode" /> 한 단계씩</label>
            <button type="button" id="step-next" class="btn next" hidden>다음 ⏭</button>
            <button type="button" id="show-code" class="btn ghost">📜 코드 보기</button>
          </div>
          <p id="run-state" class="run-state" role="status" aria-live="polite">블록을 넣고 ▶ 실행을 눌러 보세요.</p>
          <div class="editor">
            <div id="palette" class="palette" aria-label="블록 꾸러미 (누르면 선택한 칸에 들어가요)"></div>
            <div id="workspace" class="workspace" aria-label="내 코드"></div>
          </div>
          <div id="trash" class="trash" aria-hidden="true">🗑️ 여기에 놓으면 지워져요</div>
        </section>
        <section id="pane-missions" class="pane" role="tabpanel" aria-labelledby="tab-missions" hidden></section>
        <section id="pane-share" class="pane" role="tabpanel" aria-labelledby="tab-share" hidden>
          <h2>내 코드 공유하기</h2>
          <p class="muted">이 글자를 복사해서 친구에게 보내면, 친구가 "불러오기"로 내 코드를 그대로 볼 수 있어요.</p>
          <label for="share-out" class="sr-only">내 공유 코드</label>
          <textarea id="share-out" readonly rows="3"></textarea>
          <div class="row">
            <button type="button" id="copy-code" class="btn">📋 코드 복사</button>
            <button type="button" id="copy-link" class="btn ghost">🔗 링크 복사</button>
          </div>
          <h2>친구 코드 불러오기</h2>
          <label for="share-in" class="sr-only">친구 공유 코드 붙여 넣기</label>
          <textarea id="share-in" rows="3" placeholder="MOMO1- 로 시작하는 코드를 붙여 넣어요"></textarea>
          <div class="row">
            <button type="button" id="load-code" class="btn">📥 불러오기</button>
            <button type="button" id="undo-load" class="btn ghost" hidden>↩️ 예전 코드로 되돌리기</button>
          </div>
          <h2>처음부터</h2>
          <button type="button" id="clear-code" class="btn danger">🧹 내 코드 모두 지우기</button>
        </section>
      </aside>

      <div id="toasts" class="toasts" aria-live="assertive"></div>

      <div id="modal" class="modal-back" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"></div>
      </div>

      <div id="loading" class="loading" role="alert" aria-busy="true">
        <div class="loading-card">
          <div class="loading-dots" aria-hidden="true"><span></span><span></span><span></span></div>
          <p id="loading-text">모모의 방을 꾸미는 중…</p>
        </div>
      </div>
    </main>
    <noscript><p class="noscript">이 앱은 자바스크립트가 켜져 있어야 해요.</p></noscript>
  </body>
</html>
