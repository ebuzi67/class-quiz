<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수학 퀴즈</title>
  <meta name="theme-color" content="#2b3a67">
  <link rel="manifest" href="manifest.json?v=1">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="수학 퀴즈">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #f7f7f2; color: #222;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      font-size: 20px; line-height: 1.5; display: flex; justify-content: center; padding: 24px 16px;
    }
    .app { width: 100%; max-width: 560px; }
    h1 { text-align: center; font-size: 1.6em; margin: 8px 0 20px; }
    a.card {
      display: flex; gap: 16px; align-items: center; text-decoration: none; color: inherit;
      background: #fff; border: 2px solid #e2ddd0; border-radius: 18px; padding: 18px; margin-bottom: 14px;
    }
    a.card:hover, a.card:focus { border-color: #888; }
    a.card img { width: 64px; height: 64px; border-radius: 14px; flex: none; }
    a.card b { display: block; font-size: 1.1em; }
    a.card small { color: #666; }
    p.note { text-align: center; color: #777; font-size: .8em; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="app">
    <h1>수학 퀴즈</h1>
    <a class="card" href="math5/">
      <img src="math5/icons/icon-192.png" alt="">
      <span><b>수학 방탈출 · 5학년</b><small>5-1 1~6단원, 단원마다 5개 방</small></span>
    </a>
    <a class="card" href="math1/">
      <img src="math1/icons/icon-192.png" alt="">
      <span><b>수학 모험 · 1학년</b><small>1-1 1~5단원, 단원마다 5단계</small></span>
    </a>
    <a class="card" href="area5/">
      <img src="area5/icons/icon-192.png" alt="">
      <span><b>넓이 퀴즈 · 5학년</b><small>5-1 6단원 다각형의 넓이</small></span>
    </a>
    <a class="card" href="fraction4/">
      <img src="fraction4/icons/icon-192.png" alt="">
      <span><b>분수 퀴즈 · 4학년</b><small>분수의 뜻, 크기 비교, 덧셈과 뺄셈</small></span>
    </a>
    <p class="note">이 페이지도, 각 퀴즈도 브라우저 메뉴의 "앱 설치" 또는 "홈 화면에 추가"로 설치할 수 있어요.</p>
  </div>
  <script>
    // 이 모음 페이지도 앱처럼 설치하고 인터넷 없이 열 수 있게 해요
    if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  </script>
</body>
</html>
