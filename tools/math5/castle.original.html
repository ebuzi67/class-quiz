<title>계산 순서의 성</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap">
<style>
/* Layout: castle map of five doors → a room splits into question card (left) and answer panel (right) for a landscape tablet; stacks on narrow screens */
:root{
  --bg:#FAF6EC; --surface:#FFFFFF; --surface-2:#F2ECDD; --ink:#24304A; --ink-soft:#5E6882; --line:#E3DAC5;
  --accent:#2D6E68; --accent-ink:#FFFFFF; --accent-soft:#DCEDEA;
  --gold:#D39516; --silver:#97A3B4; --ok:#2C8A5A; --bad:#C0533E; --ok-soft:#E3F3E9; --bad-soft:#F9E5DF;
  --add:#BFE6D3; --sub:#C3DEF3; --mul:#F6CBBE; --div:#DDD1F3; --paren:#F4E2A8; --gong:#DCEBB0; --choi:#B6E0E4; --circ:#F7D6C1; --tri:#E6D3EE; --yak:#F4CFDA; --tong:#CFE9E1; --nemo:#E9E3B6; --on-chip:#24304A;
  --font-d:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-b:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171C28; --surface:#212838; --surface-2:#2A3246; --ink:#EEF0F6; --ink-soft:#A9B2C6; --line:#3A435C;
  --accent:#5FB3AA; --accent-ink:#0F1F1D; --accent-soft:#24403E;
  --gold:#F0B73F; --silver:#B8C2D0; --ok:#62C690; --bad:#EA8670; --ok-soft:#1F3A2C; --bad-soft:#43262A;
  --add:#A9D9C3; --sub:#AFCDE6; --mul:#EBB7A8; --div:#C9BCE6; --paren:#E6D195; --gong:#C9DB9C; --choi:#A2D0D5; --circ:#E8C3AB; --tri:#D3BFDE; --yak:#E3B9C6; --tong:#B8D8CE; --nemo:#D6CF9E; --on-chip:#24304A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171C28; --surface:#212838; --surface-2:#2A3246; --ink:#EEF0F6; --ink-soft:#A9B2C6; --line:#3A435C;
  --accent:#5FB3AA; --accent-ink:#0F1F1D; --accent-soft:#24403E;
  --gold:#F0B73F; --silver:#B8C2D0; --ok:#62C690; --bad:#EA8670; --ok-soft:#1F3A2C; --bad-soft:#43262A;
  --add:#A9D9C3; --sub:#AFCDE6; --mul:#EBB7A8; --div:#C9BCE6; --paren:#E6D195; --gong:#C9DB9C; --choi:#A2D0D5; --circ:#E8C3AB; --tri:#D3BFDE; --yak:#E3B9C6; --tong:#B8D8CE; --nemo:#D6CF9E; --on-chip:#24304A;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:18px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1120px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:20px 48px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--font-d);font-weight:400;margin:0;text-wrap:balance;line-height:1.2}

.btn{font-family:var(--font-d);font-size:1.25rem;min-height:56px;padding:0 26px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.small{min-height:44px;font-size:1.05rem;padding:0 16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* top */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
.unit{font-size:.9rem;color:var(--ink-soft);letter-spacing:.04em}
.top h1{font-size:clamp(2rem,4.5vw,2.8rem);margin-top:2px}

/* buddies */
.buddy{--s:56px;width:var(--s);height:calc(var(--s)*1.04);border-radius:48% 48% 44% 44%;background:var(--bc);display:inline-grid;place-items:center;position:relative;flex:none;color:var(--on-chip);font-family:var(--font-d);font-size:calc(var(--s)*.46);line-height:1;box-shadow:inset 0 calc(var(--s)*-.08) 0 rgba(36,48,74,.12)}
.buddy::before,.buddy::after{content:"";position:absolute;top:27%;width:calc(var(--s)*.09);height:calc(var(--s)*.12);border-radius:50%;background:var(--on-chip)}
.buddy::before{left:32%}.buddy::after{right:32%}
.buddy b{font-weight:400;margin-top:calc(var(--s)*.32)}
.buddy[data-k="paren"] b{font-size:.8em;letter-spacing:.06em}
[data-k="add"]{--bc:var(--add)}[data-k="sub"]{--bc:var(--sub)}[data-k="mul"]{--bc:var(--mul)}[data-k="div"]{--bc:var(--div)}[data-k="paren"]{--bc:var(--paren)}[data-k="gong"]{--bc:var(--gong)}[data-k="choi"]{--bc:var(--choi)}[data-k="circ"]{--bc:var(--circ)}[data-k="tri"]{--bc:var(--tri)}[data-k="yak"]{--bc:var(--yak)}[data-k="tong"]{--bc:var(--tong)}[data-k="nemo"]{--bc:var(--nemo)}.buddy[data-k="yak"] b,.buddy[data-k="tong"] b{font-size:.8em}
.buddy[data-k="gong"] b,.buddy[data-k="choi"] b{font-size:.8em}

/* home */
.story{max-width:62ch;color:var(--ink-soft);margin:0 0 20px}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:24px}
.rule{display:flex;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.rule .pair{display:flex;gap:4px}
.rule p{margin:0;font-size:.95rem;line-height:1.45}
.rule strong{display:block;font-family:var(--font-d);font-weight:400;font-size:1.1rem}
.doors{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.door{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px 12px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center;min-width:0;transition:transform .15s}
.door:hover{transform:translateY(-3px)}
.arch{width:100%;max-width:150px;aspect-ratio:3/4;border-radius:999px 999px 10px 10px;background:var(--c);position:relative;display:grid;place-items:center;box-shadow:inset 0 0 0 6px rgba(255,255,255,.4);margin-bottom:6px}
.door.open .arch{box-shadow:inset 0 0 0 6px var(--gold)}
.lockb{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;background:var(--surface);color:var(--ink);border-radius:999px;padding:2px 10px 2px 6px;font-size:.85rem;white-space:nowrap}
.lockb svg{width:18px;height:18px}
.dtag{font-size:.8rem;color:var(--ink-soft);letter-spacing:.08em}
.dname{font-family:var(--font-d);font-size:1.35rem;line-height:1.2}
.dstat{font-size:.85rem;color:var(--ink-soft)}
.door.open .dstat{color:var(--ok)}
.gate{display:flex;gap:18px;align-items:center;background:var(--surface-2);border-radius:var(--r);padding:14px 18px;margin-top:22px;flex-wrap:wrap}
.gate-slots{display:flex;gap:8px}
.slot{width:44px;height:46px;border-radius:48% 48% 44% 44%;border:2px dashed var(--line)}
.gate-txt{display:flex;flex-direction:column;min-width:0;flex:1}
.gate-txt strong{font-family:var(--font-d);font-weight:400;font-size:1.25rem}
.gate-txt span{color:var(--ink-soft);font-size:.95rem}

/* intro */
.introcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:28px}
.introcard h2{font-size:2.2rem}
.introcard .tag{color:var(--ink-soft);font-size:.9rem;letter-spacing:.08em}
.introcard p{margin:8px 0 16px;max-width:52ch}
.irules{list-style:none;padding:0;margin:0 0 22px;display:grid;gap:8px}
.irules li{display:flex;gap:10px;align-items:center}
.irules .key svg{width:26px;height:26px}

/* play */
.pbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.pbar .rn{font-family:var(--font-d);font-size:1.4rem}
.pbar .pg{font-family:var(--font-d);font-size:1.1rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.keys{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.key{display:inline-grid;place-items:center;color:var(--line)}
.key svg{width:30px;height:30px}
.key.gold{color:var(--gold)}.key.silver{color:var(--silver)}.key.miss{color:var(--bad);opacity:.35}
.key.now{color:var(--ink-soft);opacity:.6}
.key.pop{animation:pop .45s ease-out}
.key.big svg{width:44px;height:44px}
@keyframes pop{0%{transform:scale(.3) rotate(-30deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.pgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:20px;align-items:start}
.qcard,.panel{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:22px;min-width:0}
.qhead{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.qno{font-family:var(--font-d);font-size:1.1rem}
.chip{font-size:.85rem;background:var(--surface-2);border-radius:999px;padding:2px 12px;color:var(--ink-soft)}
.prompt{font-size:1.2rem;margin:0 0 14px;word-break:keep-all}
.prompt.wordy{font-size:1.3rem;line-height:1.75}
.line{font-family:var(--font-d);font-size:clamp(1.8rem,4vw,2.6rem);font-variant-numeric:tabular-nums;line-height:1.3;margin:10px 0;word-break:keep-all;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.line.small{font-family:var(--font-b);font-size:1.15rem;background:var(--surface-2);border-radius:12px;padding:10px 14px}
.line .lab{font-size:.6em;color:var(--ink-soft)}
.line.order{gap:10px;align-items:center}
.opbtn{position:relative;display:inline-grid;place-items:center;min-width:1.5em;height:1.5em;border-radius:14px;border:0;background:var(--bc);color:var(--on-chip);font-family:var(--font-d);font-size:1em;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(36,48,74,.12)}
.opbtn .badge{position:absolute;top:-12px;right:-12px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-style:normal;font-size:1.1rem;display:grid;place-items:center}
.hints{display:grid;gap:10px;margin-top:14px}
.say{display:flex;gap:12px;align-items:flex-start}
.bubble{background:var(--surface-2);border-radius:4px 16px 16px 16px;padding:10px 14px;min-width:0;word-break:keep-all}
.bubble .who{display:block;font-family:var(--font-d);font-size:.95rem;color:var(--ink-soft)}
.explain{border-top:2px dashed var(--line);margin-top:18px;padding-top:14px}
.explain h3{font-size:1.1rem;color:var(--ink-soft);margin-bottom:6px}
.explain .ln{font-family:var(--font-d);font-size:1.35rem;font-variant-numeric:tabular-nums;line-height:1.5;word-break:keep-all}

.panel{display:grid;gap:14px}
.disp{display:flex;justify-content:flex-end;align-items:center;gap:8px;min-height:76px;border:2px solid var(--line);border-radius:14px;padding:0 18px;background:var(--bg);font-family:var(--font-d);font-size:2.4rem;font-variant-numeric:tabular-nums}
.disp .ph{color:var(--ink-soft);font-size:1.1rem;font-family:var(--font-b)}
.disp .unit{font-size:1.3rem;color:var(--ink-soft)}
.disp.ok{border-color:var(--ok);background:var(--ok-soft)}.disp.bad{border-color:var(--bad);background:var(--bad-soft)}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pad button{min-height:66px;font-family:var(--font-d);font-size:1.9rem;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer}
.pad button:active{background:var(--surface-2)}
.pad .del{font-size:1.15rem}
.pad .ok{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-size:1.35rem}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choices.one{grid-template-columns:minmax(0,1fr)}
.choice{min-height:66px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-family:var(--font-d);font-size:1.35rem;cursor:pointer;word-break:keep-all;font-variant-numeric:tabular-nums}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice:disabled{cursor:default}
.ordinfo{font-family:var(--font-d);font-size:1.3rem;min-height:56px;display:flex;align-items:center;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:0 16px}
.ordctl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hintbtn{min-height:52px;border-radius:14px;border:2px dashed var(--line);background:transparent;cursor:pointer;font-family:var(--font-d);font-size:1.15rem;color:var(--ink-soft)}
.hintbtn:disabled{cursor:default;opacity:.6}
.fb{border-radius:14px;padding:16px;display:grid;gap:12px}
.fb.ok{background:var(--ok-soft)}.fb.bad{background:var(--bad-soft)}
.fbtop{display:flex;align-items:center;gap:10px;font-family:var(--font-d);font-size:1.6rem}
.fb .bubble{background:var(--surface)}
.fb .ans{font-size:1.1rem}
.fb .ans b{font-family:var(--font-d);font-weight:400;font-size:1.5rem;margin-left:6px}

/* result */
.rescard{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:30px;display:grid;gap:18px;justify-items:start}
.reshead{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.reshead h2{font-size:2.4rem}
.reshead p{margin:4px 0 0;color:var(--ink-soft);max-width:52ch}
.jump{animation:jump 1s ease-in-out 3}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-18px)}}
.score{font-family:var(--font-d);font-size:1.3rem}
.wlist{display:grid;gap:10px;width:100%}
.witem{background:var(--surface-2);border-radius:12px;padding:12px 14px;min-width:0;word-break:keep-all}
.witem .wq{font-size:.95rem;color:var(--ink-soft)}
.witem .wa{font-family:var(--font-d);font-size:1.2rem}

/* parent */
.ptitle{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ptitle h2{font-size:2rem}
.psec{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.psec h3{font-size:1.3rem;margin-bottom:10px}
.psec .note{color:var(--ink-soft);font-size:.92rem;margin:0 0 12px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;min-width:520px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:.98rem}
thead th{font-family:var(--font-d);font-weight:400;color:var(--ink-soft)}
tbody th{font-family:var(--font-d);font-weight:400;font-size:1.1rem}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.85rem;background:var(--surface-2);color:var(--ink-soft)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 8em;gap:12px;align-items:center}
.bar .bk{font-size:.98rem}
.track{height:14px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar.weak .track i{background:var(--bad)}
.bar.weak .bk::after{content:" · 보충 필요";color:var(--bad);font-size:.85rem}
.bar .bv{font-size:.9rem;color:var(--ink-soft);text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--ink-soft);margin:0}

/* unit tabs */
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.tab{min-height:52px;padding:0 20px;border-radius:999px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-family:var(--font-d);font-size:1.15rem;color:var(--ink-soft)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab small{font-family:var(--font-b);font-size:.8rem;margin-left:6px;opacity:.8}
/* multi-select tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{min-height:62px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-family:var(--font-d);font-size:1.6rem;cursor:pointer;font-variant-numeric:tabular-nums}
.tile.sel{border-color:var(--accent);background:var(--accent-soft)}
.tile.right{border-color:var(--ok);background:var(--ok-soft)}
.tile.wrong{border-color:var(--bad);background:var(--bad-soft)}
.tile.missed{border:2px dashed var(--ok)}
.tile:disabled{cursor:default}
.legend{font-size:.9rem;color:var(--ink-soft);margin:0}
.unitlab{font-family:var(--font-d);font-size:1.15rem;margin:18px 0 6px;color:var(--ink-soft)}
/* unit 3: correspondence tables and figures */
.ctabwrap{margin:12px 0}
.ctab{min-width:0;width:auto;border-collapse:collapse}
.ctab th,.ctab td{border:2px solid var(--line);text-align:center;padding:8px 14px;font-family:var(--font-d);font-weight:400;font-size:1.55rem;font-variant-numeric:tabular-nums;color:var(--ink)}
.ctab th{background:var(--surface-2);font-size:1.4rem}
.ctab td.blank{background:var(--accent-soft);color:var(--accent)}
.figbox{margin:12px 0;overflow-x:auto}
.fig{display:block;max-width:100%;height:auto}
.fig line{stroke:var(--ink);stroke-width:3.5;stroke-linecap:round}
.fig text{fill:var(--ink-soft);font-size:13px;font-family:var(--font-b)}
.fig .tb{fill:var(--paren);stroke:var(--ink);stroke-width:2}
.fig .ch{fill:var(--sub);stroke:var(--ink);stroke-width:1.5}
/* fractions */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .1em;font-size:.82em}
.fr .fn{border-bottom:2px solid currentColor;padding:0 .18em}
.fr .fd{padding:0 .18em}
.mix{white-space:nowrap}
.choice .fr,.tile .fr{font-size:.75em}
.fin{display:flex;align-items:center;justify-content:center;gap:12px;min-height:150px;border:2px solid var(--line);border-radius:14px;background:var(--bg);padding:10px}
.fin.ok{border-color:var(--ok);background:var(--ok-soft)}.fin.bad{border-color:var(--bad);background:var(--bad-soft)}
.fcol{display:flex;flex-direction:column;align-items:center;gap:6px}
.fbar{display:block;width:96px;height:3px;background:var(--ink);border-radius:2px}
.fbox{min-width:84px;min-height:52px;padding:0 10px;border-radius:12px;border:2px dashed var(--line);background:var(--surface);font-family:var(--font-d);font-size:2rem;cursor:pointer;font-variant-numeric:tabular-nums}
.fbox.fw{min-height:64px}
.fbox.on{border:3px solid var(--accent);background:var(--accent-soft)}
.fbox .ph{font-family:var(--font-b);font-size:.9rem;color:var(--ink-soft)}
.fin .unit{font-family:var(--font-d);font-size:1.3rem;color:var(--ink-soft)}
.fig .sh{fill:var(--accent-soft);stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
.fig line.dash{stroke:var(--ink-soft);stroke-width:2;stroke-dasharray:5 4}
.fig text.lab{fill:var(--ink);font-family:var(--font-d);font-size:15px}
.fig .road{fill:var(--bg);stroke:var(--ink-soft);stroke-width:1}
@media (max-width:860px){
  .pgrid{grid-template-columns:minmax(0,1fr)}
  .rules{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:700px){
  .doors{grid-template-columns:minmax(0,1fr)}
  .door{flex-direction:row;text-align:left;gap:14px;padding:12px}
  .door .arch{width:84px;flex:none;margin:0}
  .door .arch .buddy{--s:44px!important}
  .door .lockb{font-size:.75rem;padding:1px 8px 1px 4px}
  .door .dtxt{display:flex;flex-direction:column}
  .introcard{grid-template-columns:minmax(0,1fr)}
  .bar{grid-template-columns:minmax(0,1fr) 7em}
  .bar .track{grid-column:1 / -1;grid-row:2}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="unit" id="unitLabel">5-1 · 1단원 자연수의 혼합 계산</div>
      <h1 id="mainTitle">계산 순서의 성</h1>
    </div>
    <button class="btn ghost small" id="toParent">부모님 기록</button>
  </header>

  <section id="home">

<script>
// CORE-START
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

const G={'+':'+','-':'−','×':'×','÷':'÷'};
const CH={add:{name:'더미',sym:'+'},sub:{name:'빼미',sym:'−'},mul:{name:'곱이',sym:'×'},div:{name:'나눔이',sym:'÷'},paren:{name:'괄호 형제',sym:'( )'}};
const OPK={'+':'add','-':'sub','×':'mul','÷':'div'};

function hasB(n){n=Math.abs(n);const d=n%10;if(d)return[1,3,6,7,8].includes(d);return true}
function isL(n){const d=Math.abs(n)%10;return d?[1,7,8].includes(d):false}
const J=(n,pair)=>{const[a,b]=pair.split('/');return n+(hasB(n)?a:b)};
const JRO=n=>n+((hasB(n)&&!isL(n))?'으로':'로');

function tok(s,vals={}){
  const out=[];let id=0;
  for(let i=0;i<s.length;i++){
    const ch=s[i];
    if(ch===' ')continue;
    if(/[0-9]/.test(ch)){let j=i;while(j<s.length&&/[0-9]/.test(s[j]))j++;out.push({t:'num',v:+s.slice(i,j)});i=j-1;continue}
    if(ch in G){out.push({t:'op',v:ch,id:id++});continue}
    if(ch==='('||ch===')'){out.push({t:ch});continue}
    if(ch==='□'){out.push({t:'box'});continue}
    if(ch==='○'){out.push({t:'circ'});continue}
    if(ch in vals){out.push({t:'num',v:vals[ch]});continue}
    throw new Error('bad token '+ch+' in '+s);
  }
  return out;
}
function fmt(t){
  let s='';
  t.forEach((k,i)=>{
    const txt=k.t==='num'?String(k.v):k.t==='op'?G[k.v]:k.t==='box'?'□':k.t==='circ'?'○':k.t;
    if(i>0&&t[i-1].t!=='('&&k.t!==')')s+=' ';
    s+=txt;
  });
  return s;
}
function solve(t0){
  let t=t0.map(k=>({...k}));const steps=[];let guard=0;
  while(t.length>1&&guard++<60){
    let lo=0,hi=t.length-1,open=-1;const close=t.findIndex(k=>k.t===')');
    if(close>=0){open=close;while(open>=0&&t[open].t!=='(')open--;lo=open+1;hi=close-1}
    let idx=-1;
    for(let i=lo;i<=hi;i++)if(t[i].t==='op'&&(t[i].v==='×'||t[i].v==='÷')){idx=i;break}
    if(idx<0)for(let i=lo;i<=hi;i++)if(t[i].t==='op'){idx=i;break}
    if(idx<0){if(close>=0){t.splice(close,1);t.splice(open,1);continue}break}
    const a=t[idx-1].v,b=t[idx+1].v,op=t[idx].v,id=t[idx].id;let r;
    if(op==='+')r=a+b;else if(op==='-')r=a-b;else if(op==='×')r=a*b;else{if(b===0||a%b!==0)return{ok:false};r=a/b}
    if(r<0)return{ok:false};
    t.splice(idx-1,3,{t:'num',v:r});
    for(let i=0;i+2<t.length;i++){if(t[i].t==='('&&t[i+1].t==='num'&&t[i+2].t===')'){t.splice(i+2,1);t.splice(i,1);i=-1}}
    steps.push({a,b,op,r,id,after:t.map(k=>({...k}))});
  }
  if(t.length!==1||t[0].t!=='num')return{ok:false};
  return{ok:true,value:t[0].v,steps};
}
function rv(r,tpl,def=[2,9]){const v={};(tpl.match(/[a-z]/g)||[]).forEach(L=>{if(v[L]!=null)return;const x=(r&&r[L])||def;v[L]=typeof x==='function'?x():R(x[0],x[1])});return v}
function makeExpr(tpl,r={},o={}){
  for(let n=0;n<4000;n++){
    const vals=rv(r,tpl,o.def||[2,30]);const t=tok(tpl,vals);const s=solve(t);
    if(!s.ok)continue;
    if(s.value>(o.max??999))continue;
    if(!o.allowZero&&s.steps.some(x=>x.r===0))continue;
    if(s.steps.some(x=>(x.op==='×'||x.op==='÷')&&x.b===1))continue;
    return{t,s,vals};
  }
  return null;
}
const chainStr=(t,s)=>[fmt(t),...s.steps.map(x=>fmt(x.after))].join(' = ');
const chainLines=(t,s)=>[fmt(t),...s.steps.map(x=>'= '+fmt(x.after))];
function depthOf(t,id){let d=0;for(const k of t){if(k.t==='(')d++;else if(k.t===')')d--;else if(k.t==='op'&&k.id===id)return d}return 0}
function ruleHint(t,s){
  const st=s.steps[0];const hasAS=t.some(k=>k.t==='op'&&(k.v==='+'||k.v==='-'));
  if(depthOf(t,st.id)>0)return{sp:'paren',text:'괄호가 있으면 괄호 안을 가장 먼저 계산해.'};
  if(st.op==='×'||st.op==='÷')return{sp:OPK[st.op],text:hasAS?'곱셈과 나눗셈은 덧셈, 뺄셈보다 먼저 계산해.':'곱셈과 나눗셈만 있으면 앞에서부터 차례로 계산해.'};
  return{sp:OPK[st.op],text:'덧셈과 뺄셈만 있으면 앞에서부터 차례로 계산해.'};
}
function hintsFor(t,s){
  const r=ruleHint(t,s),st=s.steps[0],part=`${st.a} ${G[st.op]} ${st.b}`;
  const h=[{sp:r.sp,text:`${r.text} ${part}부터!`}];
  if(s.steps.length>1)h.push({sp:r.sp,text:`${part} = ${st.r}. 이제 남은 식은 ${fmt(st.after)}`});
  return h;
}
function ltr(t){const k=t.filter(x=>x.t==='num'||x.t==='op');let v=k[0].v;for(let i=1;i<k.length;i+=2){const o=k[i].v,b=k[i+1].v;if(o==='+')v+=b;else if(o==='-')v-=b;else if(o==='×')v*=b;else{if(v%b)return null;v/=b}if(v<0)return null}return v}
function withParen(tpl,i,j){let out='',n=0;for(const ch of tpl){if(/[a-z]/.test(ch)){if(n===i)out+='(';out+=ch;if(n===j)out+=')';n++}else out+=ch}return out}
function placements(tpl){const n=(tpl.match(/[a-z]/g)||[]).length,out=[];for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){if(i===0&&j===n-1)continue;out.push(withParen(tpl,i,j))}return out}
function exprQ(gen,topic,T,o){
  const m=makeExpr(T.s,T.r,o);if(!m)return null;const h=hintsFor(m.t,m.s);
  return{kind:'num',gen,topic,prompt:'다음을 계산해 보세요.',lines:[{text:fmt(m.t)}],answer:m.s.value,hints:h,explain:chainLines(m.t,m.s),sp:h[0].sp};
}

function wordQ(ctx,key,list,gen,topic){
  const f=ctx.next(key,list);
  for(let n=0;n<400;n++){
    const w=f();const t=tok(w.tpl,w.vals);const s=solve(t);
    if(!s.ok||s.value<=0||s.steps.some(x=>x.r===0))continue;
    const sp=ruleHint(t,s).sp;
    return{kind:'num',gen,topic,prompt:w.text,wordy:true,lines:[],answer:s.value,unit:w.unit,
      hints:[{sp,text:'무엇을 구하는지 먼저 찾고, 이야기 순서대로 하나의 식을 세워 봐.'},{sp,text:`식: ${fmt(t)}`}],
      explain:[`식: ${fmt(t)}`,...s.steps.map(x=>'= '+fmt(x.after)),`답: ${s.value}${w.unit}`],sp};
  }
  return null;
}
function pairVals(p,q,r){
  for(let n=0;n<4000;n++){
    const vals=rv(r,p+q);const t1=tok(p,vals),s1=solve(t1),t2=tok(q,vals),s2=solve(t2);
    if(!s1.ok||!s2.ok)continue;
    if(s1.steps.concat(s2.steps).some(x=>x.r===0||((x.op==='×'||x.op==='÷')&&x.b===1)))continue;
    if(s1.value>999||s2.value>999)continue;
    return{t1,s1,t2,s2};
  }
  return null;
}

function genOne(k,ctx,seen){for(let i=0;i<60;i++){const q=GENS[k](ctx);if(!q)continue;const sg=sigOf(q);if(seen.has(sg))continue;seen.add(sg);q.gen=k;return q}throw new Error('문제 생성 실패: '+k)}

const gcd=(a,b)=>b?gcd(b,a%b):a;

const divs=n=>{const d=[];for(let i=1;i<=n;i++)if(n%i===0)d.push(i);return d};
const mults=(k,upto)=>{const m=[];for(let x=k;x<=upto;x+=k)m.push(x);return m};
function cop(lo,hi){for(let n=0;n<999;n++){const x=R(lo,hi),y=R(lo,hi);if(x!==y&&gcd(x,y)===1)return x<y?[x,y]:[y,x]}return[2,3]}
function gPair(G,lo,hi,max,min=1){for(let n=0;n<500;n++){const[k1,k2]=cop(lo,hi);const a=G*k1,b=G*k2;if(b<=max&&a>=min)return shuffle([a,b])}return null}

      hints:[{sp:'paren',text:`${Fs(1,6)} = ${Fs(1,2)} − ${Fs(1,3)}, ${Fs(1,12)} = ${Fs(1,3)} − ${Fs(1,4)}처럼 쪼개 봐.`},{sp:'paren',text:'쪼갠 다음 늘어놓으면 가운데가 모두 지워져!'}],
      explain:[`${Fs(1,2)} = 1 − ${Fs(1,2)}, ${Fs(1,6)} = ${Fs(1,2)} − ${Fs(1,3)}, …, ${Fs(1,n*(n+1))} = ${Fs(1,n)} − ${Fs(1,n+1)}`,`모두 더하면 1 − ${Fs(1,n+1)} = ${Fs(n,n+1)}`],sp:'paren'})},
  bottle(){for(;;){const P=mixed(0,1,8),Wt=mixed(1,3,8);if(P[0]===0||Wt[0]%2&&Wt[1]%2&&false)continue;const half=Q(Wt[0],Wt[1]*2);const A=qAdd(P,Wt),B=qAdd(P,half);if([P,Wt,half].reduce((m,x)=>lcm(m,x[1]),1)>48)continue;
    return fracQ('bottle','분수 계산 활용',`물이 가득 든 병의 무게는 ${qS(A)} kg입니다. 물을 절반만큼 마시고 다시 재었더니 ${qS(B)} kg이었습니다. 빈 병의 무게는 몇 kg일까요?`,qC(P),{wordy:true,unit:'kg',legend:CANON,
      hints:[{sp:'paren',text:'두 무게의 차가 마신 물, 즉 물 전체의 절반이야.'},{sp:'paren',text:`물 절반: ${qS(A)} − ${qS(B)} = ${qS(half)}`}],

  manyTapes(){for(;;){const n=R(3,6),L0=mixed(1,4,8),c=Q(...prop(2,8));if(L0[1]===c[1]||lcm(L0[1],c[1])>48)continue;const tot=Q(L0[0]*n,L0[1]),ov=Q(c[0]*(n-1),c[1]),r=qSub(tot,ov);if(r[0]<=0)continue;
    return fracQ('manyTapes','분수 계산 활용',`길이가 ${qS(L0)} m인 색 테이프 ${n}장을 ${qS(c)} m씩 겹쳐서 한 줄로 이어 붙였습니다. 이어 붙인 색 테이프의 전체 길이는 몇 m일까요?`,qC(r),{wordy:true,unit:'m',legend:CANON,
      hints:[{sp:'paren',text:`테이프 ${n}장을 이으면 겹친 곳은 몇 군데일까? ${n}군데가 아니야!`},{sp:'paren',text:`겹친 곳: ${n-1}군데`}],

  wrongCalc5b(){for(;;){const[x,a]=pairL(()=>mixed(1,5,9),36);const r=qAdd(x,a),ans=qSub(x,a);if(ans[0]<=0)continue;

function svgBox(w,h,body,label){return{fig:`<svg class="fig" width="${Math.round(w*1.15)}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}">${body}</svg>`,text:label}}

function scale(...dims){const m=Math.max(...dims);return 170/m}
function figRect(w,h,u){const s=scale(w,h),W=w*s,H=h*s,ox=60,oy=20;return svgBox(W+100,H+56,`<rect class="sh" x="${ox}" y="${oy}" width="${W}" height="${H}"/>${lab(ox+W/2,oy+H+24,w+u)}${lab(ox-8,oy+H/2+5,h+u,'end')}`,`가로 ${w}${u}, 세로 ${h}${u}인 직사각형`)}
function figPara(b,h,u,side){const s=scale(b*1.4,h),B=b*s,H=h*s,off=B*.35,ox=20,oy=20;const pts=`${ox+off},${oy} ${ox+off+B},${oy} ${ox+B},${oy+H} ${ox},${oy+H}`;

function figTri(b,h,u){const s=scale(b,h),B=b*s,H=h*s,ax=B*.3,ox=20,oy=20;return svgBox(B+50,H+56,`<polygon class="sh" points="${ox+ax},${oy} ${ox+B},${oy+H} ${ox},${oy+H}"/><line class="dash" x1="${ox+ax}" y1="${oy}" x2="${ox+ax}" y2="${oy+H}"/>${lab(ox+B/2,oy+H+24,b+u)}${lab(ox+ax+8,oy+H/2+10,h+u,'start')}`,`밑변 ${b}${u}, 높이 ${h}${u}인 삼각형`)}
function figTrap(t,b,h,u){const s=scale(b,h),B=b*s,T=t*s,H=h*s,ox=20,oy=24,tx=ox+(B-T)*.4;return svgBox(B+50,H+62,`<polygon class="sh" points="${tx},${oy} ${tx+T},${oy} ${ox+B},${oy+H} ${ox},${oy+H}"/><line class="dash" x1="${tx}" y1="${oy}" x2="${tx}" y2="${oy+H}"/>${lab(tx+T/2,oy-7,t+u)}${lab(ox+B/2,oy+H+24,b+u)}${lab(tx+8,oy+H/2+5,h+u,'start')}`,`윗변 ${t}${u}, 아랫변 ${b}${u}, 높이 ${h}${u}인 사다리꼴`)}
function figRhom(d1,d2,u){const s=scale(d1,d2),A=d1*s,B=d2*s,ox=20,oy=16,cx=ox+A/2,cy=oy+B/2;return svgBox(A+40,B+32,`<polygon class="sh" points="${cx},${oy} ${ox+A},${cy} ${cx},${oy+B} ${ox},${cy}"/><line class="dash" x1="${ox}" y1="${cy}" x2="${ox+A}" y2="${cy}"/><line class="dash" x1="${cx}" y1="${oy}" x2="${cx}" y2="${oy+B}"/>${lab(ox+A*.72,cy-8,d1+u)}${lab(cx+8,oy+B*.3,d2+u,'start')}`,`대각선 ${d1}${u}, ${d2}${u}인 마름모`)}
function figL(W,H,cw,ch,u){const s=scale(W,H),w=W*s,h=H*s,a=cw*s,b=ch*s,ox=60,oy=20;const pts=`${ox},${oy} ${ox+w-a},${oy} ${ox+w-a},${oy+b} ${ox+w},${oy+b} ${ox+w},${oy+h} ${ox},${oy+h}`;
  return svgBox(w+130,h+56,`<polygon class="sh" points="${pts}"/><line class="dash" x1="${ox+w-a}" y1="${oy}" x2="${ox+w}" y2="${oy}"/><line class="dash" x1="${ox+w}" y1="${oy}" x2="${ox+w}" y2="${oy+b}"/>${lab(ox+w/2,oy+h+24,W+u)}${lab(ox-8,oy+h/2+5,H+u,'end')}${lab(ox+w-a/2,oy+b-8,cw+u)}${lab(ox+w+8,oy+b/2+5,ch+u,'start')}`,`가로 ${W}${u}, 세로 ${H}${u}인 직사각형에서 가로 ${cw}${u}, 세로 ${ch}${u}만큼 잘린 도형`)}

function figPoly(n,a,u){const r=70,cx=90,cy=86,pts=[];for(let i=0;i<n;i++){const t=-Math.PI/2+Math.PI/n+2*Math.PI*i/n;pts.push([cx+r*Math.cos(t),cy+r*Math.sin(t)])}
  let bi=0,by=-1;for(let i=0;i<n;i++){const y=(pts[i][1]+pts[(i+1)%n][1])/2;if(y>by){by=y;bi=i}}const[p,q]=[pts[bi],pts[(bi+1)%n]];const mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2;return svgBox(180,180,`<polygon class="sh" points="${pts.map(t=>t.join(',')).join(' ')}"/>${lab(mx,my+22,a+u)}`,`한 변이 ${a}${u}인 정다각형`)}

let P=null;
const cq=()=>P.qs[P.idx];
function startRound(L,gens){
  P={L,unit:U,qs:gens?makeReview(gens):makeRound(L),idx:0,res:[],review:!!gens,hints:0};

}
function renderKeys(){
  $('#keys').innerHTML=P.qs.map((q,i)=>{const r=P.res[i];const c=r?r.key:(i===P.idx?'now':'');return keyIcon(c+(r&&i===P.res.length-1&&r.key!=='miss'?' pop':''))}).join('');
}
function orderHTML(q){return q.toks.map(k=>k.t==='op'?`<button class="opbtn" data-k="${OPK[k.v]}" data-op="${k.id}" aria-label="${G[k.v]} 계산">${G[k.v]}<i class="badge" hidden></i></button>`:`<span>${k.t==='num'?k.v:k.t}</span>`).join('')}
function renderQ(){
  const q=cq(),L=P.L;
  P.input='';P.fin={w:'',n:'',d:''};P.ff='n';P.sel=[];P.msel=new Set();P.hintN=0;P.done=false;P.choice=null;P.leaving=false;

  $('#prog').textContent=`${P.idx+1} / ${P.qs.length}`;
  renderKeys();
  let h=`<div class="qhead"><span class="qno">문제 ${P.idx+1}</span><span class="chip">${esc(q.topic)}</span></div><p class="prompt ${q.wordy?'wordy':''}">${esc(q.prompt)}</p>`;
  if(q.kind==='order')h+=`<div class="line order">${orderHTML(q)}</div>`;
  (q.lines||[]).forEach(l=>{if(l.table){h+=tableHTML(l.table);return}if(l.fig){h+=`<div class="figbox">${l.fig}</div>`;return}h+=`<div class="line ${l.small?'small':''}">${l.label?`<span class="lab">${l.label}</span>`:''}<span>${esc(l.text)}</span></div>`});

  let p='';
  if(q.kind==='num')p=`<div class="disp" id="disp"></div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-d="${n}">${n}</button>`).join('')}<button data-d="del" class="del">지우기</button><button data-d="0">0</button><button data-d="ok" class="ok">확인</button></div>`;

  else if(q.kind==='frac')p=`<div class="fin" id="fin"><button class="fbox fw" data-f="w"></button><span class="fcol"><button class="fbox" data-f="n"></button><i class="fbar"></i><button class="fbox" data-f="d"></button></span>${q.unit?`<span class="unit">${esc(q.unit)}</span>`:''}</div><p class="legend">${esc(q.legend||'')} 칸을 눌러 고른 뒤 숫자를 넣어요.</p><div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-d="${n}">${n}</button>`).join('')}<button data-d="del" class="del">지우기</button><button data-d="0">0</button><button data-d="ok" class="ok">확인</button></div>`;
  else if(q.kind==='multi')p=`<p class="legend">알맞은 수를 모두 눌러요. 다시 누르면 취소돼요.</p><div class="tiles">${q.choices.map((c,i)=>`<button class="tile" data-t="${i}" aria-pressed="false">${esc(c)}</button>`).join('')}</div><button class="btn" id="mOk" disabled>확인</button>`;
  else p=`<div class="ordinfo" id="ordinfo">연산 기호를 순서대로 눌러요</div><div class="ordctl"><button class="btn ghost" id="ordReset">다시 누르기</button><button class="btn" id="ordOk" disabled>확인</button></div>`;
  p+=`<button class="hintbtn" id="hintBtn">힌트 보기 (${q.hints.length}개)</button>`;
  $('#panel').innerHTML=p;updDisp();
}
function tableHTML(t){return `<div class="tbl ctabwrap"><table class="ctab"><tbody>${t.rows.map(r=>`<tr>${r.map((c,i)=>i===0?`<th>${esc(c)}</th>`:`<td class="${c==='□'?'blank':''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function updDisp(){const fi=$('#fin');if(fi){const L={w:'자연수',n:'분자',d:'분모'};fi.querySelectorAll('[data-f]').forEach(b=>{const k=b.dataset.f,v=P.fin[k];b.innerHTML=v?v:`<span class="ph">${L[k]}</span>`;b.classList.toggle('on',k===P.ff&&!P.done)});return}const d=$('#disp');if(!d)return;const q=cq();d.innerHTML=P.input?`<span>${P.input}</span>${q.unit?`<span class="unit">${esc(q.unit)}</span>`:''}`:'<span class="ph">답을 눌러 입력해요</span>'}
function showHint(){
  const q=cq();if(P.done||P.hintN>=q.hints.length)return;
  const h=q.hints[P.hintN++];
  $('#hints').insertAdjacentHTML('beforeend',`<div class="say">${buddy(h.sp,44)}<div class="bubble"><span class="who">${CH[h.sp].name}</span>${esc(h.text)}</div></div>`);
  const b=$('#hintBtn');if(P.hintN>=q.hints.length){b.textContent='힌트를 모두 봤어요';b.disabled=true}else b.textContent=`힌트 하나 더 보기 (${q.hints.length-P.hintN}개 남음)`;
}
function orderTap(id){
  if(P.done||P.sel.includes(id))return;const q=cq();P.sel.push(id);
  const b=document.querySelector(`.opbtn[data-op="${id}"] .badge`);b.textContent=P.sel.length;b.hidden=false;
  $('#ordinfo').textContent='누른 순서: '+P.sel.map(x=>opGlyph(q,x)).join(' → ');

function orderReset(){if(P.done)return;P.sel=[];document.querySelectorAll('.opbtn .badge').forEach(b=>b.hidden=true);$('#ordinfo').textContent='연산 기호를 순서대로 눌러요';$('#ordOk').disabled=true}
const OKMSG=['정확해! 열쇠를 가져가.','좋았어! 딱 맞혔네.','멋져! 다음 자물쇠로 가자.','바로 그거야! 열쇠 하나 더.'];
function submit(ans){
  if(P.done)return;P.done=true;const q=cq();let ok,your;
  let near=false;
  if(q.kind==='frac'){const w=+P.fin.w||0,n=+P.fin.n||0,d=+P.fin.d||0,A=q.answer;ok=w===A.w&&n===A.n&&(A.n===0||d===A.d);const aD=A.d||1,aN=A.w*aD+A.n,iD=d||1,iN=w*iD+n;near=!ok&&iN*aD===aN*iD;your=(n&&d?(w?`{${w} ${n}/${d}}`:`{${n}/${d}}`):String(w))+(q.unit?' '+q.unit:'')}
  else if(q.kind==='num'){ok=Number(ans)===q.answer;your=ans+(q.unit||'')}
  else if(q.kind==='choice'){ok=ans===q.answer;your=ans}
  else if(q.kind==='multi'){ok=ans.length===q.answer.length&&ans.every(x=>q.answer.includes(x));your=ans.join(', ')||'(선택 없음)'}
  else{ok=ans.join(',')===q.answer.join(',');your=ans.map(id=>opGlyph(q,id)).join(' → ')}
  const key=ok?(P.hintN>0?'silver':'gold'):'miss';
  P.res.push({ok,key,gen:q.gen});P.hints+=P.hintN;
  const tp=store.topics[q.topic]||(store.topics[q.topic]={c:0,t:0});tp.t++;if(ok)tp.c++;
  if(!ok){store.wrong.unshift({d:Date.now(),room:`${P.unit.short} ${P.L.tag}`,topic:q.topic,q:[q.prompt,...(q.lines||[]).map(l=>l.text),q.toks?fmt(q.toks):''].filter(Boolean).join('  /  '),your,ans:answerText(q)});store.wrong=store.wrong.slice(0,30)}
  save();renderKeys();
  ['.pad','.ordctl','#hintBtn','#chOk','#mOk','.legend'].forEach(s=>{const e=$(s);if(e)e.remove()});
  const d=$('#disp')||$('#fin');if(d)d.classList.add(ok?'ok':'bad');updDisp();
  document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;const t=q.choices[+b.dataset.c];if(t===q.answer)b.classList.add('right');else if(t===ans)b.classList.add('wrong');b.classList.remove('sel')});
  document.querySelectorAll('.tile').forEach(b=>{b.disabled=true;const t=q.choices[+b.dataset.t];const a=q.answer.includes(t),s=P.msel.has(t);b.classList.remove('sel');if(a&&s)b.classList.add('right');else if(s)b.classList.add('wrong');else if(a)b.classList.add('missed')});
  document.querySelectorAll('.opbtn').forEach(b=>b.disabled=true);
  const ex=$('#explain');ex.innerHTML=`<h3>풀이</h3>${q.explain.map(l=>`<div class="ln">${esc(l)}</div>`).join('')}`;ex.hidden=false;
  const sp=ok?(q.sp||P.L.keeper):P.L.keeper;
  const msg=ok?(key==='gold'?pick(OKMSG):'힌트를 잘 활용했어! 이번엔 은 열쇠야.'):near?`값은 같은데 답을 쓰는 모양이 달라. ${q.legend||''}`:(q.kind==='multi'?'초록 점선은 빠뜨린 수, 빨간색은 잘못 고른 수야. 풀이를 같이 보자.':'괜찮아. 풀이를 보고 어디서 달라졌는지 찾아봐.');
  const last=P.idx+1>=P.qs.length;
  $('#panel').insertAdjacentHTML('beforeend',`<div class="fb ${ok?'ok':'bad'}"><div class="fbtop">${ok?keyIcon(key+' big pop'):''}<span>${ok?(key==='gold'?'황금 열쇠 획득!':'은 열쇠 획득!'):'아쉬워요'}</span></div>
    <div class="say">${buddy(sp,44)}<div class="bubble"><span class="who">${CH[sp].name}</span>${esc(msg)}</div></div>
    ${ok?'':`<div class="ans">정답<b>${esc(answerText(q))}</b></div>`}<button class="btn" id="nextBtn">${last?'결과 보기':'다음 문제'}</button></div>`);
  $('#nextBtn').focus({preventScroll:true});
}
function next(){if(!P||!P.done)return;if(P.idx+1<P.qs.length){P.idx++;renderQ();window.scrollTo(0,0)}else finish()}

function finish(){
  const L=P.L,n=P.qs.length,score=P.res.filter(r=>r.ok).length;
  const wrongIdx=P.res.map((r,i)=>r.ok?-1:i).filter(i=>i>=0);
  let head,sub,jump=false;
  if(P.review){head='다시 풀기 끝!';sub=`${n}문제 중 ${score}문제를 맞혔어요.`}
  else{
    const r=store.rooms[L.id]||(store.rooms[L.id]={attempts:0,best:0,last:0,cleared:false,hints:0,log:[]});
    r.attempts++;r.last=score;r.best=Math.max(r.best,score);r.hints+=P.hints;r.log=(r.log||[]).concat({d:Date.now(),s:score,h:P.hints}).slice(-10);
    if(score>=8){r.cleared=true;head='탈출 성공!';sub=`${L.name}의 문이 열렸어요. ${CH[L.keeper].name} 카드를 얻었어요.`;jump=true}
    else{head='열쇠가 조금 모자라요';sub=`열쇠 ${score}개를 모았어요. ${8-score}개만 더 모으면 문이 열려요. 다시 도전해 봐요!`}
    save();
  }
  const wl=wrongIdx.map(i=>{const q=P.qs[i];return `<div class="witem"><div class="wq">${esc(q.prompt)}${q.lines&&q.lines.length?' '+esc(q.lines.map(l=>l.text).filter(Boolean).join(' / ')):''}${q.toks?' '+esc(fmt(q.toks)):''}</div><div class="wa">정답 ${esc(answerText(q))}</div></div>`}).join('');
  $('#resBody').innerHTML=`<div class="reshead">${buddy(L.keeper,96).replace('class="buddy"',`class="buddy${jump?' jump':''}"`)}<div><h2>${head}</h2><p>${sub}</p></div></div>
    <div class="keys">${P.res.map(r=>keyIcon(r.key)).join('')}</div>
    <div class="score">${n}문제 중 ${score}문제 정답${P.hints?` · 힌트 ${P.hints}번 사용`:''}</div>
    ${wl?`<div class="wlist"><h3>틀린 문제</h3>${wl}</div>`:''}
    <div class="row">${wrongIdx.length?`<button class="btn" id="resReview">틀린 유형 새 문제로 다시 풀기</button>`:''}${P.review?'':`<button class="btn ${wrongIdx.length?'ghost':''}" id="resRetry">다시 도전</button>`}<button class="btn ghost" id="resMap">지도로</button></div>`;
  P.wrongGens=wrongIdx.map(i=>P.res[i].gen);
  show('result');
}

function renderParent(){
  const rows=UNITS.map(u=>`<tr><th colspan="6" class="unitlab">${u.short} ${u.name}</th></tr>`+u.levels.map(L=>{const r=roomOf(L);return `<tr><th>${L.tag}</th><td>${r?r.attempts:0}회</td><td>${r?r.best+'/10':'–'}</td><td>${r?r.last+'/10':'–'}</td><td>${r&&r.attempts?(r.hints/r.attempts).toFixed(1)+'번':'–'}</td><td>${r&&r.cleared?'<span class="pill ok">탈출</span>':r?'<span class="pill">도전 중</span>':'<span class="pill">시작 전</span>'}</td></tr>`}).join('')).join('');
  const tps=Object.entries(store.topics).map(([k,v])=>({k,...v,p:v.c/v.t})).sort((a,b)=>a.p-b.p);
  const bars=tps.length?`<div class="bars">${tps.map(t=>`<div class="bar ${t.p<.7&&t.t>=3?'weak':''}"><span class="bk">${esc(t.k)}</span><span class="track"><i style="width:${Math.round(t.p*100)}%"></i></span><span class="bv">${t.c}/${t.t} · ${Math.round(t.p*100)}%</span></div>`).join('')}</div>`:'<p class="empty">아직 기록이 없어요. 아이가 문제를 풀면 여기에 쌓여요.</p>';
  const wl=store.wrong.length?`<div class="wlist">${store.wrong.slice(0,20).map(w=>`<div class="witem"><div class="wq">${new Date(w.d).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'})} · ${esc(/단원/.test(w.room)?w.room:'1단원 '+w.room)} · ${esc(w.topic)}</div><div>${esc(w.q)}</div><div class="wa">아이 답 ${esc(w.your)} → 정답 ${esc(w.ans)}</div></div>`).join('')}</div>`:'<p class="empty">틀린 문제가 아직 없어요.</p>';
  $('#parentBody').innerHTML=`
    <div class="psec"><h3>단원·방별 기록</h3><p class="note">10문제 중 8문제 이상 맞히면 탈출이에요. 힌트는 한 판에 평균 몇 번 썼는지 보여 줘요.</p>
      <div class="tbl"><table><thead><tr><th>방</th><th>도전</th><th>최고</th><th>최근</th><th>힌트(판당)</th><th>상태</th></tr></thead><tbody>${rows}</tbody></table></div></div>
    <div class="psec"><h3>유형별 정답률</h3><p class="note">정답률이 낮은 유형부터 보여요. 3번 이상 풀었는데 70% 아래면 보충 필요로 표시해요.</p>${bars}</div>
    <div class="psec"><h3>최근 틀린 문제</h3>${wl}</div>
    <div class="row"><button class="btn ghost small" id="resetBtn">기록 모두 지우기</button></div>`;
  show('parent');
}

document.addEventListener('click',e=>{
  const t=e.target;
  const tab=t.closest('[data-unit]');if(tab){U=UNITS[+tab.dataset.unit];store.unit=+tab.dataset.unit;save();renderHome();return}
  const door=t.closest('[data-door]');if(door){openIntro(+door.dataset.door);return}
  if(t.closest('#introStart')){startRound(cur);return}
  if(t.closest('#introBack')||t.closest('#resMap')||t.closest('#parentBack')){renderHome();return}
  if(t.closest('#toParent')){renderParent();return}
  if(t.closest('#resetBtn')){const b=$('#resetBtn');if(b.dataset.arm){store={rooms:{},topics:{},wrong:[],unit:store.unit};save();renderParent()}else{b.dataset.arm='1';b.textContent='한 번 더 누르면 모두 지워져요'}return}
  if(t.closest('#resRetry')){startRound(cur);return}
  if(t.closest('#resReview')){startRound(cur,P.wrongGens);return}
  if(t.closest('#playBack')){if(P&&!P.leaving&&P.res.length){P.leaving=true;$('#playBack').textContent='한 번 더 누르면 나가요';return}renderHome();return}
  if(!P||$('#play').hidden)return;
  const pd=t.closest('[data-d]');
  const fb=t.closest('[data-f]');if(fb&&!P.done){P.ff=fb.dataset.f;updDisp();return}
  if(pd&&!P.done&&cq().kind==='frac'){const v=pd.dataset.d,F=P.fin;if(v==='del'){if(F[P.ff])F[P.ff]=F[P.ff].slice(0,-1);else{const o=['w','n','d'],i=o.indexOf(P.ff);if(i>0)P.ff=o[i-1]}}else if(v==='ok'){if((F.n&&F.d)||(F.w&&!F.n&&!F.d))submit();return}else if(F[P.ff].length<3)F[P.ff]=(F[P.ff]==='0'?'':F[P.ff])+v;updDisp();return}
  if(pd&&!P.done){const v=pd.dataset.d;if(v==='del')P.input=P.input.slice(0,-1);else if(v==='ok'){if(P.input!=='')submit(P.input);return}else if(P.input.length<6)P.input=(P.input==='0'?'':P.input)+v;updDisp();return}
  const ch=t.closest('[data-c]');
  if(ch&&!P.done){P.choice=+ch.dataset.c;document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('sel',b===ch));$('#chOk').disabled=false;return}
  if(t.closest('#chOk')&&!P.done&&P.choice!=null){submit(cq().choices[P.choice]);return}
  const tl=t.closest('[data-t]');
  if(tl&&!P.done){const v=cq().choices[+tl.dataset.t];if(P.msel.has(v))P.msel.delete(v);else P.msel.add(v);const on=P.msel.has(v);tl.classList.toggle('sel',on);tl.setAttribute('aria-pressed',on);$('#mOk').disabled=!P.msel.size;return}
  if(t.closest('#mOk')&&!P.done){const q=cq();submit(q.choices.filter(c=>P.msel.has(c)));return}
  const ob=t.closest('[data-op]');if(ob){orderTap(+ob.dataset.op);return}
  if(t.closest('#ordReset')){orderReset();return}
  if(t.closest('#ordOk')&&!P.done){submit(P.sel.slice());return}
  if(t.closest('#hintBtn')){showHint();return}
  if(t.closest('#nextBtn')){next();return}
});
document.addEventListener('keydown',e=>{
  if(!P||$('#play').hidden)return;const q=cq();
  if(P.done){if(e.key==='Enter'){e.preventDefault();next()}return}
  if(q.kind==='frac'){const F=P.fin,o=['w','n','d'];if(/^[0-9]$/.test(e.key)){if(F[P.ff].length<3)F[P.ff]=(F[P.ff]==='0'?'':F[P.ff])+e.key}else if(e.key==='Backspace')F[P.ff]=F[P.ff].slice(0,-1);else if(e.key==='ArrowRight'||e.key==='/'){e.preventDefault();P.ff=o[Math.min(2,o.indexOf(P.ff)+1)]}else if(e.key==='ArrowLeft'){P.ff=o[Math.max(0,o.indexOf(P.ff)-1)]}else if(e.key==='Enter'&&((F.n&&F.d)||(F.w&&!F.n&&!F.d))){e.preventDefault();submit()}updDisp();return}
  if(q.kind!=='num')return;
  if(/^[0-9]$/.test(e.key)){if(P.input.length<6){P.input=(P.input==='0'?'':P.input)+e.key;updDisp()}}
  else if(e.key==='Backspace'){P.input=P.input.slice(0,-1);updDisp()}
  else if(e.key==='Enter'&&P.input!==''){e.preventDefault();submit(P.input)}
});
renderHome();
</script>
