<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>몽글몽글 섬</title>
<meta name="theme-color" content="#74c4ee">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root { --ink: #4a3b52; --line: #6b5876; --cream: #fff8ea; --pink: #ff9db5; --mint: #9be3c8; --sun: #ffe08a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #49a6e0; color: var(--ink); overscroll-behavior: none;
    font-family: Jua, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; user-select: none; -webkit-user-select: none; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  [hidden] { display: none !important; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .pill { background: var(--cream); border: 3px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 20px; box-shadow: 0 3px 0 rgba(74,59,82,.35); }
  #hud-left { position: fixed; left: calc(10px + env(safe-area-inset-left)); top: calc(10px + env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 6px; align-items: flex-start; pointer-events: none; }
  #island-name { font-size: 16px; padding: 4px 12px; }
  #hud-right { position: fixed; right: calc(10px + env(safe-area-inset-right)); top: calc(10px + env(safe-area-inset-top)); display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 70vw; }
  .hbtn { position: relative; width: 62px; height: 62px; border-radius: 18px; border: 3px solid var(--line); background: var(--cream); box-shadow: 0 4px 0 rgba(74,59,82,.4);
    display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 26px; line-height: 1; padding: 0; }
  .hbtn small { font-size: 12px; margin-top: 3px; }
  .hbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(74,59,82,.4); }
  .hbtn .dot { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; background: #ff5f7a; border: 2px solid #fff; }
  #act { position: fixed; right: calc(18px + env(safe-area-inset-right)); bottom: calc(18px + env(safe-area-inset-bottom)); min-width: 132px; height: 96px; border-radius: 30px; padding: 0 18px;
    border: 4px solid var(--line); background: var(--sun); font-size: 26px; box-shadow: 0 6px 0 rgba(74,59,82,.45); }
  #act:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(74,59,82,.45); }
  #act.off { opacity: .4; background: var(--cream); }
  #act.hot { background: #ff8fa8; animation: pulse .25s infinite alternate; }
  @keyframes pulse { to { transform: scale(1.08); } }
  #toast { position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: calc(100vw - 330px); min-width: 200px; text-align: center;
    background: rgba(74,59,82,.9); color: #fff; border-radius: 18px; padding: 10px 18px; font-size: 20px; pointer-events: none; transition: opacity .25s; }
  #toast.hide { opacity: 0; }
  @media (max-width: 700px) { #toast { bottom: calc(130px + env(safe-area-inset-bottom)); max-width: 92vw; } .hbtn { width: 52px; height: 52px; font-size: 22px; } .hbtn small { font-size: 10px; } }

  #card { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); background: var(--cream); border: 4px solid var(--line); border-radius: 26px; padding: 14px 30px 16px; text-align: center;
    box-shadow: 0 8px 0 rgba(74,59,82,.4); animation: pop .25s; min-width: 250px; }
  #card .big { font-size: 76px; line-height: 1.1; }
  #card b { display: block; font-size: 28px; }
  #card span { display: block; font-size: 19px; color: #7b6a86; margin-top: 2px; }
  #card .new { display: inline-block; margin-top: 8px; background: var(--pink); color: #fff; border-radius: 999px; padding: 3px 14px; font-size: 18px; }
  @keyframes pop { from { transform: translateX(-50%) scale(.6); opacity: 0; } }

  #buildbar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,248,234,.96); border-top: 4px solid var(--line); padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); display: flex; gap: 10px; align-items: center; }
  #build-items { flex: 1; display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px; }
  .slot { position: relative; flex: none; width: 66px; height: 66px; border-radius: 16px; border: 3px solid #cbbfd2; background: #fff; font-size: 34px; display: flex; align-items: center; justify-content: center; padding: 0; }
  .slot img { width: 46px; height: 46px; image-rendering: pixelated; border-radius: 6px; }
  .slot.on { border-color: #ff5f7a; box-shadow: 0 0 0 4px #ffd0da; }
  .slot .cnt { position: absolute; right: -4px; bottom: -4px; background: var(--line); color: #fff; font-size: 14px; border-radius: 999px; padding: 1px 7px; }
  #build-tip { position: fixed; left: 50%; top: calc(84px + env(safe-area-inset-top)); transform: translateX(-50%); font-size: 18px; white-space: nowrap; pointer-events: none; background: #ffe9f0; }

  .btn { border: 3px solid var(--line); background: #fff; border-radius: 14px; padding: 8px 16px; font-size: 20px; box-shadow: 0 4px 0 rgba(74,59,82,.35); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(74,59,82,.35); }
  .btn:disabled { opacity: .4; }
  .btn.go { background: var(--mint); } .btn.pink { background: var(--pink); color: #fff; } .btn.on { background: var(--sun); }
  .btn.small { font-size: 16px; padding: 5px 11px; }

  #modal, #intro { position: fixed; inset: 0; background: rgba(60,45,70,.45); display: flex; align-items: center; justify-content: center; padding: 12px; }
  #intro { background: linear-gradient(#8fd6f5, #c9f0dc); }
  .panel { background: var(--cream); border: 4px solid var(--line); border-radius: 26px; width: 100%; max-width: 760px; max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 8px 0 rgba(74,59,82,.4); overflow: hidden; }
  .panel header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #ffe9f0; border-bottom: 3px solid var(--line); font-size: 26px; }
  .panel header .sp { flex: 1; }
  #modal-body { padding: 14px 16px 18px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
  .cell { position: relative; border: 3px solid #d9cfe0; background: #fff; border-radius: 16px; padding: 8px 4px; text-align: center; font-size: 15px; min-height: 104px; }
  button.cell:active { background: #fff3c9; }
  .cell .em { font-size: 40px; line-height: 1.15; display: block; }
  .cell .cnt { position: absolute; right: 6px; top: 4px; background: var(--line); color: #fff; font-size: 14px; border-radius: 999px; padding: 1px 8px; }
  .cell small { display: block; color: #8a7a94; }
  .cell.dim { opacity: .45; } .cell.none { background: #f1ecf4; color: #b3a8bb; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .note { color: #7b6a86; font-size: 17px; margin: 0 0 12px; }
  h3 { margin: 14px 0 8px; font-size: 20px; }
  .mission { display: flex; align-items: center; gap: 12px; border: 3px solid #d9cfe0; background: #fff; border-radius: 16px; padding: 10px 12px; margin-bottom: 8px; font-size: 19px; }
  .mission .em { font-size: 32px; } .mission .mid { flex: 1; }
  .bar { height: 12px; border-radius: 999px; background: #eee6f2; overflow: hidden; margin-top: 5px; }
  .bar i { display: block; height: 100%; background: var(--mint); }
  .field { display: flex; align-items: center; gap: 10px; margin: 10px 0; font-size: 20px; flex-wrap: wrap; }
  .field input { flex: 1; min-width: 150px; border: 3px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: 22px; background: #fff; user-select: text; -webkit-user-select: text; }
  .sw { width: 42px; height: 42px; border-radius: 50%; border: 3px solid #cbbfd2; padding: 0; flex: none; }
  .sw.on { border-color: var(--ink); box-shadow: 0 0 0 3px var(--sun); }
  .sw.thumb { border-radius: 10px; background-size: cover; image-rendering: pixelated; background-color: #fff; }
  .two { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; justify-content: center; }
  .two > .side { flex: 1; min-width: 240px; }
  #st-cv { width: min(52vh, 86vw, 420px); height: min(52vh, 86vw, 420px); border: 4px solid var(--line); border-radius: 12px; touch-action: none; background: #fff; display: block; }
  #st-pal { display: grid; grid-template-columns: repeat(5, 42px); gap: 7px; margin: 8px 0 12px; }
  #st-slots { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 10px; }
  #look-cv { width: 170px; height: 200px; background: #d7f3c8; border: 4px solid var(--line); border-radius: 18px; }
  .intro-card { text-align: center; padding: 22px; }
  .intro-card h1 { font-size: 44px; margin: 6px 0 2px; color: #ff6f91; }
  .intro-card .logo { font-size: 64px; }
  .how { text-align: left; background: #fff; border: 3px dashed #d9cfe0; border-radius: 16px; padding: 10px 16px; font-size: 18px; line-height: 1.6; margin: 12px 0; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud-left">
  <div class="pill" id="coins">💰 0</div>
  <div class="pill" id="island-name"></div>
</div>
<div id="hud-right">
  <button class="hbtn" data-open="bag">🎒<small>가방</small></button>
  <button class="hbtn" data-open="build">🔨<small>꾸미기</small></button>
  <button class="hbtn" data-open="studio">🎨<small>그림판</small></button>
  <button class="hbtn" data-open="dex">📖<small>도감</small></button>
  <button class="hbtn" data-open="note">📝<small>수첩</small><i class="dot" id="note-dot" hidden></i></button>
  <button class="hbtn" data-open="set">⚙️<small>설정</small></button>
</div>
<button id="act" class="off">…</button>
<div id="toast" class="hide"></div>
<div id="card" hidden></div>

<div class="pill" id="build-tip" hidden>🔨 꾸미기 중 · 아래에서 고르고 땅을 눌러요</div>
<div id="buildbar" hidden>
  <div id="build-items"></div>
  <button class="btn go" id="build-done">다 했어!</button>
</div>

<div id="modal" hidden>
  <div class="panel">
    <header><span id="modal-title"></span><span class="sp"></span><button class="btn small" id="modal-close">닫기 ✕</button></header>
    <div id="modal-body"></div>
  </div>
</div>

<div id="intro" hidden>
  <div class="panel intro-card">
    <div class="logo">🏝️</div>
    <h1>몽글몽글 섬</h1>
    <p class="note">나만의 섬에서 낚시하고, 그리고, 꾸미며 놀아요!</p>
    <div class="field"><span>내 이름</span><input id="in-name" maxlength="8" value="하늘"></div>
    <div class="field"><span>섬 이름</span><input id="in-island" maxlength="8" value="몽글몽글"></div>
    <div class="how">
      🚶 <b>걷기</b>: 가고 싶은 곳을 꾹 누르기 (키보드는 방향키)<br>
      ✨ <b>행동</b>: 오른쪽 아래 노란 단추 (키보드는 스페이스)<br>
      🎣 물가에서 낚시, 🌳 나무를 흔들어 과일 따기, 🛍️ 상점에서 팔고 사기
    </div>
    <button class="btn go" id="intro-go" style="font-size:28px;padding:12px 34px">섬으로 출발! ⛵</button>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/draw.js"></script>
<script src="js/game.js"></script>
</body>
</html>
