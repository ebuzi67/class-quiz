<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>런던 탐방</title>
<meta name="theme-color" content="#2b3a55">
<link rel="manifest" href="manifest.json?v=1">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2d2a32; --soft: #6f6878; --glass: rgba(255, 253, 248, .78); --glass2: rgba(255, 253, 248, .93);
    --navy: #1f2d4a; --red: #c8102e; --gold: #d9a521; --line: rgba(45, 42, 50, .12); --go: #2f8f5b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe3ee; color: var(--ink);
    font-family: Jua, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; border: 0; background: none; }
  [hidden] { display: none !important; }
  #scene { position: fixed; inset: 0; touch-action: none; }
  #scene canvas { display: block; width: 100%; height: 100%; }

  .glass { background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.7);
    box-shadow: 0 6px 20px rgba(30, 40, 60, .18); }

  /* 위쪽 */
  #top { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top) + 10px) 12px 0; display: flex; gap: 8px; align-items: flex-start; pointer-events: none; }
  #top > * { pointer-events: auto; }
  #next { flex: 1; min-width: 0; border-radius: 18px; padding: 8px 12px; display: flex; gap: 10px; align-items: center; text-align: left; }
  #next .em { font-size: 28px; }
  #next b { display: block; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #next small { display: block; color: var(--soft); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #tools { display: flex; border-radius: 18px; padding: 4px; }
  #tools button { width: 42px; height: 46px; font-size: 22px; border-radius: 14px; }
  #tools button:active { background: rgba(0,0,0,.06); }

  #toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 76px); transform: translateX(-50%); max-width: 88vw; text-align: center;
    border-radius: 18px; padding: 9px 16px; font-size: 16px; color: #fff; background: rgba(35, 40, 52, .72); transition: opacity .4s; pointer-events: none; }
  #toast.off { opacity: 0; }

  /* 아래쪽 */
  #bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 12px calc(env(safe-area-inset-bottom) + 10px); display: grid; gap: 8px; pointer-events: none; }
  #bottom > * { pointer-events: auto; }
  #info { border-radius: 20px; padding: 10px 14px; max-width: 560px; width: 100%; margin: 0 auto; }
  #info .row1 { display: flex; align-items: center; gap: 8px; font-size: 16px; }
  #status { font-size: 13px; padding: 3px 9px; border-radius: 999px; background: #e1efe4; color: var(--go); }
  #status.stop { background: #ece9f1; color: var(--soft); }
  #status.look { background: #fdeccc; color: #9a6a12; }
  #dist { margin-left: auto; color: var(--soft); font-size: 14px; }
  #bar-out { height: 6px; background: rgba(0,0,0,.08); border-radius: 6px; margin: 8px 0 7px; overflow: hidden; }
  #bar-in { height: 100%; width: 0; background: linear-gradient(90deg, #f0c24b, #e2853a); border-radius: 6px; transition: width .4s; }
  #info .row2 { font-size: 14px; color: var(--soft); display: flex; gap: 10px; flex-wrap: wrap; }
  #info .row2 b { color: var(--ink); }

  #bar { border-radius: 22px; padding: 6px; display: flex; justify-content: space-around; max-width: 560px; width: 100%; margin: 0 auto; }
  #bar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; border-radius: 16px; font-size: 13px; color: var(--ink); }
  #bar button .i { font-size: 24px; line-height: 1.1; }
  #bar button:active { background: rgba(0,0,0,.06); }
  #bar #walk { background: var(--navy); color: #fff; flex: 1.3; }
  #bar #walk.on { background: #e2853a; }

  /* 창(모달) */
  #modal { position: fixed; inset: 0; background: rgba(20, 24, 34, .35); display: flex; align-items: flex-end; justify-content: center; padding: 12px; padding-bottom: calc(env(safe-area-inset-bottom) + 12px); z-index: 20; }
  #sheet { width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto; border-radius: 26px; padding: 18px 18px 16px; background: var(--glass2); position: relative;
    box-shadow: 0 12px 40px rgba(20, 24, 34, .35); animation: up .25s ease-out; }
  @keyframes up { from { transform: translateY(30px); opacity: 0; } }
  #sheet .x { position: absolute; right: 12px; top: 12px; width: 38px; height: 38px; border-radius: 50%; background: rgba(0,0,0,.06); font-size: 18px; }
  #sheet h2 { margin: 0 44px 10px 0; font-size: 24px; }
  #sheet p { line-height: 1.6; }
  .big { width: 100%; padding: 14px; border-radius: 16px; background: var(--navy); color: #fff; font-size: 19px; margin-top: 10px; }
  .big.soft { background: rgba(0,0,0,.06); color: var(--ink); }
  .big.red { background: var(--red); }
  .big:active { transform: translateY(2px); }

  .lm-head { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
  .lm-head .em { font-size: 52px; }
  .lm-head h2 { margin: 0 !important; }
  .lm-head small { color: var(--soft); font-size: 16px; }
  .facts { list-style: none; padding: 0; margin: 6px 0; display: grid; gap: 8px; }
  .facts li { background: rgba(255,255,255,.75); border-radius: 14px; padding: 10px 12px; font-size: 16.5px; line-height: 1.55; }
  .say { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 999px; background: #e9eef8; color: #2a4a8a; font-size: 15px; }
  .eng { margin-top: 10px; border-radius: 16px; padding: 12px; background: linear-gradient(135deg, #1f2d4a, #34507f); color: #fff; display: flex; align-items: center; gap: 12px; }
  .eng .t { flex: 1; }
  .eng small { opacity: .75; font-size: 13px; }
  .eng b { display: block; font-size: 24px; letter-spacing: .3px; }
  .eng .k { opacity: .9; font-size: 15px; }
  .eng button { background: rgba(255,255,255,.18); color: #fff; width: 48px; height: 48px; border-radius: 50%; font-size: 22px; }

  .q { font-size: 20px; line-height: 1.5; margin: 6px 0 12px; }
  .choices { display: grid; gap: 10px; }
  .choice { padding: 14px; border-radius: 16px; background: #fff; border: 2px solid var(--line); font-size: 19px; text-align: left; }
  .choice.good { background: #e1f5e6; border-color: #3aa564; }
  .choice.bad { background: #fde6e6; border-color: #e06666; animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .why { margin-top: 12px; padding: 12px; border-radius: 14px; background: #fff7e0; font-size: 16px; line-height: 1.55; }

  .stamp { width: 128px; height: 128px; margin: 10px auto 0; border-radius: 50%; border: 5px double var(--red); color: var(--red); display: flex; flex-direction: column;
    align-items: center; justify-content: center; transform: rotate(-12deg); font-size: 13px; text-align: center; line-height: 1.2; }
  .stamp .em { font-size: 40px; }
  .stamp.pop { animation: stampin .5s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes stampin { from { transform: scale(2.4) rotate(-30deg); opacity: 0; } }

  .passport-head { background: linear-gradient(135deg, #6b1626, #8f2236); color: #f6dfa0; border-radius: 18px; padding: 14px; text-align: center; margin-bottom: 12px; }
  .passport-head b { display: block; font-size: 26px; letter-spacing: 3px; }
  .stamps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stamps button { aspect-ratio: 1; border-radius: 50%; border: 3px dashed #c9c2d1; color: #b7b0c0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; line-height: 1.2; padding: 4px; background: rgba(255,255,255,.5); }
  .stamps button.got { border: 4px double var(--red); color: var(--red); background: #fffaf0; }
  .stamps button .em { font-size: 30px; }
  .words { margin-top: 14px; display: grid; gap: 6px; }
  .words div { display: flex; justify-content: space-between; gap: 8px; background: rgba(255,255,255,.7); border-radius: 12px; padding: 8px 12px; font-size: 15px; }
  .words div span { color: var(--soft); }

  #mapsvg { width: 100%; height: auto; background: #f4efe2; border-radius: 16px; }

  .opts { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 12px; }
  .opt { padding: 9px 13px; border-radius: 999px; background: #fff; border: 2px solid var(--line); font-size: 16px; }
  .opt.on { border-color: var(--navy); background: #e6ecf8; }
  .opt.color { width: 40px; height: 40px; padding: 0; border-radius: 50%; }
  .opt.color.on { box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--navy); }
  .label { font-size: 15px; color: var(--soft); margin-top: 6px; }
  .toggle { display: flex; align-items: center; justify-content: space-between; padding: 10px 2px; border-bottom: 1px solid var(--line); font-size: 17px; }
  .toggle small { display: block; color: var(--soft); font-size: 13px; }
  .sw { width: 52px; height: 30px; border-radius: 999px; background: #d6d1dc; position: relative; flex: none; }
  .sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .2s; }
  .sw.on { background: #e2a33a; }
  .sw.on::after { left: 25px; }

  #postcard-img { width: 100%; border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.2); }

  /* 시작 화면 */
  #start { position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: center; padding: 12px; padding-bottom: calc(env(safe-area-inset-bottom) + 12px); z-index: 10; }
  #start .card { width: 100%; max-width: 520px; border-radius: 26px; padding: 0 18px 18px; background: var(--glass2); max-height: 86vh; overflow-y: auto; box-shadow: 0 12px 40px rgba(20,24,34,.3); }
  #start h1 { margin: 0; font-size: 30px; text-align: center; }
  /* 캐릭터 미리보기: 카드를 내려도 위에 붙어 있어요 */
  #preview { position: sticky; top: 0; z-index: 2; margin: 0 -18px 8px; padding: 10px 18px 6px; background: linear-gradient(#e3eef5, #f4f1ea); border-radius: 26px 26px 0 0;
    display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
  #pv { width: 130px; height: 150px; flex: none; }
  #pv-side { flex: 1; min-width: 0; }
  #pv-name { display: inline-block; background: var(--navy); color: #fff; border-radius: 999px; padding: 4px 14px; font-size: 18px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name-input { width: 100%; font: inherit; font-size: 17px; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--line); background: #fff; margin: -4px 0 10px; }
  .name-input:focus { outline: none; border-color: var(--navy); }
  /* 조이스틱 */
  #stick { position: fixed; left: 16px; width: 124px; height: 124px; border-radius: 50%; z-index: 5; touch-action: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: var(--navy); box-shadow: 0 4px 12px rgba(0,0,0,.3); pointer-events: none; }
  #stick small { position: absolute; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--soft); pointer-events: none; }
  #start .en { text-align: center; color: var(--gold); margin: 2px 0 8px; letter-spacing: 1px; }
  #start .sub { text-align: center; color: var(--soft); font-size: 15px; line-height: 1.6; margin: 0 0 10px; }
  #start .foot { text-align: center; color: #9a93a3; font-size: 12px; margin-top: 10px; }
  #wish-line { text-align: center; font-size: 17px; margin: 4px 0; min-height: 24px; color: #8a4a12; }

  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; background: #cfe3ee; z-index: 30; font-size: 20px; color: var(--navy); }
  #loading .em { font-size: 60px; animation: bob 1s infinite alternate; }
  @keyframes bob { to { transform: translateY(-10px); } }

  /* 같이 걷기 */
  #friends { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 560px; width: 100%; margin: 0 auto; }
  #friends button { border-radius: 999px; padding: 6px 12px; font-size: 14px; }
  #emotes { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 560px; width: 100%; margin: 0 auto; border-radius: 20px; padding: 8px; }
  #emotes button { background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 8px 12px; font-size: 15px; }
  #emotes button:active { transform: translateY(2px); }
  .sub2 { display: block; font-size: 14px; opacity: .75; margin-top: 2px; }
  .code-big { display: flex; gap: 10px; justify-content: center; margin: 12px 0; }
  .code-big span { width: 60px; height: 72px; border-radius: 16px; background: #fff; border: 3px solid var(--navy); font-size: 40px; display: flex; align-items: center; justify-content: center; }
  .code-big span.on { border-color: #e2853a; box-shadow: 0 0 0 4px #fde3c4; }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 320px; margin: 0 auto; }
  .pad button { font-size: 28px; padding: 10px 0; border-radius: 14px; background: #fff; border: 2px solid var(--line); }
  .pad button.soft { font-size: 18px; background: rgba(0,0,0,.05); }
  .pad button:active { transform: translateY(2px); }
  .msg { min-height: 26px; text-align: center; font-size: 16px; margin: 8px 0; }
  .msg.bad { color: #c0392b; } .msg.wait { color: #2a5aa8; }
  .room-list { display: grid; gap: 6px; margin: 6px 0; }
  .room-list div { display: flex; justify-content: space-between; background: rgba(255,255,255,.75); border-radius: 12px; padding: 10px 12px; font-size: 17px; }
  .room-list div span { color: var(--go); font-size: 14px; }
  .room-list div.wait { color: var(--soft); justify-content: center; }
  .big:disabled { opacity: .45; }

  .confetti { position: fixed; top: -20px; width: 10px; height: 16px; z-index: 25; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>
<div id="scene"></div>

<div id="loading"><div class="em">🎒</div><div>런던으로 가는 중…</div></div>

<div id="top" hidden>
  <button id="next" class="glass"><span class="em">👑</span><span style="min-width:0"><b id="next-name">→ 버킹엄 궁전</b><small id="next-sub">런던</small></span></button>
  <div id="tools" class="glass">
    <button id="btn-sound" aria-label="소리">🔊</button>
    <button id="btn-map" aria-label="지도">🗺️</button>
    <button id="btn-photo" aria-label="사진">📷</button>
  </div>
</div>
<div id="toast" class="off"></div>

<div id="bottom" hidden>
  <div id="friends" hidden></div>
  <div id="emotes" class="glass" hidden></div>
  <div id="info" class="glass">
    <div class="row1"><span id="status" class="stop">멈춤</span><span id="info-title">런던 탐방</span><span id="dist">0.0 / 7.0km</span></div>
    <div id="bar-out"><div id="bar-in"></div></div>
    <div class="row2"><span>🛂 도장 <b id="stamp-count">0</b>/9</span><span id="info-line">화면을 끌면 둘러볼 수 있어요</span></div>
  </div>
  <div id="bar" class="glass">
    <button id="btn-hello"><span class="i">👋</span>Hello!</button>
    <button id="btn-speed"><span class="i">🐢</span>천천히</button>
    <button id="walk"><span class="i">▶</span>걷기</button>
    <button id="btn-passport"><span class="i">🛂</span>여권</button>
    <button id="btn-more"><span class="i">⋯</span>더 보기</button>
  </div>
</div>

<div id="start" hidden>
  <div class="card">
    <div id="preview"><canvas id="pv"></canvas><div id="pv-side"><h1 style="text-align:left">🇬🇧 런던 탐방</h1><div class="en" style="text-align:left">LONDON WALK</div><span id="pv-name">아이</span></div></div>
    <p class="sub">캐릭터가 런던 거리를 걸어요. 엄마와 아이가 각자 기기로 같이 걸을 수도 있어요.<br>명소 9곳에서 이야기를 듣고, 퀴즈를 풀고, 여권에 도장을 모아요!</p>
    <div class="label">이름 (같이 걸을 때 보여요)</div>
    <div class="opts" id="opt-name"></div>
    <input class="name-input" id="name-input" maxlength="8" placeholder="✏️ 이름 직접 쓰기 (8글자까지)" autocomplete="off">
    <div class="label">모자</div>
    <div class="opts" id="opt-hat"></div>
    <div class="label">옷 색깔</div>
    <div class="opts" id="opt-shirt"></div>
    <div class="label">✨ 여행 소원 (누구와)</div>
    <div class="opts" id="opt-who"></div>
    <div class="label">✨ 여행 소원 (무엇을)</div>
    <div class="opts" id="opt-what"></div>
    <div id="wish-line"></div>
    <div class="label">걷는 방법</div>
    <div class="opts" id="opt-walk"></div>
    <button class="big red" id="btn-together">👨‍👩‍👧 같이 걷기<small class="sub2">각자 기기로 함께 걸어요</small></button>
    <button class="big" id="btn-go">혼자 걷기 🚶</button>
    <button class="big soft" id="btn-restart" hidden>처음부터 다시 걷기</button>
    <div class="foot">실제 런던의 길과 건물을 단순하게 만든 그림이에요</div>
  </div>
</div>

<div id="stick" class="glass" hidden><small style="top:6px">앞</small><small style="bottom:6px">뒤</small><div id="knob"></div></div>

<div id="modal" hidden><div id="sheet"></div></div>

<script src="lib/three.min.js"></script>
<script src="js/data.js"></script>
<script src="js/world.js"></script>
<script src="lib/peerjs.min.js"></script>
<script src="js/net.js"></script>
<script src="js/main.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</body>
</html>
