<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>원이랑 수다</title>
<link rel="manifest" href="manifest.json">

<style>
:root {
  --bg: #fff7ef;
  --stage: #ffe3cf;
  --one: #e8302a;
  --ink: #2a1a17;
  --muted: #8a6a62;
  --bubble-me: #2f6fd6;
  --bubble-me-ink: #ffffff;
  --bubble-one: #ffffff;
  --line: #f1d6c6;
  --shade: rgba(40, 20, 15, .5);
  --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1d1514; --stage: #2c1d1b; --ink: #fbeee9; --muted: #c4a59c;
    --bubble-me: #4a86ea; --bubble-one: #33241f; --line: #4a3330; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px;
  display: flex; flex-direction: column; overflow: hidden;
  padding-top: env(safe-area-inset-top, 0px);
}
.wrap {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  width: 100%; max-width: 720px; margin: 0 auto;
}
header { background: var(--stage); border-bottom: 3px solid var(--line); flex: none; }
header .wrap { display: flex; align-items: center; gap: 14px; padding-block: 10px; }
.one-fig { width: 104px; flex: none; cursor: pointer; color: var(--ink); }
.one-fig svg { width: 100%; height: auto; display: block; overflow: visible; }
.who { min-width: 0; flex: 1; }
.who h1 { font-family: var(--font-display); font-weight: 400; font-size: 30px; margin: 0; color: var(--one); line-height: 1.1; }
.who p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
.tools { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; flex: none; max-width: 190px; }
.icon-btn {
  font: inherit; font-size: 14px; border: 2px solid var(--line); background: var(--bg); color: var(--ink);
  border-radius: 999px; padding: 6px 12px; cursor: pointer;
}
.icon-btn[aria-pressed="true"] { border-color: var(--one); color: var(--one); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--bubble-me); outline-offset: 2px; }

main { flex: 1; overflow-y: auto; min-height: 0; }
main .wrap { display: flex; flex-direction: column; gap: 12px; padding-block: 16px; }
.row { display: flex; gap: 8px; align-items: flex-end; }
.row.me { justify-content: flex-end; }
.avatar { width: 34px; height: 34px; flex: none; }
.bubble {
  max-width: 78%; padding: 10px 14px; border-radius: 20px; line-height: 1.55;
  white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; min-width: 0;
}
.row.one .bubble { background: var(--bubble-one); border: 2px solid var(--line); border-bottom-left-radius: 6px; }
.row.me .bubble { background: var(--bubble-me); color: var(--bubble-me-ink); border-bottom-right-radius: 6px; }
.dots { color: var(--muted); }
.dots span { display: inline-block; animation: hop 1s infinite; }
.dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
@keyframes hop { 0%,60%,100% { transform: none } 30% { transform: translateY(-4px) } }

footer { flex: none; border-top: 2px solid var(--line); background: var(--bg); padding-bottom: env(safe-area-inset-bottom, 0px); }
footer .wrap { padding-block: 10px; display: flex; flex-direction: column; gap: 8px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.chip {
  flex: none; font: inherit; font-size: 15px; background: var(--stage); color: var(--ink);
  border: 2px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer;
}
.chip.answer { font-family: var(--font-display); font-size: 20px; min-width: 52px; }
form#form { display: flex; gap: 8px; }
#msg {
  flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 12px 16px; border-radius: 999px;
  border: 2px solid var(--line); background: var(--bubble-one); color: var(--ink);
}
#mic {
  flex: none; width: 48px; border-radius: 999px; border: 2px solid var(--line); background: var(--bubble-one);
  font-size: 22px; cursor: pointer; color: var(--ink);
}
#mic.on { border-color: var(--one); background: var(--stage); animation: pulse 1s infinite; }
@keyframes pulse { 50% { transform: scale(1.08) } }
.big-btn, #send {
  font-family: var(--font-display); font-size: 18px; border: none; border-radius: 999px; padding: 10px 20px;
  background: var(--one); color: #fff; cursor: pointer;
}
#send:disabled, .chip:disabled, #mic:disabled { opacity: .5; cursor: default; }

.sheet { position: fixed; inset: 0; background: var(--shade); display: grid; place-items: center; padding: 16px; z-index: 10; }
.sheet > div { background: var(--bg); color: var(--ink); border-radius: 18px; padding: 22px; width: 100%; max-width: 420px; }
.sheet h2 { font-family: var(--font-display); font-weight: 400; font-size: 24px; margin: 0 0 10px; }
.sheet li { line-height: 1.7; }
.sheet .actions { display: flex; justify-content: flex-end; margin-top: 12px; }

/* 원 움직임 */
.one-body { transform-origin: 50% 100%; animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
.lid { transform-origin: 50px 52px; animation: blink 4.5s infinite; }
@keyframes blink { 0%,94%,100% { transform: scaleY(0) } 96% { transform: scaleY(1) } }
.mouth-open { opacity: 0; }
.talking .mouth-open { animation: talk .28s infinite alternate; }
.talking .mouth-shut { animation: talk .28s infinite alternate-reverse; }
@keyframes talk { from { opacity: 0 } to { opacity: 1 } }
.arm-r { transform-origin: 86px 64px; }
.wave .arm-r { animation: wave .5s ease-in-out 3 alternate; }
@keyframes wave { from { transform: rotate(0) } to { transform: rotate(-55deg) } }
.jump .one-body { animation: jump .45s ease-out 2; }
@keyframes jump { 50% { transform: translateY(-14px) } }
@media (prefers-reduced-motion: reduce) {
  .one-body, .lid, .dots span, .wave .arm-r, .jump .one-body, #mic.on { animation: none; }
}
@media (max-width: 460px) {
  .one-fig { width: 76px; }
  .who h1 { font-size: 24px; }
  .who p { display: none; }
  .tools { max-width: 120px; }
}
</style>
</head>

<header>

<script>
// 원은 AI가 아니에요. 아래에 정해 둔 말과 놀이로만 대답하고, 아무 데도 연결하지 않아요.

// ---------- 넘버블럭스 친구들 ----------
const FRIENDS = {
  1: { name: "원", say: "그건 바로 나야! 빨간 블록 하나, 눈도 하나! 하나인 게 제일 좋아!" },
  2: { name: "투", say: "투는 주황색 블록 두 개야. 짝꿍을 좋아하고 노래를 잘 불러! 🎵" },
  3: { name: "쓰리", say: "쓰리는 노란색 블록 세 개야. 장난꾸러기 광대라서 저글링도 해!" },
  4: { name: "포", say: "포는 초록색 블록 네 개야. 네모 반듯한 걸 좋아해!" },
  5: { name: "파이브", say: "파이브는 블록 다섯 개야. 손가락이 다섯 개라서 하이파이브를 잘해! 🖐️" },
  6: { name: "식스", say: "식스는 블록 여섯 개야. 주사위처럼 점 여섯 개가 될 수 있어! 🎲" },
  7: { name: "세븐", say: "세븐은 무지개색 블록 일곱 개야. 무지개도 일곱 색깔이지! 🌈" },
  8: { name: "에이트", say: "에이트는 블록 여덟 개야. 문어처럼 다리가 여덟 개인 슈퍼히어로! 🐙" },
  9: { name: "나인", say: "나인은 블록 아홉 개야. 3줄씩 3번, 커다란 네모가 될 수 있어!" },
  10: { name: "텐", say: "텐은 블록 열 개야. 손가락 열 개처럼 딱 맞는 대장이야! 🔟" },
};
const FRIEND_NAMES = { "원": 1, "투": 2, "쓰리": 3, "포": 4, "파이브": 5, "식스": 6, "세븐": 7, "에이트": 8, "나인": 9, "텐": 10 };
// "포는 누구야"의 포는 친구 이름이지만 "포도"의 포는 아니에요: 이름 바로 뒤에 오는 말로 가려요
function friendIn(n, skipOne) {
  return Object.keys(FRIEND_NAMES).find((k) => !(skipOne && k === "원") &&
    new RegExp(k + "(은|는|이|가|야|랑|이랑|누구|소개|이야기|얘기|에대해|$)").test(n)) || null;
}

// ---------- 정해 둔 대답 ----------
// keys: 이 낱말 중 하나가 들어 있으면(띄어쓰기 무시) 그 대답 중 하나를 골라요. 위에 있을수록 먼저 봐요.
const TOPICS = [
  { id: "real", keys: ["진짜야", "진짜원", "로봇", "컴퓨터", "ai", "인공지능", "사람이야"], replies: [
    "나는 원 흉내를 내는 앱 친구야! 정해진 말만 할 수 있지만 같이 놀면 재밌을 거야! ☝️",
  ] },
  { id: "bye", keys: ["잘가", "또봐", "바이", "안녕히", "갈게", "끝"], replies: [
    "잘 가! 또 놀러 와! 하나, 둘, 안녕! 👋", "오늘 정말 재밌었어! 다음에 또 만나자!",
  ], act: "wave" },
  { id: "hi", keys: ["안녕", "하이", "반가", "hello", "hi"], replies: [
    "안녕! 나는 원이야! 하나, 하나, 나는 하나! ☝️", "반가워! 오늘은 뭐 하고 놀까?", "안녕안녕! 원이 손 흔들고 있어! 👋",
  ], act: "wave" },
  { id: "sad", keys: ["슬퍼", "슬프", "슬펐", "속상", "울고", "울었", "힘들", "외로", "짜증", "화나"], replies: [
    "그랬구나… 원이 꼭 안아 줄게. 속상한 일은 엄마 아빠한테 꼭 말해 봐. 이야기하면 마음이 가벼워져!",
    "괜찮아, 그럴 때도 있어. 엄마 아빠나 선생님께 이야기해 보자. 원은 늘 네 편이야! ❤️",
  ] },
  { id: "scared", keys: ["무서", "겁나"], replies: [
    "무서울 땐 엄마 아빠 곁에 가자! 그리고 원이랑 같이 하나, 둘, 셋 숨 쉬어 보자. 후~",
  ] },
  { id: "love", keys: ["사랑해", "좋아해", "최고야", "멋져", "귀여"], replies: [
    "헤헤, 나도 네가 좋아! 너는 하나뿐인 내 친구야! ❤️", "우와, 고마워! 원 얼굴이 더 빨개졌어! ☺️",
  ], act: "jump" },
  { id: "thanks", keys: ["고마워", "고맙", "감사"], replies: ["천만에! 원은 도와주는 게 좋아!", "언제든지! 하나도 안 힘들어!"] },
  { id: "sorry", keys: ["미안"], replies: ["괜찮아! 우리는 친구잖아. 다시 신나게 놀자!"] },
  { id: "name", keys: ["이름", "누구야", "누구니", "넌누구", "너누구"], replies: [
    "나는 원이야! 숫자 1이지. 빨간 블록 하나로 되어 있어!", "내 이름은 원! 하나, 하나, 나는 하나!",
  ] },
  { id: "age", keys: ["몇살", "나이"], replies: ["나는 숫자 1이니까… 한 살이라고 할까? 헤헤!"] },
  { id: "feel", keys: ["기분", "어때", "뭐해", "뭐하니"], replies: [
    "나는 기분이 하나도… 아니, 엄청 좋아! 너랑 이야기하니까!", "블록 위에서 콩콩 뛰고 있었어! 너는 오늘 뭐 했어?",
  ] },
  { id: "fav", keys: ["좋아하는", "뭐좋아", "제일좋"], replies: [
    "나는 하나인 걸 좋아해! 해 하나, 달 하나, 코 하나! ☀️", "나는 친구들이랑 합쳐지는 게 좋아! 원이랑 원이 만나면 투가 되거든!",
  ] },
  { id: "color", keys: ["색깔", "무슨색", "빨간"], replies: ["나는 빨간색! 사과처럼, 소방차처럼 빨개! 🍎"] },
  { id: "food", keys: ["배고", "먹", "간식", "밥"], replies: ["나는 사과 하나면 충분해! 🍎 너는 뭐 먹는 거 좋아해?"] },
  { id: "sleep", keys: ["졸려", "잘자", "잘게", "자야"], replies: ["잘 자! 별 하나, 달 하나, 그리고 원 하나! 좋은 꿈 꿔! 🌙"] },
  { id: "song", keys: ["노래"], replies: [
    "🎵 하나, 하나, 나는 하나~ 빨간 블록 하나~ 혼자여도 신나지~ 나는 원이야! 🎵",
    "🎵 원 더하기 원은 투~ 투 더하기 원은 쓰리~ 하나씩 더하면 계속 커지지~ 🎵",
  ], act: "jump" },
  { id: "joke", keys: ["웃긴", "농담", "재밌는얘기", "재미있는"], replies: [
    "숫자 6이 왜 7을 무서워할까? 7이 뭐든 다 먹어 버리거든! 헤헤 😆",
    "원이 거울을 보면 몇 명일까? 그래도 원! 하나뿐이거든! 😄",
    "블록들이 제일 좋아하는 운동은? 쌓기 운동! 😆",
  ], act: "jump" },
];

const FALLBACK = [
  "음~ 그건 원이 잘 모르겠어! 대신 숫자 퀴즈 할래? ☝️",
  "우와, 그렇구나! 원은 숫자 놀이를 제일 잘해. 같이 해 볼래?",
  "헤헤, 원은 아직 그 말은 몰라! 아래 버튼을 눌러서 같이 놀자!",
];

// ---------- 도우미 ----------
const lastPick = {};
function pick(list, key) {
  let i = Math.floor(Math.random() * list.length);
  if (list.length > 1 && i === lastPick[key]) i = (i + 1) % list.length;
  lastPick[key] = i;
  return list[i];
}
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const blocks = (n) => "🟥".repeat(n);
// 받침이 있으면 앞의 말, 없으면 뒤의 말: josa(5, "이야", "야") → "5야", josa("텐", "이", "가") → "텐이"
const NUM_BATCHIM = [true, true, false, true, false, false, true, true, true, false]; // 영 일 이 삼 사 오 육 칠 팔 구
function josa(w, withB, without) {
  let b;
  if (typeof w === "number") b = w % 10 === 0 ? true : NUM_BATCHIM[w % 10];
  else { const c = w.charCodeAt(w.length - 1); b = c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28 !== 0; }
  return w + (b ? withB : without);
}
const norm = (t) => t.toLowerCase().replace(/[\s.,!?~^'"…·]/g, "");

const NATIVE = [["열", 10], ["아홉", 9], ["여덟", 8], ["일곱", 7], ["여섯", 6], ["다섯", 5], ["넷", 4], ["네", 4], ["셋", 3], ["세", 3], ["둘", 2], ["두", 2], ["하나", 1], ["한", 1], ["영", 0]];
const SINO = { "영": 0, "공": 0, "일": 1, "이": 2, "삼": 3, "사": 4, "오": 5, "육": 6, "칠": 7, "팔": 8, "구": 9, "십": 10 };
// "5", "다섯", "다섯 개", "오" 같은 대답에서 수를 찾아요
function parseNum(t) {
  const n = norm(t);
  const d = n.match(/\d+/);
  if (d) return Number(d[0]);
  const f = friendIn(n);
  if (f) return FRIEND_NAMES[f];
  for (const [w, v] of NATIVE) if (n.startsWith(w)) return v;
  const s = n.replace(/(개|야|요|이야|입니다|이에요)$/, "");
  if (s.length === 1 && s in SINO) return SINO[s];
  return null;
}

// ---------- 놀이 ----------
let game = null; // {type: "quiz", q, tries, round, score} 또는 {type: "find", count}

function newQuestion() {
  const kind = pick(["count", "add", "add", "sub"], "qkind");
  if (kind === "count") {
    const n = rand(1, 10);
    return { answer: n, text: `블록이 몇 개일까?\n${blocks(n)}` };
  }
  if (kind === "add") {
    const a = rand(1, 5), b = rand(1, 5);
    return { answer: a + b, text: `${a} 더하기 ${josa(b, "은", "는")} 뭘까?\n${blocks(a)} + ${blocks(b)}` };
  }
  const a = rand(3, 10), b = rand(1, a - 1);
  return { answer: a - b, text: `${a} 빼기 ${josa(b, "은", "는")} 뭘까?\n블록 ${a}개에서 ${b}개가 톡 떨어졌어!\n${blocks(a)}` };
}

function startQuiz() {
  game = { type: "quiz", round: 1, score: 0, tries: 0, q: newQuestion() };
  return [`좋아, 숫자 퀴즈 시작! 모두 5문제야. 아래 버튼을 눌러도 되고 말로 해도 돼!`, `1번 문제! ${game.q.text}`];
}

function quizTurn(t) {
  const n = parseNum(t);
  const q = game.q;
  if (n === null) return [`숫자로 대답해 줘! ${q.text}`];
  const out = [];
  if (n === q.answer) {
    game.score++;
    out.push(pick([`딩동댕! ${q.answer}! 정말 잘했어! 🎉`, `맞았어! 정답은 ${q.answer}! 최고야! ⭐`, `우와, ${q.answer} 정답! 원이 신나서 점프했어!`], "right"));
    act("jump");
  } else if (game.tries === 0) {
    game.tries = 1;
    return [pick([`음~ 아까워! 블록을 하나씩 손가락으로 세어 볼까? 다시 한 번!`, `거의 다 왔어! 천천히 다시 생각해 봐!`], "wrong")];
  } else {
    out.push(`괜찮아! 정답은 ${josa(q.answer, "이었어", "였어")}. ${blocks(q.answer)} 다음 문제는 꼭 맞힐 수 있어!`);
  }
  if (game.round >= 5) {
    out.push(`퀴즈 끝! 5문제 중에 ${game.score}개 맞혔어! ${game.score >= 4 ? "숫자 박사네! 🏆" : "잘했어! 또 하면 더 잘할 거야! 💪"}`);
    game = null;
    return out;
  }
  game.round++; game.tries = 0; game.q = newQuestion();
  out.push(`${game.round}번 문제! ${game.q.text}`);
  return out;
}

const ONLY_ONE = {
  "해": "맞아, 해는 하나! 하늘에서 반짝반짝 ☀️", "태양": "맞아, 태양은 하나! ☀️", "달": "맞아, 달도 하나! 밤에 나를 비춰 줘 🌙",
  "코": "맞아, 코는 하나! 킁킁! 👃", "입": "맞아, 입도 하나! 냠냠! 👄", "배꼽": "배꼽도 하나! 헤헤 😆", "머리": "맞아, 머리도 하나!",
  "지구": "맞아, 우리 지구는 하나! 🌍", "나": "맞아! 너는 세상에 하나뿐이야! ❤️", "엄마": "맞아, 우리 엄마는 하나뿐이야! ❤️", "아빠": "맞아, 우리 아빠도 하나뿐이야! ❤️",
  "눈": "어? 너는 눈이 두 개잖아! 하나인 건 내 눈이야! 헤헤 👁️", "귀": "앗, 귀는 두 개야! 양쪽에 하나씩! 그건 투 친구 거야!", "손": "손은 두 개지! 대신 손 하나만 들어 볼까? ✋",
};
function startFind() {
  game = { type: "find", count: 0 };
  return ["하나인 것 찾기 놀이! 세상에 딱 하나만 있는 걸 말해 줘! 예를 들면… 해? 코? ☝️"];
}
function findTurn(t) {
  const n = norm(t);
  const hit = Object.keys(ONLY_ONE).find((k) => n.startsWith(k));
  const out = [hit ? ONLY_ONE[hit] : pick(["우와, 그것도 하나구나! 좋아! ☝️", "오~ 하나 찾았다! 잘했어!", "그렇구나! 하나, 하나, 하나! 👍"], "find")];
  game.count++;
  if (game.count >= 3) {
    out.push("세 개나 찾았어! 너는 하나 찾기 대장이야! 🏅");
    act("jump");
    game = null;
  } else {
    out.push(pick(["또 하나인 거 찾아볼까?", "하나 더 말해 줘!", "다른 것도 있을까?"], "findmore"));
  }
  return out;
}

// "3 더하기 2", "하나 더하기 하나", "5-1" 같은 계산
function tryMath(t) {
  const m = t.replace(/\s+/g, " ").match(/(\S+?)\s*(더하기|\+|빼기|-|−)\s*(\S+)/);
  if (!m) return null;
  const a = parseNum(m[1]), b = parseNum(m[3].replace(/(은|는|이|가)?(뭐야|얼마|몇).*$/, "")), plus = /더하기|\+/.test(m[2]);
  if (a === null || b === null) return null;
  if (!plus && a < b) return [`앗, ${a}에서 ${josa(b, "은", "는")} 아직 뺄 수 없어! 큰 수에서 작은 수를 빼 볼까? 예: ${b} 빼기 ${a}`];
  const r = plus ? a + b : a - b;
  if (a > 20 || b > 20) return [`우와, 큰 수다! 답은 ${josa(r, "이야", "야")}! 원은 작은 수가 더 좋지만 계산은 잘해! 😄`];
  const pic = plus ? `${blocks(a)} + ${blocks(b)}` : `${blocks(a)} 에서 ${b}개 톡!`;
  const who = FRIENDS[r] ? ` 바로 ${josa(FRIENDS[r].name, "이", "가")} 되는 거야!` : "";
  if (r === 0) return [`${a} 빼기 ${josa(b, "은", "는")} 0! 블록이 하나도 안 남았어! 텅~`];
  return [`${pic}\n${plus ? "합치면" : "남은 건"} 블록 ${r}개! 그러니까 ${josa(r, "이야", "야")}!${who}`];
}

function friendTalk(t) {
  const n = norm(t);
  const name = friendIn(n, true);
  if (/친구/.test(n) && !/[0-9]/.test(n) && !name) {
    return ["내 친구들은 넘버블럭스야! 투, 쓰리, 포, 파이브… 텐까지 있어! 누가 궁금해? 이름이나 숫자를 말해 줘!"];
  }
  const digit = n.match(/^(\d+)(이|은|는|가)?(누구|뭐|궁금)?/);
  const num = name ? FRIEND_NAMES[name] : digit ? Number(digit[1]) : null;
  if (num === null) return null;
  if (FRIENDS[num]) return [FRIENDS[num].say];
  return [`${num}! 그건 블록 ${num}개짜리 큰 친구야! 원이 ${num}번 모이면 될 수 있어!`];
}

// ---------- 원의 대답 고르기 ----------
function reply(t) {
  const n = norm(t);
  if (game && /그만|안할래|싫어|멈춰/.test(n)) { game = null; return ["알겠어! 놀이 끝! 다른 거 하고 싶으면 말해 줘! ☝️"]; }
  if (/퀴즈|문제/.test(n)) return startQuiz();
  if (/하나인것|하나찾기|찾기놀이/.test(n)) return startFind();
  if (/세기|세어/.test(n)) return startQuiz();
  if (game?.type === "quiz") return quizTurn(t);
  if (game?.type === "find") return findTurn(t);
  const math = tryMath(t);
  if (math) return math;
  const friend = friendTalk(t);
  if (friend) return friend;
  if (/놀자|놀이|게임|심심/.test(n)) return ["좋아! 숫자 퀴즈 할래, 하나인 것 찾기 할래? 아래 버튼을 눌러 봐!"];
  for (const tp of TOPICS) {
    if (tp.keys.some((k) => n.includes(k))) {
      if (tp.act) act(tp.act);
      return [pick(tp.replies, tp.id)];
    }
  }
  return [pick(FALLBACK, "fallback")];
}

// ---------- 화면 ----------
const GREETING = "안녕! 나는 원이야! ☝️ 하나, 하나, 나는 하나! 오늘은 무슨 이야기 할까?";
const CHIPS = ["안녕 원!", "숫자 퀴즈 하자", "하나인 것 찾기", "친구들 소개해 줘", "노래 불러 줘", "웃긴 이야기 해 줘", "3 더하기 2는?"];
const CHAT_STORE = "one-chat-history";
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

const $ = (id) => document.getElementById(id);
const log = $("log"), scroller = $("scroller"), msg = $("msg"), send = $("send"), fig = $("fig"), mic = $("mic");
fig.append($("one-svg").content.cloneNode(true));

let view = [], busy = false, speak = false;

function save() { store.set(CHAT_STORE, JSON.stringify(view.slice(-100))); }
function scrollDown() { scroller.scrollTop = scroller.scrollHeight; }

function miniOne() {
  const s = document.createElement("div");
  s.className = "avatar";
  s.innerHTML = `<svg viewBox="0 0 40 40" aria-hidden="true"><rect x="4" y="4" width="32" height="32" rx="4" fill="#e8302a"/><circle cx="20" cy="17" r="8" fill="#a3201c"/><circle cx="20" cy="17" r="6" fill="#fff"/><circle cx="20" cy="17.5" r="3.6" fill="#111"/><path d="M14 27 q6 6 12 0 q-6 2 -12 0z" fill="#7a1512"/></svg>`;
  return s;
}

function addBubble(who, text) {
  const row = document.createElement("div");
  row.className = "row " + who;
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  if (who === "one") row.append(miniOne());
  row.append(b);
  log.append(row);
  scrollDown();
  return b;
}

function act(kind) {
  fig.classList.remove("wave", "jump");
  void fig.offsetWidth;
  fig.classList.add(kind);
}
function talk(on) { fig.classList.toggle("talking", on); }

function sayAloud(text) {
  if (!speak || !("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[\u{1F300}-\u{1FAFF}☀-➿⭐\u{1F7E5}]/gu, "").replace(/\+/g, " 더하기 "));
    u.lang = "ko-KR"; u.pitch = 1.6; u.rate = 1.05;
    u.onstart = () => talk(true);
    u.onend = u.onerror = () => talk(false);
    speechSynthesis.speak(u);
  } catch (e) {}
}

function renderChips() {
  const box = $("chips");
  box.textContent = "";
  let list = CHIPS, answer = false;
  if (game?.type === "quiz") {
    const a = game.q.answer, opts = new Set([a]);
    while (opts.size < 3) { const o = a + rand(-3, 3); if (o >= 0 && o <= 12) opts.add(o); }
    list = [...opts].sort((x, y) => x - y).map(String).concat("그만할래");
    answer = true;
  } else if (game?.type === "find") {
    list = ["해", "달", "코", "지구", "그만할래"];
  }
  list.forEach((c) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "chip" + (answer && /^\d+$/.test(c) ? " answer" : "");
    btn.textContent = c;
    btn.disabled = busy;
    btn.onclick = () => ask(c);
    box.append(btn);
  });
}

function wait(ms) { return new Promise((r) => setTimeout(r, ms)); }

async function ask(text) {
  text = text.trim();
  if (!text || busy) return;
  msg.value = "";
  addBubble("me", text);
  view.push({ who: "me", text });
  busy = true;
  send.disabled = true;
  renderChips();
  const lines = reply(text);
  for (const line of lines) {
    const b = addBubble("one", "");
    b.innerHTML = '<span class="dots"><span>●</span> <span>●</span> <span>●</span></span>';
    talk(true);
    await wait(500 + Math.min(line.length * 12, 700));
    b.textContent = line;
    talk(false);
    view.push({ who: "one", text: line });
    scrollDown();
  }
  sayAloud(lines.join(" "));
  busy = false;
  send.disabled = false;
  save();
  renderChips();
}

function render() {
  log.textContent = "";
  addBubble("one", GREETING);
  view.forEach((m) => addBubble(m.who, m.text));
  renderChips();
}

// ---------- 말로 하기 (마이크) ----------
const Recog = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null;
if (Recog) {
  mic.hidden = false;
  mic.onclick = () => {
    if (recog) { recog.stop(); return; }
    try { speechSynthesis.cancel(); } catch (e) {}
    recog = new Recog();
    recog.lang = "ko-KR";
    recog.interimResults = true;
    let finalText = "";
    recog.onresult = (e) => {
      const r = Array.from(e.results).map((x) => x[0].transcript).join("");
      msg.value = r;
      if (e.results[e.results.length - 1].isFinal) finalText = r;
    };
    recog.onend = () => {
      mic.classList.remove("on");
      recog = null;
      if (finalText.trim()) ask(finalText);
    };
    recog.onerror = () => {};
    mic.classList.add("on");
    try { recog.start(); } catch (e) { mic.classList.remove("on"); recog = null; }
  };
}

// ---------- 버튼 연결 ----------
$("form").addEventListener("submit", (e) => { e.preventDefault(); ask(msg.value); });
$("reset").onclick = () => {
  try { speechSynthesis.cancel(); } catch (e) {}
  if (busy) return;
  view = []; game = null; save(); render(); act("wave");
};
const voiceBtn = $("voice");
if (!("speechSynthesis" in window)) voiceBtn.hidden = true;
voiceBtn.onclick = () => {
  speak = !speak;
  voiceBtn.setAttribute("aria-pressed", String(speak));
  voiceBtn.textContent = speak ? "🔊 소리" : "🔈 소리";
  if (!speak) { try { speechSynthesis.cancel(); } catch (e) {} talk(false); }
};
fig.onclick = () => act(Math.random() < .5 ? "wave" : "jump");

try {
  const saved = JSON.parse(store.get(CHAT_STORE) || "null");
  if (Array.isArray(saved)) view = saved.filter((m) => m && typeof m.text === "string");
} catch (e) {}
render();
act("wave");

// ---------- 홈 화면에 설치하기 ----------
// 안드로이드·PC 크롬: 브라우저가 설치 가능하다고 알려 줄 때만 버튼을 보여 주고, 누르면 설치 창을 띄워요.
// 아이폰·아이패드: 자동 설치 창이 없어서, 누르면 "공유 → 홈 화면에 추가" 순서를 안내해요.
(() => {
  const btn = $("installBtn"); let ev = null;
  const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const upd = () => { btn.hidden = standalone() || !(ev || ios); };
  addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); ev = e; upd(); });
  addEventListener("appinstalled", () => { ev = null; upd(); });
  btn.addEventListener("click", async () => {
    if (ev) { const e = ev; ev = null; e.prompt(); try { await e.userChoice; } catch (_) {} upd(); return; }
    const s = document.createElement("div");
    s.className = "sheet";
    s.innerHTML = `<div role="dialog" aria-label="설치 안내"><h2>아이패드·아이폰에 설치하기</h2>
      <ol><li><b>사파리</b>에서 이 페이지를 열어요.</li>
      <li>위쪽(아이폰은 아래쪽)의 <b>공유 버튼</b>(□↑)을 눌러요.</li>
      <li><b>홈 화면에 추가</b>를 누르고 <b>추가</b>를 눌러요.</li></ol>
      <div class="actions"><button class="big-btn">알겠어요</button></div></div>`;
    s.addEventListener("click", (e) => { if (e.target === s || e.target.closest("button")) s.remove(); });
    document.body.append(s);
  });
  upd();
})();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
