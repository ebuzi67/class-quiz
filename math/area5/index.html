<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>넓이 퀴즈 - 5학년</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2f6b3a">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="넓이 퀴즈">
  <style>
    :root {
      --bg: #f3f8ef;
      --card: #ffffff;
      --text: #222;
      --muted: #666;
      --green: #2f6b3a;
      --green-soft: #e6f2e0;
      --orange: #e8590c;
      --blue: #1971c2;
      --correct: #2e9d5b;
      --correct-bg: #e3f6ea;
      --wrong: #d9443b;
      --wrong-bg: #fde6e4;
      --hint-bg: #fff4e6;
      --border: #d6e4cf;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      font-size: 20px; line-height: 1.55;
      display: flex; justify-content: center; padding: 16px;
    }
    .app { width: 100%; max-width: 720px; }
    h1 { font-size: 1.5em; margin: 4px 0 2px; text-align: center; }
    .sub { text-align: center; color: var(--muted); margin: 0 0 16px; font-size: .9em; }
    .card { background: var(--card); border: 2px solid var(--border); border-radius: 18px; padding: 18px; margin-bottom: 14px; }
    button { font: inherit; cursor: pointer; border: none; border-radius: 14px; }
    .unit { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; background: var(--card); border: 2px solid var(--border); padding: 16px; margin-bottom: 12px; }
    .unit:active, .unit:hover { border-color: var(--green); }
    .unit .emo { font-size: 2em; }
    .unit b { display: block; font-size: 1.1em; }
    .unit small { color: var(--muted); }
    .stars { color: #f59f00; letter-spacing: 2px; }
    .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .back { background: #fff; border: 2px solid var(--border); padding: 6px 14px; font-size: .9em; }
    .topbar .t { font-weight: 800; flex: 1; }
    .btn { display: block; width: 100%; padding: 14px; font-weight: 800; font-size: 1.05em; margin-top: 10px; }
    .primary { background: var(--green); color: #fff; }
    .ghost { background: #fff; color: var(--green); border: 2px solid var(--green); }
    .section { display: flex; justify-content: space-between; align-items: center; width: 100%; background: #fff; border: 2px solid var(--border); padding: 14px 16px; margin-bottom: 10px; text-align: left; }
    .section .n { color: var(--muted); font-size: .85em; }
    .fig { text-align: center; margin: 8px 0; overflow-x: auto; }
    .fig svg text { font-family: inherit; }
    .figrow { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
    .figrow .fig { flex: 1 1 180px; }
    .cap { margin: 0; font-size: .85em; text-align: center; }
    .or { color: var(--orange); font-weight: 800; }
    .bl { color: var(--blue); font-weight: 800; }
    .tip { background: var(--green-soft); border-radius: 12px; padding: 10px 14px; margin: 10px 0; font-weight: 700; }
    .tip.big { font-size: 1.05em; }
    .warn { background: var(--hint-bg); border-radius: 12px; padding: 10px 14px; }
    .ex { color: var(--muted); }
    .progress { height: 10px; background: #dfe9d9; border-radius: 6px; overflow: hidden; margin-bottom: 12px; }
    .progress > div { height: 100%; background: var(--green); transition: width .3s; }
    .qtext { font-size: 1.1em; margin: 6px 0 10px; }
    .answer { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
    .answer input { flex: 1; min-width: 0; font: inherit; font-size: 1.3em; padding: 10px 14px; border: 2px solid var(--border); border-radius: 12px; text-align: center; }
    .answer input:focus { outline: none; border-color: var(--green); }
    .answer .unitlabel { font-weight: 800; }
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
    .choice { background: #fff; border: 2px solid var(--border); padding: 14px; font-size: 1.15em; font-weight: 800; }
    .choice.sel { border-color: var(--green); background: var(--green-soft); }
    .choice.right { border-color: var(--correct); background: var(--correct-bg); }
    .choice.bad { border-color: var(--wrong); background: var(--wrong-bg); }
    .feedback { border-radius: 14px; padding: 12px 14px; margin-top: 12px; }
    .feedback.ok { background: var(--correct-bg); border: 2px solid var(--correct); }
    .feedback.no { background: var(--wrong-bg); border: 2px solid var(--wrong); }
    .feedback.hint { background: var(--hint-bg); border: 2px solid #f0a35e; }
    .feedback b.h { display: block; margin-bottom: 4px; }
    .dots { display: flex; justify-content: center; gap: 6px; margin: 10px 0; }
    .dots span { width: 10px; height: 10px; border-radius: 50%; background: #cfdcc8; }
    .dots span.on { background: var(--green); }
    .row2 { display: flex; gap: 10px; }
    .row2 .btn { margin-top: 0; }
    .big-score { font-size: 3em; font-weight: 800; text-align: center; color: var(--green); margin: 4px 0; }
    .center { text-align: center; }
    .review { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 10px; font-size: .95em; }
    .install { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; margin-bottom: 14px;
      background: #fff; color: var(--green); border: 2px dashed var(--green); font-weight: 800; font-size: 1.05em; }
    .guide { background: #fff; border: 2px solid var(--green); border-radius: 18px; padding: 16px 18px; margin-bottom: 14px; }
    .guide ol { margin: 8px 0 4px; padding-left: 1.3em; }
    .guide li { margin: 6px 0; }
    .guide .close { float: right; background: none; color: var(--muted); font-size: 1.2em; padding: 0 4px; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--green); color: #fff;
      padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: .9em; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
    .footer { text-align: center; color: var(--muted); font-size: .75em; margin-top: 20px; }
    @media (max-width: 420px) { body { font-size: 18px; padding: 12px; } .choices { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div class="app" id="app"></div>
  <script>
    const DATA = {"units": [{"id": "tri", "emoji": "🔺", "title": "삼각형의 밑변과 높이", "desc": "짝꿍(밑변↔높이) 찾기와 넓이로 길이 구하기", "concepts": [{"title": "높이란?", "html": "<div class=\"fig\"><svg viewBox=\"0 0 200 135\" style=\"width:100%;max-width:300px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"93.3,34.0 53.1,101.0 146.9,101.0\" fill=\"#EAF4E4\" stroke=\"none\"/><line x1=\"93.3\" y1=\"34.0\" x2=\"53.1\" y2=\"101.0\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><line x1=\"53.1\" y1=\"101.0\" x2=\"146.9\" y2=\"101.0\" stroke=\"#E8590C\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"146.9\" y1=\"101.0\" x2=\"93.3\" y2=\"34.0\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><line x1=\"93.3\" y1=\"34.0\" x2=\"93.3\" y2=\"101.0\" stroke=\"#1971C2\" stroke-width=\"2.6\" stroke-dasharray=\"6 4\"/><polyline points=\"102.3,101.0 102.3,92.0 93.3,92.0\" fill=\"none\" stroke=\"#1971C2\" stroke-width=\"1.3\"/><text x=\"91.8\" y=\"24.1\" font-size=\"15\" text-anchor=\"middle\" fill=\"#222\">ㄱ</text><text x=\"39.7\" y=\"112.7\" font-size=\"15\" text-anchor=\"middle\" fill=\"#222\">ㄴ</text><text x=\"160.6\" y=\"112.2\" font-size=\"15\" text-anchor=\"middle\" fill=\"#222\">ㄷ</text><text x=\"93.3\" y=\"121.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#222\">ㄹ</text></svg></div>\n<p><span class=\"or\">밑변</span>을 하나 정하면, 그 밑변과 <b>마주 보는 꼭짓점</b>에서 밑변에 <b>수직(직각)</b>으로 그은 선분이 <span class=\"bl\">높이</span>예요.</p>\n<div class=\"tip\">높이 찾기 3단계<br>① 밑변을 정한다 → ② 마주 보는 꼭짓점을 찾는다 → ③ 그 꼭짓점에서 <b>직각 표시</b>가 있는 선분을 찾는다</div>"}, {"title": "짝꿍이 3쌍 있어요", "html": "<div class=\"figrow\"><div class=\"fig\"><svg viewBox=\"0 0 200 135\" style=\"width:100%;max-width:300px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"93.3,34.0 53.1,101.0 146.9,101.0\" fill=\"#EAF4E4\" stroke=\"none\"/><line x1=\"93.3\" y1=\"34.0\" x2=\"53.1\" y2=\"101.0\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><line x1=\"53.1\" y1=\"101.0\" x2=\"146.9\" y2=\"101.0\" stroke=\"#E8590C\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"146.9\" y1=\"101.0\" x2=\"93.3\" y2=\"34.0\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><line x1=\"93.3\" y1=\"34.0\" x2=\"93.3\" y2=\"101.0\" stroke=\"#1971C2\" stroke-width=\"2.6\" stroke-dasharray=\"6 4\"/><polyline points=\"102.3,101.0 102.3,92.0 93.3,92.0\" fill=\"none\" stroke=\"#1971C2\" stroke-width=\"1.3\"/><text x=\"91.8\" y=\"24.1\" font-size=\"15\" text-anchor=\"middle\" fill=\"#222\">ㄱ</text><text x=\"39.7\" y=\"112.7\" font-size=\"15\" text-anchor=\"middle\" fill=\"#222\">ㄴ</text><text x=\"160.6\" y=\"112.2\" font-size=\"15\" text-anchor=\"middle\" fill=\"#222\">ㄷ</text><text x=\"93.3\" y=\"121.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#222\">ㄹ</text></svg><p class=\"cap\"><span class=\"or\">ㄴㄷ</span> ↔ <span class=\"bl\">ㄱㄹ</span></p></div>\n<div class=\"fig\"><svg viewBox=\"0 0 200 135\" style=\"width:100%;max-width:300px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"93.3,34.0 53.1,101.0 146.9,101.0\" fill=\"#EAF4E4\" stroke=\"none\"/><line x1=\"93.3\" y1=\"34.0\" x2=\"53.1\" y2=\"101.0\" stroke=\"#E8590C\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"53.1\" y1=\"101.0\" x2=\"146.9\" y2=\"101.0\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><line x1=\"146.9\" y1=\"101.0\" x2=\"93.3\" y2=\"34.0\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><line x1=\"146.9\" y1=\"101.0\" x2=\"77.9\" y2=\"59.6\" stroke=\"#1971C2\" stroke-width=\"2.6\" stroke-dasharray=\"6 4\"/><polyline points=\"73.3,67.3 81.0,72.0 85.6,64.2\" fill=\"none\" stroke=\"#1971C2\" stroke-width=\"1.3\"/><text x=\"91.8\" y=\"24.1\" font-size=\"15\" text-anchor=\"middle\" fill=\"#222\">ㄱ</text><text x=\"39.7\" y=\"112.7\" font-size=\"15\" text-anchor=\"middle\" fill=\"#222\">ㄴ</text><text x=\"160.6\" y=\"112.2\" font-size=\"15\" text-anchor=\"middle\" fill=\"#222\">ㄷ</text><text x=\"65.1\" y=\"56.9\" font-size=\"15\" text-anchor=\"middle\" fill=\"#222\">ㄹ</text></svg><p class=\"cap\"><span class=\"or\">ㄱㄴ</span> ↔ <span class=\"bl\">ㄷㄹ</span></p></div>\n<div class=\"fig\"><svg viewBox=\"0 0 200 135\" style=\"width:100%;max-width:300px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"93.3,34.0 53.1,101.0 146.9,101.0\" fill=\"#EAF4E4\" stroke=\"none\"/><line x1=\"93.3\" y1=\"34.0\" x2=\"53.1\" y2=\"101.0\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><line x1=\"53.1\" y1=\"101.0\" x2=\"146.9\" y2=\"101.0\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><line x1=\"146.9\" y1=\"101.0\" x2=\"93.3\" y2=\"34.0\" stroke=\"#E8590C\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"53.1\" y1=\"101.0\" x2=\"110.3\" y2=\"55.2\" stroke=\"#1971C2\" stroke-width=\"2.6\" stroke-dasharray=\"6 4\"/><polyline points=\"115.9,62.3 108.9,67.9 103.3,60.9\" fill=\"none\" stroke=\"#1971C2\" stroke-width=\"1.3\"/><text x=\"91.8\" y=\"24.1\" font-size=\"15\" text-anchor=\"middle\" fill=\"#222\">ㄱ</text><text x=\"39.7\" y=\"112.7\" font-size=\"15\" text-anchor=\"middle\" fill=\"#222\">ㄴ</text><text x=\"160.6\" y=\"112.2\" font-size=\"15\" text-anchor=\"middle\" fill=\"#222\">ㄷ</text><text x=\"122.0\" y=\"50.9\" font-size=\"15\" text-anchor=\"middle\" fill=\"#222\">ㄹ</text></svg><p class=\"cap\"><span class=\"or\">ㄱㄷ</span> ↔ <span class=\"bl\">ㄴㄹ</span></p></div></div>\n<p>한 삼각형에는 (밑변, 높이) 짝꿍이 3쌍 있어요. 밑변을 바꾸면 높이도 바뀌어요.</p>"}, {"title": "넓이는 모두 같아요", "html": "<div class=\"tip big\">같은 삼각형이니까 어느 짝꿍으로 계산해도 <b>넓이는 똑같아요!</b><br><br>\n(밑변①) × (높이①) ÷ 2 = (밑변②) × (높이②) ÷ 2</div>\n<p>그래서 <b>짝꿍 하나로 넓이를 구한 뒤</b>, 다른 짝꿍의 모르는 길이를 거꾸로 구할 수 있어요.</p>\n<p class=\"ex\">예) 밑변 10 cm, 높이 9 cm → 넓이 45 cm²<br>다른 밑변이 15 cm라면 15 × □ ÷ 2 = 45 → □ = 6 (cm)</p>"}, {"title": "높이가 바깥에 있을 때", "html": "<div class=\"fig\"><svg viewBox=\"0 0 230 145\" style=\"width:100%;max-width:345px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"62.1,34.0 100.6,111.0 167.9,111.0\" fill=\"#EAF4E4\" stroke=\"none\"/><line x1=\"100.6\" y1=\"111.0\" x2=\"62.1\" y2=\"111.0\" stroke=\"#888\" stroke-width=\"1.4\" stroke-dasharray=\"2 3\"/><line x1=\"62.1\" y1=\"34.0\" x2=\"100.6\" y2=\"111.0\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><line x1=\"100.6\" y1=\"111.0\" x2=\"167.9\" y2=\"111.0\" stroke=\"#E8590C\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"167.9\" y1=\"111.0\" x2=\"62.1\" y2=\"34.0\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><line x1=\"62.1\" y1=\"34.0\" x2=\"62.1\" y2=\"111.0\" stroke=\"#1971C2\" stroke-width=\"2.6\" stroke-dasharray=\"6 4\"/><polyline points=\"71.1,111.0 71.1,102.0 62.1,102.0\" fill=\"none\" stroke=\"#1971C2\" stroke-width=\"1.3\"/><text x=\"51.8\" y=\"28.1\" font-size=\"15\" text-anchor=\"middle\" fill=\"#222\">ㄱ</text><text x=\"95.3\" y=\"130.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#222\">ㄴ</text><text x=\"181.6\" y=\"122.1\" font-size=\"15\" text-anchor=\"middle\" fill=\"#222\">ㄷ</text><text x=\"62.1\" y=\"131.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#222\">ㄹ</text></svg></div>\n<p>한 각이 둔각인 삼각형은 높이가 삼각형 <b>바깥</b>에 생길 수 있어요. 밑변을 <b>점선으로 늘려서(연장선)</b> 그 위에 직각으로 만나는 선분을 찾아요.</p>\n<p class=\"warn\">넓이를 구할 때 밑변은 실제 변의 길이만 써요. 늘린 점선 부분은 넣지 않아요!</p>"}, {"title": "꿀팁: 종이를 돌려 보세요", "html": "<div class=\"figrow\"><div class=\"fig\"><svg viewBox=\"0 0 230 145\" style=\"width:100%;max-width:345px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"120.3,46.8 34.8,111.0 195.2,111.0\" fill=\"#EAF4E4\" stroke=\"none\"/><line x1=\"120.3\" y1=\"46.8\" x2=\"137.5\" y2=\"34.0\" stroke=\"#888\" stroke-width=\"1.4\" stroke-dasharray=\"2 3\"/><line x1=\"120.3\" y1=\"46.8\" x2=\"34.8\" y2=\"111.0\" stroke=\"#E8590C\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"34.8\" y1=\"111.0\" x2=\"195.2\" y2=\"111.0\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><line x1=\"195.2\" y1=\"111.0\" x2=\"120.3\" y2=\"46.8\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><line x1=\"195.2\" y1=\"111.0\" x2=\"137.5\" y2=\"34.0\" stroke=\"#1971C2\" stroke-width=\"2.6\" stroke-dasharray=\"6 4\"/><polyline points=\"130.3,39.4 135.7,46.6 142.9,41.2\" fill=\"none\" stroke=\"#1971C2\" stroke-width=\"1.3\"/><text x=\"121.6\" y=\"36.9\" font-size=\"15\" text-anchor=\"middle\" fill=\"#222\">ㄱ</text><text x=\"20.3\" y=\"119.8\" font-size=\"15\" text-anchor=\"middle\" fill=\"#222\">ㄴ</text><text x=\"209.7\" y=\"119.9\" font-size=\"15\" text-anchor=\"middle\" fill=\"#222\">ㄷ</text><text x=\"128.5\" y=\"27.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#222\">ㄹ</text></svg><p class=\"cap\">밑변 ㄱㄴ이 비스듬해요</p></div>\n<div class=\"fig\"><svg viewBox=\"0 0 230 145\" style=\"width:100%;max-width:345px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"80.8,111.0 166.3,111.0 63.7,34.0\" fill=\"#EAF4E4\" stroke=\"none\"/><line x1=\"80.8\" y1=\"111.0\" x2=\"63.7\" y2=\"111.0\" stroke=\"#888\" stroke-width=\"1.4\" stroke-dasharray=\"2 3\"/><line x1=\"80.8\" y1=\"111.0\" x2=\"166.3\" y2=\"111.0\" stroke=\"#E8590C\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"166.3\" y1=\"111.0\" x2=\"63.7\" y2=\"34.0\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><line x1=\"63.7\" y1=\"34.0\" x2=\"80.8\" y2=\"111.0\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><line x1=\"63.7\" y1=\"34.0\" x2=\"63.7\" y2=\"111.0\" stroke=\"#1971C2\" stroke-width=\"2.6\" stroke-dasharray=\"6 4\"/><polyline points=\"72.7,111.0 72.7,102.0 63.7,102.0\" fill=\"none\" stroke=\"#1971C2\" stroke-width=\"1.3\"/><text x=\"70.8\" y=\"127.2\" font-size=\"15\" text-anchor=\"middle\" fill=\"#222\">ㄱ</text><text x=\"180.2\" y=\"121.7\" font-size=\"15\" text-anchor=\"middle\" fill=\"#222\">ㄴ</text><text x=\"54.5\" y=\"27.2\" font-size=\"15\" text-anchor=\"middle\" fill=\"#222\">ㄷ</text><text x=\"63.7\" y=\"131.0\" font-size=\"15\" text-anchor=\"middle fff\" stroke-width=\"4\">20 cm</text><text x=\"127.9\" y=\"61.2\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\">6 cm</text><text x=\"250.7\" y=\"109.5\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1971C2\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\">□ cm</text></svg>", "q": "선분 <b>ㄷㄹ</b>의 길이는 몇 cm일까요?", "answer": 12, "unit": "cm", "explain": "밑변 ㄴㄷ(20) ↔ 높이 ㄱㅁ(6): 20 × 6 ÷ 2 = 60<br>밑변 ㄱㄴ(10) ↔ 높이 ㄷㄹ: 10 × □ ÷ 2 = 60 → □ = <b>12</b>", "hint": "높이가 삼각형 바깥에 있는 짝꿍을 찾아요. 길이를 둘 다 아는 (밑변, 높이) 짝꿍으로 넓이를 먼저 구해 보세요. 넓이는 어느 짝꿍으로 구해도 같아요!"}, {"type": "num", "fig": "<svg viewBox=\"0 0 280 180\" style=\"width:100%;max-width:420px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"74.8,41.1 34.0,138.9 246.0,138.9\" fill=\"#EAF4E4\" stroke=\"none\"/><line x1=\"74.8\" y1=\"41.1\" x2=\"34.0\" y2=\"138.9\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><line x1=\"34.0\" y1=\"138.9\" x2=\"246.0\" y2=\"138.9\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><line x1=\"246.0\" y1=\"138.9\" x2=\"74.8\" y2=\"41.1\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><line x1=\"74.8\" y1=\"41.1\" x2=\"74.8\" y2=\"138.9\" stroke=\"#222\" stroke-width=\"1.5\" stroke-dasharray=\"6 4\"/><polyline points=\"83.8,138.9 83.8,129.9 74.8,129.9\" fill=\"none\" stroke=\"#222\" stroke-width=\"1.3\"/><line x1=\"246.0\" y1=\"138.9\" x2=\"65.4\" y2=\"63.7\" stroke=\"#222\" stroke-width=\"1.5\" stroke-dasharray=\"6 4\"/><polyline points=\"61.9,72.0 70.2,75.4 73.7,67.1\" fill=\"none\" stroke=\"#222\" stroke-width=\"1.3\"/><text x=\"66.4\" y=\"33.6\" font-size=\"15\" text-anchor=\"middle\" fill=\"#222\">ㄱ</text><text x=\"20.0\" y=\"149.3\" font-size=\"15\" text-anchor=\"middle\" fill=\"#222\">ㄴ</text><text x=\"260.5\" y=\"147.6\" font-size=\"15\" text-anchor=\"middle\" fill=\"#222\">ㄷ</text><text x=\"74.8\" y=\"158.9\" font-size=\"15\" text-anchor=\"middle\" fill=\"#222\">ㄹ</text><text x=\"51.5\" y=\"62.9\" font-size=\"15\" text-anchor=\"middle\" fill=\"#222\">ㅁ</text><text x=\"33.5\" y=\"103.5\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\">13 cm</text><text x=\"161.2\" y=\"159.9\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1971C2\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\">□ cm</text><text x=\"90.8\" y=\"104.8\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\">12 cm</text><text x=\"170.9\" y=\"95.3\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\">24 cm</text></svg>", "q": "<span class='or'>도전!</span> 선분 <b>ㄴㄷ</b>의 길이는 몇 cm일까요?", "answer": 26, "unit": "cm", "explain": "밑변 ㄴㄱ(13) ↔ 높이 ㄷㅁ(24): 13 × 24 ÷ 2 = 156<br>밑변 ㄴㄷ ↔ 높이 ㄱㄹ(12): □ × 12 ÷ 2 = 156 → □ = <b>26</b>", "hint": "길이를 둘 다 아는 (밑변, 높이) 짝꿍으로 넓이를 먼저 구해 보세요. 넓이는 어느 짝꿍으로 구해도 같아요!"}, {"type": "num", "fig": "", "q": "어떤 삼각형에서 18 cm인 변을 밑변으로 하면 높이가 10 cm예요. 다른 변 15 cm를 밑변으로 하면 높이는 몇 cm일까요?", "answer": 12, "unit": "cm", "explain": "18 × 10 ÷ 2 = 90, 15 × □ ÷ 2 = 90 → □ = <b>12</b>", "hint": "길이를 둘 다 아는 (밑변, 높이) 짝꿍으로 넓이를 먼저 구해 보세요. 넓이는 어느 짝꿍으로 구해도 같아요!"}, {"type": "num", "fig": "", "q": "삼각형 ㄱㄴㄷ에서 변 ㄴㄷ은 12 cm, ㄱ에서 ㄴㄷ에 수직으로 그은 선분은 8 cm예요. 변 ㄱㄷ이 16 cm일 때, ㄴ에서 변 ㄱㄷ(또는 그 연장선)에 수직으로 그은 선분은 몇 cm일까요?", "answer": 6, "unit": "cm", "explain": "12 × 8 ÷ 2 = 48, 16 × □ ÷ 2 = 48 → □ = <b>6</b>", "hint": "종이에 그림을 그려 보세요. 길이를 둘 다 아는 (밑변, 높이) 짝꿍으로 넓이를 먼저 구해 보세요. 넓이는 어느 짝꿍으로 구해도 같아요!"}]}, {"id": "ox", "title": "개념 확인 O / X", "questions": [{"type": "choice", "fig": "", "q": "삼각형의 높이는 항상 삼각형 안쪽에 그려진다.", "choices": ["O", "X"], "answer": 1, "explain": "둔각삼각형은 높이가 바깥에 있을 수 있어요.", "hint": "개념 보기에서 배운 내용을 다시 떠올려 보세요."}, {"type": "choice", "fig": "", "q": "한 삼각형에서 밑변을 다른 변으로 바꾸면 높이도 바뀐다.", "choices": ["O", "X"], "answer": 0, "explain": "밑변마다 짝꿍 높이가 달라요.", "hint": "개념 보기에서 배운 내용을 다시 떠올려 보세요."}, {"type": "choice", "fig": "", "q": "한 삼각형에서 밑변을 다른 변으로 바꾸면 넓이도 바뀐다.", "choices": ["O", "X"], "answer": 1, "explain": "같은 삼각형이면 넓이는 하나예요!", "hint": "개념 보기에서 배운 내용을 다시 떠올려 보세요."}, {"type": "choice", "fig": "", "q": "높이는 밑변과 마주 보는 꼭짓점에서 밑변(또는 그 연장선)에 수직으로 그은 선분이다.", "choices": ["O", "X"], "answer": 0, "explain": "높이의 뜻 그대로예요.", "hint": "개념 보기에서 배운 내용을 다시 떠올려 보세요."}, {"type": "choice", "fig": "", "q": "높이는 항상 세로(위아래)로 똑바로 서 있는 선이다.", "choices": ["O", "X"], "answer": 1, "explain": "밑변과 직각이면 비스듬해도 높이예요.", "hint": "개념 보기에서 배운 내용을 다시 떠올려 보세요."}, {"type": "choice", "fig": "", "q": "직각삼각형에서는 한 변이 그대로 높이가 될 수 있다.", "choices": ["O", "X"], "answer": 0, "explain": "직각을 끼고 있는 두 변은 서로의 높이예요.", "hint": "개념 보기에서 배운 내용을 다시 떠올려 보세요."}]}]}, {"id": "quad", "emoji": "🟩", "title": "사각형의 넓이", "desc": "직사각형 · 평행사변형 · 마름모 · 사다리꼴", "concepts": [{"title": "넓이의 단위", "html": "<div class=\"tip\">한 변이 1 cm인 정사각형의 넓이 = <b>1 cm²</b></div>\n<p>· 1 m² = 100 cm × 100 cm = <b>10000 cm²</b><br>· 1 km² = 1000 m × 1000 m = <b>1000000 m²</b></p>\n<p class=\"warn\">길이를 먼저 같은 단위로 맞춘 다음 곱해요.<br>예) 가로 300 cm, 세로 2 m → 3 m × 2 m = 6 m²</p>"}, {"title": "직사각형과 정사각형", "html": "<div class=\"fig\"><svg viewBox=\"0 0 260 140\" style=\"width:100%;max-width:390px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"63.3\" y1=\"110.0\" x2=\"63.3\" y2=\"30.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"90.0\" y1=\"110.0\" x2=\"90.0\" y2=\"30.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"116.7\" y1=\"110.0\" x2=\"116.7\" y2=\"30.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"143.3\" y1=\"110.0\" x2=\"143.3\" y2=\"30.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"170.0\" y1=\"110.0\" x2=\"170.0\" y2=\"30.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"196.7\" y1=\"110.0\" x2=\"196.7\" y2=\"30.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"63.3\" y1=\"110.0\" x2=\"196.7\" y2=\"110.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"63.3\" y1=\"83.3\" x2=\"196.7\" y2=\"83.3\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"63.3\" y1=\"56.7\" x2=\"196.7\" y2=\"56.7\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"63.3\" y1=\"30.0\" x2=\"196.7\" y2=\"30.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><polygon points=\"63.3,110.0 196.7,110.0 196.7,30.0 63.3,30.0\" fill=\"none\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><text x=\"130.0\" y=\"130.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\">가로 5 cm</text><text x=\"29.3\" y=\"75.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\">세로 3 cm</text></svg></div>\n<p>1 cm²가 가로로 5개씩 3줄 → 5 × 3 = 15 (cm²)</p>\n<div class=\"tip\">(직사각형의 넓이) = (가로) × (세로)<br>(정사각형의 넓이) = (한 변) × (한 변)</div>"}, {"title": "평행사변형", "html": "<div class=\"figrow\"><div class=\"fig\"><svg viewBox=\"0 0 200 135\" style=\"width:100%;max-width:300px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"30.0,99.3 131.8,99.3 170.0,35.7 68.2,35.7\" fill=\"#EAF4E4\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"30.0,99.3 68.2,99.3 68.2,35.7\" fill=\"#B7D9A8\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><line x1=\"68.2\" y1=\"35.7\" x2=\"68.2\" y2=\"99.3\" stroke=\"#1971C2\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><polyline points=\"68.2,91.3 76.2,91.3 76.2,99.3\" fill=\"none\" stroke=\"#1971C2\" stroke-width=\"1.3\"/><line x1=\"30.0\" y1=\"99.3\" x2=\"131.8\" y2=\"99.3\" stroke=\"#E8590C\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"80.9\" y=\"119.3\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#E8590C\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\">밑변</text><text x=\"88.2\" y=\"72.5\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1971C2\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\">높이</text></svg><p class=\"cap\">초록 삼각형을 잘라서</p></div>\n<div class=\"fig\"><svg viewBox=\"0 0 200 135\" style=\"width:100%;max-width:300px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"40.0,105.0 160.0,105.0 160.0,30.0 40.0,30.0\" fill=\"#EAF4E4\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"115.0,105.0 160.0,105.0 160.0,30.0\" fill=\"#B7D9A8\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><line x1=\"40.0\" y1=\"105.0\" x2=\"160.0\" y2=\"105.0\" stroke=\"#E8590C\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"100.0\" y=\"125.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#E8590C\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\">밑변</text><line x1=\"40.0\" y1=\"105.0\" x2=\"40.0\" y2=\"30.0\" stroke=\"#1971C2\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><text x=\"60.0\" y=\"72.5\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1971C2\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\">높이</text></svg><p class=\"cap\">옮기면 직사각형!</p></div></div>\n<div class=\"tip\">(평행사변형의 넓이) = (<span class=\"or\">밑변</span>) × (<span class=\"bl\">높이</span>)</div>\n<p>높이는 두 밑변 사이의 거리(밑변과 수직인 선분)예요.</p>"}, {"title": "옆변은 높이가 아니에요", "html": "<div class=\"fig\"><svg viewBox=\"0 0 210 125\" style=\"width:100%;max-width:315px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"30.0,89.3 137.1,89.3 180.0,35.7 72.9,35.7\" fill=\"#EAF4E4\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><line x1=\"72.9\" y1=\"35.7\" x2=\"72.9\" y2=\"89.3\" stroke=\"#1971C2\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><line x1=\"105.0\" y1=\"35.7\" x2=\"105.0\" y2=\"89.3\" stroke=\"#1971C2\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><line x1=\"137.1\" y1=\"35.7\" x2=\"137.1\" y2=\"89.3\" stroke=\"#1971C2\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><polyline points=\"72.9,81.3 80.9,81.3 80.9,89.3\" fill=\"none\" stroke=\"#222\" stroke-width=\"1.3\"/><polyline points=\"105.0,81.3 113.0,81.3 113.0,89.3\" fill=\"none\" stroke=\"#222\" stroke-width=\"1.3\"/><polyline points=\"137.1,81.3 129.1,81.3 129.1,89.3\" fill=\"none\" stroke=\"#222\" stroke-width=\"1.3\"/><line x1=\"137.1\" y1=\"89.3\" x2=\"180.0\" y2=\"35.7\" stroke=\"#c92a2a\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg></div>\n<p>점선은 모두 길이가 같은 <span class=\"bl\">높이</span>예요. 높이는 어디에 그려도 같아요.</p>\n<p class=\"warn\">빨간 옆변은 높이보다 길어요. 옆변을 곱하면 틀려요!</p>"}, {"title": "평행사변형도 짝꿍이 2쌍", "html": "<div class=\"figrow\"><div class=\"fig\"><svg viewBox=\"0 0 200 130\" style=\"width:100%;max-width:300px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"30.0,96.1 123.3,96.1 170.0,33.9 76.7,33.9\" fill=\"#EAF4E4\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><line x1=\"30.0\" y1=\"96.1\" x2=\"123.3\" y2=\"96.1\" stroke=\"#E8590C\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"76.7\" y1=\"33.9\" x2=\"76.7\" y2=\"96.1\" stroke=\"#1971C2\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><polyline points=\"76.7,88.1 68.7,88.1 68.7,96.1\" fill=\"none\" stroke=\"#1971C2\" stroke-width=\"1.3\"/></svg><p class=\"cap\"><span class=\"or\">아래 변</span> ↔ <span class=\"bl\">높이</span></p></div>\n<div class=\"fig\"><svg viewBox=\"0 0 200 130\" style=\"width:100%;max-width:300px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"30.0,96.1 123.3,96.1 170.0,33.9 76.7,33.9\" fill=\"#EAF4E4\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><line x1=\"123.3\" y1=\"96.1\" x2=\"170.0\" y2=\"33.9\" stroke=\"#E8590C\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"76.7\" y1=\"33.9\" x2=\"136.4\" y2=\"78.7\" stroke=\"#1971C2\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><polyline points=\"130.0,73.9 125.2,80.3 131.6,85.1\" fill=\"none\" stroke=\"#1971C2\" stroke-width=\"1.3\"/></svg><p class=\"cap\"><span class=\"or\">옆 변</span> ↔ <span class=\"bl\">높이</span></p></div></div>\n<p>삼각형과 똑같아요! 어느 짝꿍으로 계산해도 <b>넓이는 같아요.</b></p>"}, {"title": "마름모", "html": "<div class=\"fig\"><svg viewBox=\"0 0 230 150\" style=\"width:100%;max-width:345px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"55.0,120.0 175.0,120.0 175.0,30.0 55.0,30.0\" fill=\"none\" stroke=\"#888\" stroke-width=\"1.2\" stroke-linejoin=\"round\"/><polygon points=\"115.0,120.0 175.0,75.0 115.0,30.0 55.0,75.0\" fill=\"#EAF4E4\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><line x1=\"55.0\" y1=\"75.0\" x2=\"175.0\" y2=\"75.0\" stroke=\"#E8590C\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><line x1=\"115.0\" y1=\"120.0\" x2=\"115.0\" y2=\"30.0\" stroke=\"#1971C2\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><text x=\"77.5\" y=\"68.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#E8590C\" font-weight=\"800\">대각선 ①</text><text x=\"149.0\" y=\"44.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#1971C2\" font-weight=\"800\">대각선 ②</text></svg></div>\n<p>마름모는 둘러싼 직사각형의 <b>절반</b>이에요.</p>\n<div class=\"tip\">(마름모의 넓이) = (한 대각선) × (다른 대각선) ÷ 2</div>"}, {"title": "사다리꼴", "html": "<div class=\"figrow\"><div class=\"fig\"><svg viewBox=\"0 0 200 135\" style=\"width:100%;max-width:300px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"30.0,102.5 170.0,102.5 135.0,32.5 65.0,32.5\" fill=\"#EAF4E4\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><line x1=\"65.0\" y1=\"32.5\" x2=\"135.0\" y2=\"32.5\" stroke=\"#E8590C\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"30.0\" y1=\"102.5\" x2=\"170.0\" y2=\"102.5\" stroke=\"#7048E8\" stroke-width=\"4\" stroke-linecap=\" 0.0\" y=\"135.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#E8590C\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\">밑변 4 cm</text><text x=\"250.0\" y=\"135.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#E8590C\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\">밑변 8 cm (2배)</text><text x=\"90.0\" y=\"96.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"800\">가</text><text x=\"222.0\" y=\"96.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"800\">①</text><text x=\"274.0\" y=\"96.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"800\">②</text></svg></div>\n<p><b>높이가 같을 때</b> 밑변이 2배, 3배가 되면 넓이도 2배, 3배가 돼요.</p>\n<p>밑변 8 cm 삼각형을 가운데에서 나누면 <b>가</b>와 똑같은 넓이의 삼각형 ①, ②가 생겨요 → 가의 2배!</p>"}, {"title": "높이가 2배일 때도", "html": "<div class=\"fig\"><svg viewBox=\"0 0 560 135\" style=\"width:100%;max-width:840px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"9.4\" y1=\"129.0\" x2=\"9.4\" y2=\"6.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"34.0\" y1=\"129.0\" x2=\"34.0\" y2=\"6.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"58.6\" y1=\"129.0\" x2=\"58.6\" y2=\"6.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"83.2\" y1=\"129.0\" x2=\"83.2\" y2=\"6.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"107.8\" y1=\"129.0\" x2=\"107.8\" y2=\"6.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"132.4\" y1=\"129.0\" x2=\"132.4\" y2=\"6.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"157.0\" y1=\"129.0\" x2=\"157.0\" y2=\"6.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"181.6\" y1=\"129.0\" x2=\"181.6\" y2=\"6.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"206.2\" y1=\"129.0\" x2=\"206.2\" y2=\"6.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"230.8\" y1=\"129.0\" x2=\"230.8\" y2=\"6.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"255.4\" y1=\"129.0\" x2=\"255.4\" y2=\"6.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"280.0\" y1=\"129.0\" x2=\"280.0\" y2=\"6.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"304.6\" y1=\"129.0\" x2=\"304.6\" y2=\"6.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"329.2\" y1=\"129.0\" x2=\"329.2\" y2=\"6.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"353.8\" y1=\"129.0\" x2=\"353.8\" y2=\"6.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"378.4\" y1=\"129.0\" x2=\"378.4\" y2=\"6.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"403.0\" y1=\"129.0\" x2=\"403.0\" y2=\"6.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"427.6\" y1=\"129.0\" x2=\"427.6\" y2=\"6.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"452.2\" y1=\"129.0\" x2=\"452.2\" y2=\"6.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"476.8\" y1=\"129.0\" x2=\"476.8\" y2=\"6.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"501.4\" y1=\"129.0\" x2=\"501.4\" y2=\"6.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"526.0\" y1=\"129.0\" x2=\"526.0\" y2=\"6.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"550.6\" y1=\"129.0\" x2=\"550.6\" y2=\"6.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"9.4\" y1=\"129.0\" x2=\"550.6\" y2=\"129.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"9.4\" y1=\"104.4\" x2=\"550.6\" y2=\"104.4\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"9.4\" y1=\"79.8\" x2=\"550.6\" y2=\"79.8\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"9.4\" y1=\"55.2\" x2=\"550.6\" y2=\"55.2\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"9.4\" y1=\"30.6\" x2=\"550.6\" y2=\"30.6\" stroke=\"#ccc\" stroke-width=\"0.8\"/><line x1=\"9.4\" y1=\"6.0\" x2=\"550.6\" y2=\"6.0\" stroke=\"#ccc\" stroke-width=\"0.8\"/><polygon points=\"34.0,104.4 107.8,104.4 58.6,55.2\" fill=\"#EAF4E4\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><text x=\"68.4\" y=\"94.6\" font-size=\"14\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"800\">가</text><polygon points=\"157.0,104.4 304.6,104.4 206.2,55.2\" fill=\"#EAF4E4\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><text x=\"221.0\" y=\"94.6\" font-size=\"14\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"800\">나</text><polygon points=\"353.8,104.4 501.4,104.4 403.0,6.0\" fill=\"#EAF4E4\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><text x=\"420.2\" y=\"79.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"800\">다</text></svg></div>\n<p>가: 3 cm² → 나: 밑변만 2배 → 6 cm² (<b>2배</b>)<br>다: 밑변 2배, 높이 2배 → 12 cm² (<b>2 × 2 = 4배</b>)</p>\n<p class=\"warn\">밑변이 2배여도 높이가 다르면 넓이가 2배라고 할 수 없어요! \"높이가 같은가?\"를 먼저 확인해요.</p>"}, {"title": "높이가 같은 짝 ① 같은 꼭짓점", "html": "<div class=\"fig\"><svg viewBox=\"0 0 220 150\" style=\"width:100%;max-width:330px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"30.0,115.0 136.7,115.0 70.0,35.0\" fill=\"#B7D9A8\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"136.7,115.0 190.0,115.0 70.0,35.0\" fill=\"#FFD8A8\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><line x1=\"70.0\" y1=\"35.0\" x2=\"70.0\" y2=\"115.0\" stroke=\"#1971C2\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><text x=\"70.0\" y=\"28.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"400\">ㄱ</text><text x=\"20.0\" y=\"126.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"400\">ㄴ</text><text x=\"136.7\" y=\"134.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"400\">ㄹ</text><text x=\"200.0\" y=\"126.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"400\">ㄷ</text><text x=\"78.0\" y=\"135.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\">8 cm</text><text x=\"168.7\" y=\"135.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\">4 cm</text></svg></div>\n<p>꼭짓점 ㄱ을 <b>함께 쓰고</b> 밑변이 한 직선 위에 있으면 높이가 같아요(파란 점선 하나).</p>\n<p>밑변 8 cm는 4 cm의 2배 → <b>초록 = 분홍의 2배</b></p>"}, {"title": "높이가 같은 짝 ② 평행선 사이", "html": "<div class=\"fig\"><svg viewBox=\"0 0 240 130\" style=\"width:100%;max-width:360px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"30.0\" y1=\"40.0\" x2=\"210.0\" y2=\"40.0\" stroke=\"#888\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"30.0\" y1=\"90.0\" x2=\"210.0\" y2=\"90.0\" stroke=\"#888\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><polygon points=\"50.0,90.0 90.0,90.0 40.0,40.0\" fill=\"#EAF4E4\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"100.0,90.0 140.0,90.0 120.0,40.0\" fill=\"#EAF4E4\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"150.0,90.0 190.0,90.0 200.0,40.0\" fill=\"#EAF4E4\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><text x=\"60.0\" y=\"81.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"800\">①</text><text x=\"120.0\" y=\"81.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"800\">②</text><text x=\"176.0\" y=\"81.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"800\">③</text><text x=\"196.0\" y=\"33.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#888\" font-weight=\"400\">평행</text></svg></div>\n<p><b>평행한 두 직선 사이</b>에 있는 도형은 높이가 모두 같아요(두 직선 사이의 거리).</p>\n<p>밑변이 같으면 ①, ②, ③의 넓이가 같아요.</p>"}, {"title": "높이가 같은 짝 ③ 사다리꼴", "html": "<div class=\"fig\"><svg viewBox=\"0 0 220 140\" style=\"width:100%;max-width:330px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"56.7,36.7 123.3,36.7 190.0,103.3 30.0,103.3\" fill=\"#EAF4E4\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"56.7,36.7 123.3,36.7 190.0,103.3\" fill=\"#FFD8A8\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><line x1=\"56.7\" y1=\"36.7\" x2=\"190.0\"  "answer": 6, "unit": "배", "explain": "2 × 3 = <b>6배</b>", "hint": "2배 하고 또 3배!"}, {"type": "num", "fig": "", "q": "넓이가 36 cm²인 평행사변형의 밑변을 2배로 늘리고 높이를 반으로 줄이면 넓이는?", "answer": 36, "unit": "cm²", "explain": "2배 했다가 반으로 → 그대로 <b>36</b>", "hint": "2배 하고 반으로 나누면?"}]}, {"id": "ox", "title": "개념 확인 O / X", "questions": [{"type": "choice", "fig": "", "q": "높이가 같은 두 삼각형에서 밑변이 2배이면 넓이도 2배이다.", "choices": ["O", "X"], "answer": 0, "explain": "높이가 같을 때만 성립해요.", "hint": "개념 보기에서 배운 내용을 다시 떠올려 보세요."}, {"type": "choice", "fig": "", "q": "밑변이 2배인 삼각형은 높이와 상관없이 항상 넓이가 2배이다.", "choices": ["O", "X"], "answer": 1, "explain": "높이가 같아야 해요!", "hint": "개념 보기에서 배운 내용을 다시 떠올려 보세요."}, {"type": "choice", "fig": "", "q": "밑변과 높이가 모두 2배가 되면 넓이는 4배가 된다.", "choices": ["O", "X"], "answer": 0, "explain": "2 × 2 = 4배예요.", "hint": "개념 보기에서 배운 내용을 다시 떠올려 보세요."}, {"type": "choice", "fig": "", "q": "평행한 두 직선 사이에 있고 밑변이 같은 삼각형들은 모양이 달라도 넓이가 같다.", "choices": ["O", "X"], "answer": 0, "explain": "높이가 두 직선 사이의 거리로 같아요.", "hint": "개념 보기에서 배운 내용을 다시 떠올려 보세요."}, {"type": "choice", "fig": "", "q": "꼭짓점을 함께 쓰고 밑변이 한 직선 위에 있는 두 삼각형은 높이가 같다.", "choices": ["O", "X"], "answer": 0, "explain": "같은 꼭짓점에서 같은 직선까지의 거리예요.", "hint": "개념 보기에서 배운 내용을 다시 떠올려 보세요."}]}]}]};
    const app = document.getElementById("app");

    // 단원별 최고 점수를 이 기기에만 저장해요. 저장이 막혀 있어도 앱은 그대로 동작해요.
    function loadBest() { try { return JSON.parse(localStorage.getItem("area5-best") || "{}"); } catch (e) { return {}; } }
    function saveBest(key, score) {
      try {
        const best = loadBest();
        if (!(key in best) || score > best[key]) { best[key] = score; localStorage.setItem("area5-best", JSON.stringify(best)); }
      } catch (e) {}
    }
    function stars(ratio) {
      const n = ratio >= 1 ? 3 : ratio >= 0.8 ? 2 : ratio >= 0.5 ? 1 : 0;
      return "★".repeat(n) + "☆".repeat(3 - n);
    }
    function el(html) { app.innerHTML = html; window.scrollTo(0, 0); }

    // ---------- 첫 화면 ----------
    function home() {
      const best = loadBest();
      let html = `<h1>📐 넓이 퀴즈</h1><p class="sub">5학년 1학기 6단원 · 다각형의 둘레와 넓이</p>`;
      html += installHtml();
      DATA.units.forEach((u, i) => {
        const done = u.sections.filter(s => (u.id + "/" + s.id) in best).length;
        html += `<button class="unit" onclick="unit(${i})"><span class="emo">${u.emoji}</span>
          <span><b>${u.title}</b><small>${u.desc}</small><br><small>${done} / ${u.sections.length} 단계 해 봤어요</small></span></button>`;
      });
      html += `<p class="footer">기록은 이 기기에만 저장돼요.</p>`;
      el(html);
    }

    // ---------- 단원 화면 ----------
    function unit(ui) {
      const u = DATA.units[ui], best = loadBest();
      let html = `<div class="topbar"><button class="back" onclick="home()">← 처음</button><span class="t">${u.emoji} ${u.title}</span></div>
        <button class="btn ghost" onclick="concept(${ui},0)">📖 개념 먼저 보기</button><div style="height:12px"></div>`;
      u.sections.forEach((s, si) => {
        const key = u.id + "/" + s.id, n = s.questions.length;
        const rec = key in best ? `<span class="stars">${stars(best[key] / n)}</span> <span class="n">${best[key]}/${n}</span>` : `<span class="n">${n}문제</span>`;
        html += `<button class="section" onclick="startQuiz(${ui},${si})"><span><b>${si + 1}. ${s.title}</b></span><span>${rec}</span></button>`;
      });
      el(html);
    }

    // ---------- 개념 카드 ----------
    function concept(ui, ci) {
      const u = DATA.units[ui], c = u.concepts[ci], last = ci === u.concepts.length - 1;
      const dots = u.concepts.map((_, i) => `<span class="${i === ci ? "on" : ""}"></span>`).join("");
      el(`<div class="topbar"><button class="back" onclick="unit(${ui})">← 단원</button><span class="t">📖 개념 ${ci + 1} / ${u.concepts.length}</span></div>
        <div class="card"><h2 style="margin:0 0 6px;font-size:1.2em">${c.title}</h2>${c.html}</div>
        <div class="dots">${dots}</div>
        <div class="row2">
          <button class="btn ghost" ${ci === 0 ? "disabled style='opacity:.4'" : ""} onclick="concept(${ui},${ci - 1})">← 이전</button>
          ${last ? `<button class="btn primary" onclick="startQuiz(${ui},0)">문제 풀러 가기 →</button>`
                 : `<button class="btn primary" onclick="concept(${ui},${ci + 1})">다음 →</button>`}
        </div>`);
    }

    // ---------- 문제 풀기 ----------
    let S = null; // 지금 풀고 있는 퀴즈 상태
    function startQuiz(ui, si, onlyIdx) {
      const qs = DATA.units[ui].sections[si].questions;
      const order = onlyIdx || qs.map((_, i) => i);
      S = { ui, si, order, pos: 0, score: 0, wrongs: [], tries: 0, sel: null, retry: !!onlyIdx };
      showQ();
    }
    function curQ() { return DATA.units[S.ui].sections[S.si].questions[S.order[S.pos]]; }

    function showQ() {
      const q = curQ(), s = DATA.units[S.ui].sections[S.si];
      S.tries = 0; S.sel = null; S.locked = false;
      const pct = Math.round(S.pos / S.order.length * 100);
      let input;
      if (q.type === "num") {
        input = `<div class="answer"><input id="ans" type="text" inputmode="decimal" autocomplete="off" placeholder="답 입력"
                  onkeydown="if(event.key==='Enter')check()"><span class="unitlabel">${q.unit}</span></div>`;
      } else {
        input = `<div class="choices">${q.choices.map((c, i) => `<button class="choice" id="c${i}" onclick="pick(${i})">${c}</button>`).join("")}</div>`;
      }
      el(`<div class="topbar"><button class="back" onclick="unit(${S.ui})">← 그만</button><span class="t">${s.title}</span><span>${S.pos + 1} / ${S.order.length}</span></div>
        <div class="progress"><div style="width:${pct}%"></div></div>
        <div class="card">${q.fig ? `<div class="fig">${q.fig}</div>` : ""}<div class="qtext">${q.q}</div>${input}
          <div id="fb"></div>
          <button class="btn primary" id="go" onclick="check()">확인</button></div>`);
      const a = document.getElementById("ans"); if (a) a.focus({ preventScroll: true });
    }

    function pick(i) {
      if (S.locked) return;
      S.sel = i;
      document.querySelectorAll(".choice").forEach((b, j) => b.classList.toggle("sel", j === i));
    }

    function check() {
      const q = curQ(), fb = document.getElementById("fb"), go = document.getElementById("go");
      let ok;
      if (q.type === "num") {
        const raw = document.getElementById("ans").value.replace(/[,\s]/g, "");
        if (raw === "") { fb.innerHTML = `<div class="feedback hint">답을 입력해 주세요.</div>`; return; }
        ok = Number(raw) === q.answer;
      } else {
        if (S.sel === null) { fb.innerHTML = `<div class="feedback hint">보기를 하나 골라 주세요.</div>`; return; }
        ok = S.sel === q.answer;
      }
      S.tries++;
      if (ok) {
        if (S.tries === 1) S.score++;
        finishQ(true);
      } else if (S.tries === 1) {
        // 처음 틀리면 힌트를 보여 주고 한 번 더 기회를 줘요.
        fb.innerHTML = `<div class="feedback hint"><b class="h">🤔 다시 생각해 볼까요?</b>${q.hint}</div>`;
        if (q.type === "choice") document.getElementById("c" + S.sel).classList.add("bad");
        else { const a = document.getElementById("ans"); a.select(); }
      } else {
        S.wrongs.push(S.order[S.pos]);
        finishQ(false);
      }
    }

    function finishQ(ok) {
      const q = curQ(), fb = document.getElementById("fb"), go = document.getElementById("go");
      S.locked = true;
      if (q.type === "choice") {
        document.querySelectorAll(".choice").forEach(b => b.disabled = true);
        document.getElementById("c" + q.answer).classList.add("right");
      } else document.getElementById("ans").disabled = true;
      const ansText = q.type === "num" ? `${q.answer.toLocaleString()} ${q.unit}` : q.choices[q.answer];
      fb.innerHTML = ok
        ? `<div class="feedback ok"><b class="h">⭕ 정답이에요! ${S.tries > 1 ? "(힌트를 보고 맞혔어요)" : ""}</b>${q.explain}</div>`
        : `<div class="feedback no"><b class="h">정답은 ${ansText}</b>${q.explain}</div>`;
      const last = S.pos === S.order.length - 1;
      go.textContent = last ? "결과 보기" : "다음 문제 →";
      go.onclick = () => { S.locked = false; if (last) result(); else { S.pos++; showQ(); } };
      go.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    // ---------- 결과 ----------
    function result() {
      const u = DATA.units[S.ui], s = u.sections[S.si], n = S.order.length;
      if (!S.retry) saveBest(u.id + "/" + s.id, S.score);
      const ratio = S.score / n;
      const msg = ratio === 1 ? "완벽해요! 🎉" : ratio >= 0.8 ? "아주 잘했어요! 👍" : ratio >= 0.5 ? "좋아요, 틀린 문제를 다시 풀어 봐요! 💪" : "개념을 다시 보고 도전해 봐요! 📖";
      const qs = s.questions;
      const review = S.wrongs.map(i => {
        const q = qs[i], a = q.type === "num" ? `${q.answer.toLocaleString()} ${q.unit}` : q.choices[q.answer];
        return `<div class="review">❌ ${q.q.replace(/<[^>]+>/g, "")}<br><b>정답: ${a}</b></div>`;
      }).join("");
      el(`<div class="topbar"><button class="back" onclick="unit(${S.ui})">← 단원</button><span class="t">${s.title}</span></div>
        <div class="card center"><div class="stars" style="font-size:2em">${stars(ratio)}</div>
          <div class="big-score">${S.score} / ${n}</div><p>${msg}</p>
          <p class="sub">힌트 없이 한 번에 맞힌 문제만 점수에 들어가요.</p></div>
        ${S.wrongs.length ? `<button class="btn primary" onclick="startQuiz(${S.ui},${S.si},[${S.wrongs.join(",")}])">틀린 문제 다시 풀기 (${S.wrongs.length})</button>` : ""}
        ${S.si + 1 < u.sections.length ? `<button class="btn ${S.wrongs.length ? "ghost" : "primary"}" onclick="startQuiz(${S.ui},${S.si + 1})">다음 단계: ${u.sections[S.si + 1].title} →</button>` : ""}
        <button class="btn ghost" onclick="unit(${S.ui})">단원 화면으로</button>
        ${review ? `<div class="card" style="margin-top:14px"><b>틀린 문제 정리</b>${review}</div>` : ""}`);
    }

    // ---------- 홈 화면에 설치하기 ----------
    // 안드로이드·PC 크롬: 브라우저가 설치 가능하다고 알려 줄 때만 버튼을 보여 주고, 누르면 설치 창을 띄워요.
    // 아이폰·아이패드: 자동 설치 창이 없어서, 누르면 "공유 → 홈 화면에 추가" 순서를 안내해요.
    // 이미 앱으로 열었거나 설치된 기기에서는 버튼을 숨겨요.
    let installEvent = null, showGuide = false;
    const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
    const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const onHome = () => !!document.querySelector("h1");

    function installHtml() {
      if (isStandalone()) return "";
      if (showGuide) {
        return `<div class="guide"><button class="close" onclick="closeGuide()" aria-label="닫기">✕</button>
          <b>📲 아이폰·아이패드에 설치하기</b>
          <ol><li><b>사파리</b>에서 이 페이지를 열어요.</li>
            <li>화면 아래(아이패드는 위)의 <b>공유 버튼</b> <span style="white-space:nowrap">(□↑)</span>을 눌러요.</li>
            <li>목록을 내려 <b>홈 화면에 추가</b>를 누르고, 오른쪽 위 <b>추가</b>를 눌러요.</li></ol>
          <small style="color:var(--muted)">홈 화면에 생긴 넓이 퀴즈 아이콘으로 열면 앱처럼 전체 화면으로 열려요.</small></div>`;
      }
      if (installEvent || isIOS()) return `<button class="install" onclick="installApp()">📲 홈 화면에 설치하기</button>`;
      return "";
    }
    async function installApp() {
      if (installEvent) {
        const ev = installEvent;
        installEvent = null;
        ev.prompt();
        try { await ev.userChoice; } catch (e) {}
        if (onHome()) home();
      } else if (isIOS()) {
        showGuide = true;
        home();
      }
    }
    function closeGuide() { showGuide = false; home(); }
    function toast(msg) {
      const t = document.createElement("div");
      t.className = "toast"; t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      installEvent = e;
      if (onHome()) home();
    });
    window.addEventListener("appinstalled", () => {
      installEvent = null;
      if (onHome()) home();
      toast("홈 화면에 설치했어요! 🎉");
    });

    home();
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
