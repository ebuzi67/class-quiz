<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>분수 퀴즈 - 4학년</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffb347">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="분수 퀴즈">
  <style>
    :root {
      --bg: #fff8e7;
      --card: #ffffff;
      --text: #2b2b2b;
      --muted: #6b6b6b;
      --primary: #4a7cf7;
      --primary-dark: #3360d1;
      --correct: #2e9d5b;
      --correct-bg: #e3f6ea;
      --wrong: #d9443b;
      --wrong-bg: #fde6e4;
      --border: #e2ddd0;
      --easy: #2fa36b;
      --normal: #e98a00;
      --hard: #d9443b;
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      font-size: 24px;
      line-height: 1.5;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }

    .app {
      width: 100%;
      max-width: 760px;
    }

    h1 {
      text-align: center;
      font-size: 2em;
      margin: 0 0 16px;
    }

    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
    }

    [hidden] { display: none !important; }

    /* 처음 화면: 난이도 고르기 */
    .intro {
      text-align: center;
      font-size: 1.15em;
      margin: 0 0 24px;
    }

    .levels {
      display: grid;
      gap: 18px;
    }

    .level-btn {
      display: flex;
      align-items: center;
      gap: 20px;
      width: 100%;
      min-height: 120px;
      padding: 18px 24px;
      font: inherit;
      color: var(--text);
      text-align: left;
      background: #fff;
      border: 4px solid var(--level-color);
      border-radius: 22px;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .level-btn:hover { background: var(--level-soft); }
    .level-btn:active { transform: scale(0.98); }

    .level-btn .icon { font-size: 2.4em; line-height: 1; }
    .level-btn .name {
      display: block;
      font-size: 1.4em;
      font-weight: bold;
      color: var(--level-color);
    }
    .level-btn .desc { display: block; font-size: 0.85em; color: var(--muted); }
    .level-btn .best {
      margin-left: auto;
      flex: 0 0 auto;
      font-size: 0.8em;
      font-weight: bold;
      color: var(--level-color);
      text-align: center;
    }

    .easy   { --level-color: var(--easy);   --level-soft: #e6f6ee; }
    .normal { --level-color: var(--normal); --level-soft: #fff1dc; }
    .hard   { --level-color: var(--hard);   --level-soft: #fde6e4; }

    /* 문제 화면 윗부분 */
    .quiz-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .badge {
      display: inline-block;
      padding: 6px 18px;
      border-radius: 999px;
      font-weight: bold;
      color: #fff;
      background: var(--level-color);
    }

    .home-link {
      min-height: 52px;
      padding: 8px 18px;
      font: inherit;
      font-size: 0.85em;
      color: var(--muted);
      background: #f3efe4;
      border: none;
      border-radius: 14px;
      cursor: pointer;
    }
    .home-link:hover { background: #e9e3d4; }

    .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 0.9em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .progress-bar {
      height: 16px;
      background: #eee8da;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 28px;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      background: var(--level-color, var(--primary));
      transition: width 0.3s ease;
    }

    .question {
      font-size: 1.3em;
      font-weight: bold;
      margin: 0 0 28px;
      line-height: 1.8;
    }

    /* 보기 */
    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .choice {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 96px;
      padding: 14px 20px;
      font: inherit;
      font-size: 1.15em;
      color: var(--text);
      background: #fafafa;
      border: 3px solid var(--border);
      border-radius: 18px;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .choice:not(:disabled):hover {
      border-color: var(--primary);
      background: #f0f4ff;
    }

    .choice:not(:disabled):active { transform: scale(0.97); }

    .choice:disabled { cursor: default; }

    .choice .num {
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      font-size: 0.8em;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .choice.correct {
      border-color: var(--correct);
      background: var(--correct-bg);
    }
    .choice.correct .num { background: var(--correct); }

    .choice.wrong {
      border-color: var(--wrong);
      background: var(--wrong-bg);
    }
    .choice.wrong .num { background: var(--wrong); }

    .choice.dim { opacity: 0.5; }

    /* 분수 모양 */
    .frac {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: middle;
      line-height: 1.1;
      margin: 0 0.12em;
      font-size: 0.95em;
    }
    .frac .top {
      padding: 0 0.2em;
      border-bottom: 3px solid currentColor;
    }
    .frac .bottom { padding: 0 0.2em; }
    .whole {
      vertical-align: middle;
      margin-right: 0.05em;
    }

    /* 풀이 */
    .feedback {
      margin-top: 24px;
      padding: 20px 24px;
      border-radius: 18px;
      display: none;
    }
    .feedback.show { display: block; }
    .feedback.correct { background: var(--correct-bg); border: 3px solid var(--correct); }
    .feedback.wrong { background: var(--wrong-bg); border: 3px solid var(--wrong); }

    .feedback-title {
      font-size: 1.3em;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .feedback.correct .feedback-title { color: var(--correct); }
    .feedback.wrong .feedback-title { color: var(--wrong); }

    .explain { line-height: 2; }

    .btn {
      display: block;
      width: 100%;
      margin-top: 24px;
      min-height: 72px;
      font: inherit;
      font-size: 1.2em;
      font-weight: bold;
      color: #fff;
      background: var(--primary);
      border: none;
      border-radius: 18px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover { background: var(--primary-dark); }
    .btn:active { transform: scale(0.98); }

    /* 결과 화면 */
    .result { text-align: center; }
    .result .badge { margin-bottom: 12px; }
    .result .emoji { font-size: 4em; line-height: 1.2; }
    .result .score {
      font-size: 3em;
      font-weight: bold;
      color: var(--primary);
      margin: 8px 0;
    }
    .result .message { font-size: 1.2em; margin-bottom: 8px; }

    .result-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 24px;
    }
    .result-actions .btn { margin-top: 0; font-size: 1.05em; }
    .btn.next-level { background: var(--correct); }
    .btn.next-level:hover { background: #24804a; }
    .btn.secondary {
      color: var(--text);
      background: #f3efe4;
    }
    .btn.secondary:hover { background: #e9e3d4; }

    /* 종료 화면 */
    .records {
      list-style: none;
      padding: 0;
      margin: 20px 0 0;
      text-align: left;
    }
    .records li {
      display: flex;
      justify-content: space-between;
      padding: 14px 20px;
      margin-bottom: 10px;
      border-radius: 14px;
      background: var(--level-soft);
      font-weight: bold;
    }
    .records li .label { color: var(--level-color); }

    /* 홈 화면에 설치하기 */
    .install-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
      padding: 14px; margin: 0 0 18px; font: inherit; font-weight: bold; cursor: pointer;
      background: #fff; color: var(--primary-dark); border: 2px dashed var(--primary); border-radius: 16px;
    }
    .install-guide {
      background: #fff; border: 2px solid var(--primary); border-radius: 16px;
      padding: 16px 18px; margin: 0 0 18px; font-size: 0.85em; text-align: left;
    }
    .install-guide ol { margin: 8px 0 4px; padding-left: 1.3em; }
    .install-guide li { margin: 6px 0; }
    .install-guide .close {
      float: right; background: none; border: none; font: inherit; font-size: 1.2em;
      color: var(--muted); cursor: pointer; padding: 0 4px;
    }
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      background: var(--primary); color: #fff; padding: 10px 18px; border-radius: 999px;
      font-weight: bold; font-size: 0.8em; box-shadow: 0 4px 12px rgba(0,0,0,.2);
    }

    /* 태블릿 세로 / 작은 화면 */
    @media (max-width: 600px) {
      body { font-size: 20px; padding: 16px 12px; }
      .card { padding: 22px 18px; }
      .choices { grid-template-columns: 1fr; }
      .choice { min-height: 80px; }
      .result-actions { grid-template-columns: 1fr; }
      .level-btn { min-height: 100px; gap: 14px; padding: 14px 18px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>🍕 분수 퀴즈</h1>

    <!-- 처음 화면: 난이도 고르기 -->
    <section class="card" id="home">
      <div id="install-area"></div>
      <p class="intro">난이도를 골라 주세요!<br>단계마다 문제 10개가 무작위로 나와요.</p>
      <div class="levels" id="levels"></div>
    </section>

    <!-- 문제 화면 -->
    <section class="card" id="quiz" hidden>
      <div class="quiz-top">
        <span class="badge" id="level-badge"></span>
        <button class="home-link" id="quit-btn">🏠 처음으로</button>
      </div>
      <div class="progress-text">
        <span id="progress-label"></span>
        <span id="score-label"></span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

      <p class="question" id="question"></p>
      <div class="choices" id="choices"></div>

      <div class="feedback" id="feedback">
        <div class="feedback-title" id="feedback-title"></div>
        <div class="explain" id="explain"></div>
      </div>

      <button class="btn" id="next-btn" hidden>다음 문제 ▶</button>
    </section>

    <!-- 결과 화면 -->
    <section class="card result" id="result" hidden>
      <span class="badge" id="result-badge"></span>
      <div class="emoji" id="result-emoji"></div>
      <p>내 점수는</p>
      <div class="score" id="result-score"></div>
      <p class="message" id="result-message"></p>
      <div class="result-actions">
        <button class="btn" id="retry-btn">🔄 다시하기</button>
        <button class="btn next-level" id="next-level-btn">⬆️ 다음 단계</button>
        <button class="btn secondary" id="home-btn">🏠 처음으로</button>
        <button class="btn secondary" id="end-btn">👋 종료</button>
      </div>
    </section>

    <!-- 종료 화면 -->
    <section class="card result" id="end" hidden>
      <div class="emoji">👏</div>
      <p class="message">오늘도 수고했어요!</p>
      <ul class="records" id="records"></ul>
      <button class="btn" id="restart-btn">🏠 처음으로</button>
    </section>
  </main>

  <script>
    // 분수 표기: {2/7} → 분수, {1 3/4} → 대분수
    // 단계마다 문제 15개 중 10개를 무작위로 골라 내요.
    const LEVELS = [
      {
        key: "easy",
        name: "쉬움",
        icon: "🌱",
        desc: "분수의 뜻, 크기 비교, 간단한 덧셈과 뺄셈",
        questions: [
          {
            q: "{2/7} + {3/7} 은 얼마일까요?",
            choices: ["{5/14}", "{5/7}", "{6/7}", "{1/7}"],
            answer: 1,
            explain: "분모가 같으면 분자끼리 더해요. 2 + 3 = 5 이니까 답은 {5/7} 이에요."
          },
          {
            q: "{5/9} − {2/9} 은 얼마일까요?",
            choices: ["{7/9}", "{3/18}", "{3/9}", "{2/9}"],
            answer: 2,
            explain: "분모가 같으면 분자끼리 빼요. 5 − 2 = 3 이니까 답은 {3/9} 이에요."
          },
          {
            q: "다음 중 진분수는 어느 것일까요?",
            choices: ["{5/5}", "{7/4}", "{9/2}", "{3/5}"],
            answer: 3,
            explain: "진분수는 분자가 분모보다 작은 분수예요. 3 은 5 보다 작으니까 {3/5} 가 진분수예요."
          },
          {
            q: "다음 중 가분수는 어느 것일까요?",
            choices: ["{2/3}", "{5/8}", "{6/5}", "{1/4}"],
            answer: 2,
            explain: "가분수는 분자가 분모와 같거나 분모보다 큰 분수예요. 6 은 5 보다 크니까 {6/5} 가 가분수예요."
          },
          {
            q: "다음 중 대분수는 어느 것일까요?",
            choices: ["{7/3}", "{1 2/5}", "{4/9}", "{6/6}"],
            answer: 1,
            explain: "대분수는 자연수와 진분수로 이루어진 분수예요. {1 2/5} 는 자연수 1 과 진분수 {2/5} 로 되어 있어요."
          },
          {
            q: "다음 중 가장 큰 분수는 어느 것일까요?",
            choices: ["{3/7}", "{6/7}", "{2/7}", "{5/7}"],
            answer: 1,
            explain: "분모가 같으면 분자가 클수록 큰 분수예요. 분자 6 이 가장 크니까 {6/7} 이 가장 커요."
          },
          {
            q: "다음 중 가장 작은 분수는 어느 것일까요?",
            choices: ["{4/9}", "{2/9}", "{7/9}", "{5/9}"],
            answer: 1,
            explain: "분모가 같으면 분자가 작을수록 작은 분수예요. 분자 2 가 가장 작으니까 {2/9} 가 가장 작아요."
          },
          {
            q: "{1/6} + {4/6} 은 얼마일까요?",
            choices: ["{5/12}", "{5/6}", "{4/6}", "{3/6}"],
            answer: 1,
            explain: "분자끼리 더해요. 1 + 4 = 5 이니까 답은 {5/6} 이에요. 분모는 그대로예요."
          },
          {
            q: "{7/10} − {4/10} 은 얼마일까요?",
            choices: ["{3/10}", "{11/10}", "{4/10}", "{3/20}"],
            answer: 0,
            explain: "분자끼리 빼요. 7 − 4 = 3 이니까 답은 {3/10} 이에요."
          },
          {
            q: "{2/5} + {2/5} 은 얼마일까요?",
            choices: ["{4/10}", "{4/5}", "{1/5}", "{3/5}"],
            answer: 1,
            explain: "분자끼리 더해요. 2 + 2 = 4 이니까 답은 {4/5} 예요."
          },
          {
            q: "{8/11} − {3/11} 은 얼마일까요?",
            choices: ["{5/11}", "{11/11}", "{5/22}", "{6/11}"],
            answer: 0,
            explain: "분자끼리 빼요. 8 − 3 = 5 이니까 답은 {5/11} 이에요."
          },
          {
            q: "{1/4} 이 3개이면 얼마일까요?",
            choices: ["{3/4}", "{1/12}", "{4/3}", "{3/12}"],
            answer: 0,
            explain: "{1/4} 이 3개이면 분자가 1 + 1 + 1 = 3 이 되어 {3/4} 이에요."
          },
          {
            q: "{5/5} 는 얼마와 같을까요?",
            choices: ["0", "1", "5", "10"],
            answer: 1,
            explain: "분자와 분모가 같으면 전체 하나와 같아요. 그래서 {5/5} = 1 이에요."
          },
          {
            q: "피자 한 판을 똑같이 8조각으로 나누어 3조각을 먹었어요. 먹은 피자는 전체의 얼마일까요?",
            choices: ["{3/8}", "{5/8}", "{3/5}", "{8/3}"],
            answer: 0,
            explain: "전체 8조각 중 3조각이니까 {3/8} 이에요."
          },
          {
            q: "□ 안에 알맞은 것은 무엇일까요?  {3/6} □ {5/6}",
            choices: ["<", ">", "=", "알 수 없어요"],
            answer: 0,
            explain: "분모가 같으면 분자를 비교해요. 3 은 5 보다 작으니까 {3/6} < {5/6} 이에요."
          }
        ]
      },
      {
        key: "normal",
        name: "보통",
        icon: "🌿",
        desc: "가분수와 대분수 바꾸기, 1보다 큰 덧셈, 대분수 계산",
        questions: [
          {
            q: "가분수 {7/4} 를 대분수로 나타내면 무엇일까요?",
            choices: ["{1 3/4}", "{1 4/7}", "{3 1/4}", "{2 1/4}"],
            answer: 0,
            explain: "7 ÷ 4 = 1 … 3 이에요. 자연수 부분은 1, 남은 것은 {3/4} 이니까 {1 3/4} 예요."
          },
          {
            q: "가분수 {11/5} 를 대분수로 나타내면 무엇일까요?",
            choices: ["{2 1/5}", "{1 1/5}", "{2 1/11}", "{5 1/2}"],
            answer: 0,
            explain: "11 ÷ 5 = 2 … 1 이에요. 그래서 {11/5} = {2 1/5} 예요."
          },
          {
            q: "대분수 {2 1/3} 을 가분수로 나타내면 무엇일까요?",
            choices: ["{6/3}", "{5/3}", "{7/3}", "{3/7}"],
            answer: 2,
            explain: "2 는 {6/3} 이에요. {6/3} 과 {1/3} 을 더하면 {7/3} 이 돼요."
          },
          {
            q: "대분수 {3 2/7} 을 가분수로 나타내면 무엇일까요?",
            choices: ["{23/7}", "{17/7}", "{6/7}", "{21/7}"],
            answer: 0,
            explain: "3 은 {21/7} 이에요. {21/7} 과 {2/7} 을 더하면 {23/7} 이 돼요."
          },
          {
            q: "{3/8} + {6/8} 은 얼마일까요?",
            choices: ["{9/16}", "{1 2/8}", "{1 1/8}", "{3/8}"],
            answer: 2,
            explain: "3 + 6 = 9 이니까 {9/8} 이에요. {8/8} 은 1 이므로 {9/8} = {1 1/8} 이에요."
          },
          {
            q: "{5/7} + {4/7} 은 얼마일까요?",
            choices: ["{1 2/7}", "{9/14}", "{1 4/7}", "{2/7}"],
            answer: 0,
            explain: "5 + 4 = 9 이니까 {9/7} 이에요. {7/7} 은 1 이므로 {9/7} = {1 2/7} 이에요."
          },
          {
            q: "1 − {2/5} 는 얼마일까요?",
            choices: ["{1/5}", "{3/5}", "{2/5}", "{4/5}"],
            answer: 1,
            explain: "1 을 {5/5} 로 바꿔요. {5/5} − {2/5} = {3/5} 이에요."
          },
          {
            q: "1 − {3/8} 은 얼마일까요?",
            choices: ["{5/8}", "{3/8}", "{2/8}", "{4/8}"],
            answer: 0,
            explain: "1 을 {8/8} 로 바꿔요. {8/8} − {3/8} = {5/8} 이에요."
          },
          {
            q: "{1 2/9} + {2 5/9} 는 얼마일까요?",
            choices: ["{3 7/9}", "{3 7/18}", "{2 7/9}", "{4 7/9}"],
            answer: 0,
            explain: "자연수끼리 1 + 2 = 3, 분수끼리 {2/9} + {5/9} = {7/9} 이니까 {3 7/9} 예요."
          },
          {
            q: "{2 3/5} + {1 1/5} 은 얼마일까요?",
            choices: ["{3 4/5}", "{3 4/10}", "{2 4/5}", "{4 4/5}"],
            answer: 0,
            explain: "자연수끼리 2 + 1 = 3, 분수끼리 {3/5} + {1/5} = {4/5} 이니까 {3 4/5} 예요."
          },
          {
            q: "{4 5/6} − {1 2/6} 은 얼마일까요?",
            choices: ["{3 3/6}", "{3 2/6}", "{2 3/6}", "{3 3/12}"],
            answer: 0,
            explain: "자연수끼리 4 − 1 = 3, 분수끼리 {5/6} − {2/6} = {3/6} 이니까 {3 3/6} 이에요."
          },
          {
            q: "{3 6/7} − {2/7} 은 얼마일까요?",
            choices: ["{3 4/7}", "{1 4/7}", "{2 4/7}", "{3 8/7}"],
            answer: 0,
            explain: "자연수 3 은 그대로 두고, 분수끼리 {6/7} − {2/7} = {4/7} 이니까 {3 4/7} 이에요."
          },
          {
            q: "다음 중 가장 큰 분수는 어느 것일까요?",
            choices: ["{1/3}", "{1/5}", "{1/8}", "{1/2}"],
            answer: 3,
            explain: "분자가 1 인 분수는 분모가 작을수록 커요. 전체를 적게 나눌수록 한 조각이 크기 때문이에요. 그래서 {1/2} 이 가장 커요."
          },
          {
            q: "□ 안에 알맞은 것은 무엇일까요?  {13/6} □ {2 1/6}",
            choices: ["<", ">", "=", "알 수 없어요"],
            answer: 2,
            explain: "13 ÷ 6 = 2 … 1 이니까 {13/6} = {2 1/6} 이에요. 두 분수는 크기가 같아요."
          },
          {
            q: "우유 {4/5} L 중에서 {1/5} L 를 마셨어요. 남은 우유는 몇 L 일까요?",
            choices: ["{3/5}", "{5/5}", "{3/10}", "{4/5}"],
            answer: 0,
            explain: "{4/5} − {1/5} = {3/5} 이니까 남은 우유는 {3/5} L 예요."
          }
        ]
      },
      {
        key: "hard",
        name: "어려움",
        icon: "🌳",
        desc: "받아올림·받아내림이 있는 대분수 계산, 문장제, □ 구하기",
        questions: [
          {
            q: "{3 1/4} − {1 3/4} 은 얼마일까요?",
            choices: ["{2 2/4}", "{1 3/4}", "{2/4}", "{1 2/4}"],
            answer: 3,
            explain: "{1/4} 에서 {3/4} 을 뺄 수 없으니 가분수로 바꿔요. {13/4} − {7/4} = {6/4} = {1 2/4} 이에요."
          },
          {
            q: "{4 2/6} − {1 5/6} 은 얼마일까요?",
            choices: ["{2 3/6}", "{3 3/6}", "{2 1/6}", "{3 1/6}"],
            answer: 0,
            explain: "가분수로 바꿔서 빼요. {26/6} − {11/6} = {15/6} = {2 3/6} 이에요."
          },
          {
            q: "{1 5/8} + {2 6/8} 은 얼마일까요?",
            choices: ["{4 3/8}", "{3 3/8}", "{4 11/16}", "{3 11/16}"],
            answer: 0,
            explain: "자연수끼리 1 + 2 = 3, 분수끼리 {5/8} + {6/8} = {11/8} = {1 3/8} 이에요. 3 + {1 3/8} = {4 3/8} 이에요."
          },
          {
            q: "{2 4/7} + {1 5/7} 은 얼마일까요?",
            choices: ["{4 2/7}", "{3 2/7}", "{3 9/14}", "{5 2/7}"],
            answer: 0,
            explain: "자연수끼리 2 + 1 = 3, 분수끼리 {4/7} + {5/7} = {9/7} = {1 2/7} 이에요. 3 + {1 2/7} = {4 2/7} 이에요."
          },
          {
            q: "3 − {1 2/5} 는 얼마일까요?",
            choices: ["{1 3/5}", "{2 2/5}", "{2 3/5}", "{1 2/5}"],
            answer: 0,
            explain: "3 을 {2 5/5} 로 바꿔요. {2 5/5} − {1 2/5} = {1 3/5} 이에요."
          },
          {
            q: "5 − {2 3/8} 은 얼마일까요?",
            choices: ["{2 5/8}", "{3 5/8}", "{3 3/8}", "{2 3/8}"],
            answer: 0,
            explain: "5 를 {4 8/8} 로 바꿔요. {4 8/8} − {2 3/8} = {2 5/8} 이에요."
          },
          {
            q: "□ + {3/9} = {8/9} 일 때, □ 에 알맞은 수는 무엇일까요?",
            choices: ["{5/9}", "{11/9}", "{5/18}", "{3/9}"],
            answer: 0,
            explain: "□ = {8/9} − {3/9} 로 구해요. 8 − 3 = 5 이니까 □ = {5/9} 예요."
          },
          {
            q: "□ − {4/7} = {2/7} 일 때, □ 에 알맞은 수는 무엇일까요?",
            choices: ["{6/7}", "{2/7}", "{5/7}", "{6/14}"],
            answer: 0,
            explain: "□ = {2/7} + {4/7} 로 구해요. 2 + 4 = 6 이니까 □ = {6/7} 이에요."
          },
          {
            q: "피자 한 판을 똑같이 8조각으로 나누었어요. 민수가 3조각, 동생이 2조각을 먹었어요. 남은 피자는 전체의 얼마일까요?",
            choices: ["{5/8}", "{3/5}", "{3/8}", "{2/8}"],
            answer: 2,
            explain: "먹은 피자는 {3/8} + {2/8} = {5/8} 이에요. 남은 피자는 {8/8} − {5/8} = {3/8} 이에요."
          },
          {
            q: "리본 {2 3/5} m 중에서 {1 4/5} m 를 썼어요. 남은 리본은 몇 m 일까요?",
            choices: ["{4/5}", "{1 1/5}", "{1 4/5}", "{4/10}"],
            answer: 0,
            explain: "가분수로 바꿔서 빼요. {13/5} − {9/5} = {4/5} 이니까 남은 리본은 {4/5} m 예요."
          },
          {
            q: "물통에 물이 {1 3/4} L 있어요. 물을 {2 2/4} L 더 부으면 모두 몇 L 일까요?",
            choices: ["{4 1/4}", "{3 1/4}", "{3 5/8}", "{4 3/4}"],
            answer: 0,
            explain: "자연수끼리 1 + 2 = 3, 분수끼리 {3/4} + {2/4} = {5/4} = {1 1/4} 이에요. 3 + {1 1/4} = {4 1/4} 이에요."
          },
          {
            q: "매일 {2/5} km 씩 3일 동안 걸었어요. 모두 몇 km 를 걸었을까요?",
            choices: ["{1 1/5}", "{6/15}", "{1 2/5}", "{5/6}"],
            answer: 0,
            explain: "{2/5} + {2/5} + {2/5} = {6/5} = {1 1/5} 이니까 {1 1/5} km 를 걸었어요."
          },
          {
            q: "□ 안에 알맞은 것은 무엇일까요?  {17/5} □ {3 1/5}",
            choices: ["<", ">", "=", "알 수 없어요"],
            answer: 1,
            explain: "17 ÷ 5 = 3 … 2 이니까 {17/5} = {3 2/5} 예요. {3 2/5} 는 {3 1/5} 보다 크니까 > 예요."
          },
          {
            q: "다음 중 가장 큰 수는 어느 것일까요?",
            choices: ["{2 1/6}", "{15/6}", "{2 4/6}", "{11/6}"],
            answer: 2,
            explain: "모두 가분수로 바꾸면 {13/6}, {15/6}, {16/6}, {11/6} 이에요. {16/6} 인 {2 4/6} 이 가장 커요."
          },
          {
            q: "{6/9} + {7/9} − {5/9} 는 얼마일까요?",
            choices: ["{8/9}", "2", "{4/9}", "{1 1/9}"],
            answer: 0,
            explain: "앞에서부터 차례로 계산해요. {6/9} + {7/9} = {13/9}, {13/9} − {5/9} = {8/9} 예요."
          }
        ]
      }
    ];

    const QUESTIONS_PER_ROUND = 10;

    const $ = (id) => document.getElementById(id);
    const screens = ["home", "quiz", "result", "end"].map($);
    const questionEl = $("question");
    const choicesEl = $("choices");
    const feedbackEl = $("feedback");
    const feedbackTitleEl = $("feedback-title");
    const explainEl = $("explain");
    const nextBtn = $("next-btn");
    const progressLabel = $("progress-label");
    const scoreLabel = $("score-label");
    const progressFill = $("progress-fill");

    let levelIndex = 0;
    let round = [];   // 이번에 풀 문제들
    let current = 0;
    let score = 0;
    const best = {};  // 단계별 최고 점수 (페이지를 새로 열면 지워져요)

    function showScreen(id) {
      screens.forEach((el) => { el.hidden = el.id !== id; });
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // {a/b} 또는 {n a/b} 를 세로 분수 모양 HTML 로 바꿔요
    function fmt(text) {
      return escapeHtml(text).replace(/\{(?:(\d+) )?(\d+)\/(\d+)\}/g, (_, whole, top, bottom) => {
        const label = (whole ? `${whole}과 ` : "") + `${bottom}분의 ${top}`;
        const frac = `<span class="frac" role="img" aria-label="${label}">` +
          `<span class="top" aria-hidden="true">${top}</span>` +
          `<span class="bottom" aria-hidden="true">${bottom}</span></span>`;
        return whole ? `<span class="whole" aria-hidden="true">${whole}</span>${frac}` : frac;
      });
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // 처음 화면의 난이도 버튼
    function renderHome() {
      const levelsEl = $("levels");
      levelsEl.innerHTML = "";
      LEVELS.forEach((level, i) => {
        const btn = document.createElement("button");
        btn.className = `level-btn ${level.key}`;
        const bestText = level.key in best
          ? `<span class="best">최고 점수<br>${best[level.key]} / ${QUESTIONS_PER_ROUND}</span>`
          : "";
        btn.innerHTML =
          `<span class="icon">${level.icon}</span>` +
          `<span><span class="name">${level.name}</span><span class="desc">${level.desc}</span></span>` +
          bestText;
        btn.addEventListener("click", () => startLevel(i));
        levelsEl.appendChild(btn);
      });
      showScreen("home");
    }

    function startLevel(i) {
      levelIndex = i;
      const level = LEVELS[i];
      round = shuffle(level.questions).slice(0, QUESTIONS_PER_ROUND);
      current = 0;
      score = 0;

      $("quiz").className = `card ${level.key}`;
      $("level-badge").textContent = `${level.icon} ${level.name}`;
      showQuestion();
      showScreen("quiz");
    }

    function showQuestion() {
      const item = round[current];

      progressLabel.textContent = `${current + 1}번 / ${round.length}문제`;
      scoreLabel.textContent = `맞힌 문제: ${score}개`;
      progressFill.style.width = `${(current / round.length) * 100}%`;

      questionEl.innerHTML = `${current + 1}. ${fmt(item.q)}`;

      feedbackEl.className = "feedback";
      nextBtn.hidden = true;
      choicesEl.innerHTML = "";

      // 보기 순서도 섞어서 보여줘요
      shuffle(item.choices.map((_, i) => i)).forEach((choiceIdx, pos) => {
        const btn = document.createElement("button");
        btn.className = "choice";
        btn.dataset.index = choiceIdx;
        btn.innerHTML = `<span class="num">${pos + 1}</span><span>${fmt(item.choices[choiceIdx])}</span>`;
        btn.addEventListener("click", () => choose(choiceIdx));
        choicesEl.appendChild(btn);
      });
    }

    function choose(choiceIdx) {
      const item = round[current];
      const isCorrect = choiceIdx === item.answer;
      if (isCorrect) score++;

      choicesEl.querySelectorAll(".choice").forEach((btn) => {
        const idx = Number(btn.dataset.index);
        btn.disabled = true;
        if (idx === item.answer) btn.classList.add("correct");
        else if (idx === choiceIdx) btn.classList.add("wrong");
        else btn.classList.add("dim");
      });

      feedbackEl.className = `feedback show ${isCorrect ? "correct" : "wrong"}`;
      feedbackTitleEl.textContent = isCorrect ? "⭕ 정답이에요! 잘했어요!" : "❌ 아쉬워요! 다시 생각해 봐요.";
      explainEl.innerHTML = `💡 ${fmt(item.explain)}`;

      scoreLabel.textContent = `맞힌 문제: ${score}개`;
      progressFill.style.width = `${((current + 1) / round.length) * 100}%`;

      nextBtn.textContent = current === round.length - 1 ? "결과 보기 🏁" : "다음 문제 ▶";
      nextBtn.hidden = false;
      nextBtn.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function next() {
      current++;
      if (current < round.length) {
        showQuestion();
        window.scrollTo({ top: 0, behavior: "smooth" });
      } else {
        showResult();
      }
    }

    function showResult() {
      const level = LEVELS[levelIndex];
      const total = round.length;
      best[level.key] = Math.max(best[level.key] ?? 0, score);

      $("result").className = `card result ${level.key}`;
      $("result-badge").textContent = `${level.icon} ${level.name} 단계 결과`;
      $("result-score").textContent = `${score} / ${total}`;

      let emoji, message;
      if (score === total) {
        emoji = "🏆"; message = "모두 맞혔어요! 분수 박사님이에요!";
      } else if (score >= 8) {
        emoji = "🌟"; message = "아주 잘했어요! 조금만 더 하면 만점이에요!";
      } else if (score >= 5) {
        emoji = "😊"; message = "잘했어요! 틀린 문제를 다시 풀어 봐요.";
      } else {
        emoji = "💪"; message = "괜찮아요! 다시 풀면서 분수와 친해져 봐요.";
      }
      $("result-emoji").textContent = emoji;
      $("result-message").textContent = message;

      // 마지막 단계(어려움)에서는 다음 단계 버튼을 숨겨요
      const nextLevel = LEVELS[levelIndex + 1];
      const nextLevelBtn = $("next-level-btn");
      nextLevelBtn.hidden = !nextLevel;
      if (nextLevel) nextLevelBtn.textContent = `⬆️ 다음 단계 (${nextLevel.name})`;

      showScreen("result");
    }

    function showEnd() {
      const recordsEl = $("records");
      recordsEl.innerHTML = "";
      LEVELS.forEach((level) => {
        const li = document.createElement("li");
        li.className = level.key;
        const scoreText = level.key in best ? `${best[level.key]} / ${QUESTIONS_PER_ROUND}` : "아직 안 풀었어요";
        li.innerHTML = `<span class="label">${level.icon} ${level.name}</span><span>${scoreText}</span>`;
        recordsEl.appendChild(li);
      });
      showScreen("end");
    }

    nextBtn.addEventListener("click", next);
    $("quit-btn").addEventListener("click", renderHome);
    $("retry-btn").addEventListener("click", () => startLevel(levelIndex));
    $("next-level-btn").addEventListener("click", () => startLevel(levelIndex + 1));
    $("home-btn").addEventListener("click", renderHome);
    $("end-btn").addEventListener("click", showEnd);
    $("restart-btn").addEventListener("click", renderHome);

    renderHome();

    // 홈 화면에 설치하기
    // 안드로이드·PC 크롬: 브라우저가 설치 가능하다고 알려 줄 때만 버튼을 보여 주고, 누르면 설치 창을 띄워요.
    // 아이폰·아이패드: 자동 설치 창이 없어서, 누르면 "공유 → 홈 화면에 추가" 순서를 안내해요.
    // 이미 앱으로 열었거나 설치된 기기에서는 버튼을 숨겨요.
    let installEvent = null;
    let showGuide = false;
    const installArea = $("install-area");
    const isStandalone = () =>
      window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
    const isIOS = () =>
      /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    function renderInstall() {
      if (isStandalone()) { installArea.innerHTML = ""; return; }
      if (showGuide) {
        installArea.innerHTML = `<div class="install-guide">
          <button class="close" id="install-close" aria-label="닫기">✕</button>
          <b>📲 아이폰·아이패드에 설치하기</b>
          <ol><li><b>사파리</b>에서 이 페이지를 열어요.</li>
            <li>화면 아래(아이패드는 위)의 <b>공유 버튼</b> <span style="white-space:nowrap">(□↑)</span>을 눌러요.</li>
            <li>목록을 내려 <b>홈 화면에 추가</b>를 누르고, 오른쪽 위 <b>추가</b>를 눌러요.</li></ol>
          <span style="color:var(--muted)">홈 화면에 생긴 분수 퀴즈 아이콘으로 열면 앱처럼 전체 화면으로 열려요.</span></div>`;
        $("install-close").addEventListener("click", () => { showGuide = false; renderInstall(); });
        return;
      }
      if (installEvent || isIOS()) {
        installArea.innerHTML = `<button class="install-btn" id="install-btn">📲 홈 화면에 설치하기</button>`;
        $("install-btn").addEventListener("click", installApp);
        return;
      }
      installArea.innerHTML = "";
    }

    async function installApp() {
      if (installEvent) {
        const ev = installEvent;
        installEvent = null;
        ev.prompt();
        try { await ev.userChoice; } catch (e) {}
        renderInstall();
      } else if (isIOS()) {
        showGuide = true;
        renderInstall();
      }
    }

    function toast(msg) {
      const t = document.createElement("div");
      t.className = "toast";
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      installEvent = e;
      renderInstall();
    });
    window.addEventListener("appinstalled", () => {
      installEvent = null;
      renderInstall();
      toast("홈 화면에 설치했어요! 🎉");
    });
    renderInstall();

    // 앱처럼 설치하고 인터넷 없이도 쓸 수 있게 해요
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
